<body>

<div id="app">


  <header id="topbar"><div class="revision-header">
  <div class="revision-header-top"><button id="revision-mobile-menu" type="button" aria-label="Open navigation menu" aria-controls="revision-nav" aria-expanded="false">☰</button><a class="revision-brand" href="/GcseVault/revision/" aria-label="Revision homepage">Revision</a><label class="site-switcher"><span>Switch site</span><select aria-label="Switch site" onchange="if(this.value)location.href=this.value"><option value="" selected disabled>Switch site</option><option value="/GcseVault/quotes/">QuoteVault</option><option value="/GcseVault/dates/">DateVault</option><option value="/GcseVault/revision/">Revision</option><option value="/GcseVault/">GCSE Vault home</option></select></label></div>
  <div class="revision-header-bottom"><nav id="revision-nav" aria-label="Revision sections">
      <details class="revision-nav-menu"><summary><span>Study</span><strong id="revision-nav-study-current">Overview</strong><span class="revision-nav-chevron">⌄</span></summary><div class="revision-nav-options"><button type="button" data-view="overview">Overview</button><button type="button" data-view="cards">Flashcards</button></div></details>
      <details class="revision-nav-menu"><summary><span>Library</span><strong id="revision-nav-library-current">Library</strong><span class="revision-nav-chevron">⌄</span></summary><div class="revision-nav-options"><button type="button" data-view="library">Library</button><button type="button" data-view="resources">Course materials</button><button type="button" data-view="public">Public notes</button></div></details>
      <details class="revision-nav-menu"><summary><span>Progress</span><strong id="revision-nav-progress-current">Progress</strong><span class="revision-nav-chevron">⌄</span></summary><div class="revision-nav-options"><button type="button" data-view="analytics">Progress</button><button type="button" data-view="leaderboard">Leaderboard</button></div></details>
      <details class="revision-nav-menu"><summary><span>Tools</span><strong id="revision-nav-tools-current">Tools</strong><span class="revision-nav-chevron">⌄</span></summary><div class="revision-nav-options"><button type="button" data-view="create">New card</button><button type="button" data-view="graph">Knowledge map</button><button type="button" data-view="settings">Settings</button><button type="button" data-view="ai">AI tools</button></div></details>
    </nav><div class="global-search"><input id="revision-search" type="search" placeholder="Search cards, topics, notes…" autocomplete="off" aria-label="Search revision content" oninput="searchRevision(this.value)"><div id="revision-search-results" class="search-results" hidden></div></div><select id="revision-set-switcher" aria-label="Current revision set" onchange="switchRevisionSet(this.value)"></select><div class="revision-toolbar"><span id="sync-status" class="sync-status" role="status">Saved on this device</span><button class="btn bsm" id="new-card">＋ New card</button></div></div>
</div></header>
  <aside id="sidebar" role="navigation" aria-label="Main navigation">
    <div class="sb-logo"><div class="sb-logo-main">Revision</div><div class="sb-logo-sub">Study workspace</div></div>
    
    <a class="sb-link" href="/GcseVault/admin/">Admin workspace</a>
    <a class="sb-link" href="/GcseVault/">GCSE Vault</a>
  </aside>

    <section id="page"></section>
  </main>
