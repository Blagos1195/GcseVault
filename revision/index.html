<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Revision</title>
<link rel="icon" href="data:,">
<script src="../shared.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:13px;height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
:root{
  --bg:#0b0a14;--bg2:#12111f;--bg3:#1a192b;--bg4:#22203a;--bg5:#2a2840;
  --card:#161526;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--border3:rgba(255,255,255,0.22);
  --text:#dddaf0;--text2:#9a98b5;--text3:#5a587a;
  --gold:#e8c547;--gold2:#f5d76e;--gold3:#a88a20;
  --purple:#7c5cbf;--purple2:#9b7ee0;--purple3:#c4aaff;
  --teal:#2cb67d;--teal2:#3de09a;
  --coral:#e85d4a;--coral2:#ff7b6b;
  --blue:#4a9eff;--pink:#d4549a;
  --amber:#f5a623;--green:#3ecf8e;--red:#ff4d4d;
  --sidebar:196px;
}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;z-index:200;flex-shrink:0;transition:transform .2s}
#sidebar::-webkit-scrollbar{width:3px}
#sidebar::-webkit-scrollbar-thumb{background:var(--border2)}
.sb-logo{padding:12px 12px 10px;border-bottom:1px solid var(--border)}
.sb-logo-main{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--gold);font-weight:600;display:flex;align-items:center;gap:6px}
.sb-logo-sub{font-size:.6rem;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.sb-sec{font-size:.58rem;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;padding:10px 12px 3px}
.ni{display:flex;align-items:center;gap:7px;padding:6px 8px;cursor:pointer;border-radius:6px;margin:1px 5px;font-size:.78rem;color:var(--text2);transition:all .1s;user-select:none;white-space:nowrap}
.ni:hover{background:var(--bg3);color:var(--text)}
.ni.active{background:rgba(124,92,191,.28);color:var(--purple3);font-weight:500}
.ni-icon{font-size:.85rem;width:16px;text-align:center;flex-shrink:0}
.sb-foot{margin-top:auto;padding:8px 10px;border-top:1px solid var(--border);font-size:.68rem;color:var(--text3)}
.sb-xp{color:var(--gold);margin-top:2px;font-size:.72rem}
.sb-due{color:var(--coral);margin-top:2px;font-size:.7rem}
.sb-link{display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:.75rem;color:var(--blue);text-decoration:none;border-top:1px solid var(--border);transition:background .1s}
.sb-link:hover{background:var(--bg3);color:var(--blue)}
#main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}
#topbar{height:44px;min-height:44px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 14px;flex-shrink:0}
.tb-title{font-family:'Playfair Display',serif;font-size:1rem;color:var(--gold);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#page{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;padding-bottom:60px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#page::-webkit-scrollbar{width:4px}
#page::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
#hbg{display:none;background:none;border:none;color:var(--text);font-size:1.1rem;cursor:pointer;padding:4px}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150}
@media(max-width:620px){#hbg{display:block}#sidebar{position:fixed;left:0;top:0;transform:translateX(-100%)}#sidebar.open{transform:translateX(0)}#page{padding-bottom:120px;-webkit-overflow-scrolling:touch}#app{height:100dvh}}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:520px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.scard{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.snum{font-size:1.5rem;font-weight:600;line-height:1.1}
.slbl{font-size:.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.tag{display:inline-block;font-size:.62rem;padding:1px 7px;border-radius:20px;font-weight:500;line-height:1.5}
.tp{background:rgba(124,92,191,.2);color:var(--purple3)}
.tt{background:rgba(44,182,125,.14);color:var(--teal2)}
.tc-tag{background:rgba(232,93,74,.14);color:var(--coral2)}
.tg{background:rgba(232,197,71,.14);color:var(--gold)}
.tb{background:rgba(74,158,255,.14);color:var(--blue)}
.tk{background:rgba(212,84,154,.14);color:var(--pink)}
.bm{background:rgba(44,182,125,.14);color:var(--teal2);font-size:.62rem;padding:1px 7px;border-radius:20px}
.bl{background:rgba(232,197,71,.14);color:var(--gold);font-size:.62rem;padding:1px 7px;border-radius:20px}
.bn{background:rgba(74,158,255,.1);color:var(--blue);font-size:.62rem;padding:1px 7px;border-radius:20px}
.bd{background:rgba(245,166,35,.2);color:var(--amber);font-size:.62rem;padding:1px 7px;border-radius:20px}
.stars{color:var(--gold);font-size:.72rem}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;font-size:.78rem;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text);transition:all .1s}
.btn:hover{background:var(--bg3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bp{background:var(--purple);border-color:var(--purple);color:#fff}.bp:hover{background:var(--purple2)}
.bg{background:var(--gold);border-color:var(--gold);color:#0b0a14;font-weight:600}.bg:hover{background:var(--gold2)}
.br{background:rgba(232,93,74,.15);border-color:var(--coral);color:var(--coral2)}.br:hover{background:rgba(232,93,74,.25)}
.bsm{padding:3px 9px;font-size:.72rem}
.bblk{width:100%;justify-content:center}
.pb{width:100%;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin:3px 0 7px}
.pbf{height:100%;border-radius:3px;background:var(--teal);transition:width .3s}
.pbf.pu{background:var(--purple2)}.pbf.pg{background:var(--gold)}.pbf.pr{background:var(--coral)}
.fg{margin-bottom:10px}
.fg label{font-size:.72rem;color:var(--text2);display:block;margin-bottom:3px}
input[type=text],input[type=number],select,textarea{font-family:'DM Sans',sans-serif;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:7px;padding:7px 10px;font-size:.8rem;width:100%;transition:border-color .1s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple)}
textarea{resize:vertical;line-height:1.5}
select option{background:var(--bg3)}
.fbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px}
.fbtn{padding:3px 9px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.7rem;cursor:pointer;transition:all .1s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.fbtn:hover,.fbtn.active{background:var(--purple);border-color:var(--purple);color:#fff}
.dc{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:10px 13px;margin-bottom:7px;transition:border-color .12s}
.dc:hover{border-color:var(--border2)}
.dc-date{font-family:'DM Mono',monospace;font-size:.95rem;color:var(--gold);margin-bottom:3px;font-weight:500}
.dc-event{font-size:.88rem;line-height:1.5;margin-bottom:4px;color:var(--text)}
.dc-sig{font-size:.72rem;color:var(--text2);line-height:1.5;margin-bottom:5px}
.dc-m{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:.65rem;color:var(--text3)}
.dc-note{margin-top:5px;font-size:.68rem;color:var(--amber);background:rgba(245,166,35,.07);padding:3px 8px;border-radius:5px;border-left:2px solid var(--amber)}
.fc-wrap{max-width:540px;margin:0 auto}
.fc{height:180px;position:relative;cursor:pointer;border-radius:14px}
.fc-s{border-radius:14px;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;display:flex;width:100%;position:absolute;top:0;left:0;right:0;bottom:0}
.fc-front{background:var(--bg3);border:1px solid var(--border2);visibility:visible;opacity:1;pointer-events:auto;z-index:2}
.fc-back{background:linear-gradient(135deg,rgba(124,92,191,.2),rgba(44,182,125,.1));border:1px solid var(--purple);visibility:hidden;opacity:0;pointer-events:none;z-index:1}
.fc.flip .fc-front{visibility:hidden;opacity:0;pointer-events:none;z-index:1}
.fc.flip .fc-back{visibility:visible;opacity:1;pointer-events:auto;z-index:2}
.fc-lbl{font-size:.62rem;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.fc-main{font-family:'DM Mono',monospace;font-size:1.05rem;line-height:1.65;color:var(--gold)}
.fc-sub{font-size:.72rem;color:var(--text2);margin-top:7px;line-height:1.5}
.fc-hint{font-size:.65rem;color:var(--text3);margin-top:8px}
.qq{font-family:'DM Sans',sans-serif;font-size:.98rem;line-height:1.65;background:var(--bg3);border:1px solid var(--border2);border-radius:9px;padding:13px 15px;margin-bottom:10px}
.qfb{border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.78rem;line-height:1.5}
.qok{background:rgba(44,182,125,.12);border:1px solid rgba(44,182,125,.28);color:var(--text)}
.qwr{background:rgba(232,93,74,.12);border:1px solid rgba(232,93,74,.28);color:var(--text)}
.hint{font-size:.7rem;color:var(--text3);margin-top:4px;font-style:italic}
.dr{border-radius:7px;padding:7px 10px;margin-bottom:5px;font-size:.8rem;line-height:1.5}
.dr-ok{background:rgba(44,182,125,.1);border:1px solid rgba(44,182,125,.22);color:var(--text)}
.dr-near{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.22);color:var(--text)}
.dr-miss{background:rgba(232,93,74,.1);border:1px solid rgba(232,93,74,.22);color:var(--text2)}
.bback{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text2);font-size:.75rem;cursor:pointer;margin-bottom:11px;transition:all .1s;font-family:'DM Sans',sans-serif}
.bback:hover{background:var(--bg4);color:var(--text)}
.pt{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--gold);margin-bottom:2px}
.ps{font-size:.72rem;color:var(--text3);margin-bottom:11px}
.sec{font-size:.68rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;margin-top:13px}
.div{height:1px;background:var(--border);margin:11px 0}
#toast{position:fixed;bottom:14px;right:14px;background:var(--bg3);border:1px solid var(--teal);color:var(--teal2);padding:7px 13px;border-radius:9px;font-size:.78rem;z-index:9999;transform:translateX(130px);opacity:0;transition:all .22s;pointer-events:none;max-width:260px}
#toast.show{transform:translateX(0);opacity:1}
#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:center;justify-content:center;padding:14px}
#modal-bg.open{display:flex}
#modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:22px 20px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.55)}
#modal::-webkit-scrollbar{width:3px}
#modal::-webkit-scrollbar-thumb{background:var(--border2)}
.srow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:none}
.ach{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:9px}
.ach.locked{opacity:.3;filter:grayscale(1)}
.ach-i{font-size:1.5rem}
.ach-n{font-size:.78rem;font-weight:600;color:var(--gold)}
.ach-d{font-size:.68rem;color:var(--text3)}
.hm-grid{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.hm-cell{width:12px;height:12px;border-radius:2px;background:var(--bg4);transition:background .2s;cursor:default;flex-shrink:0}

.knowledge-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr);gap:12px;max-width:1100px;margin:0 auto}
.knowledge-panel{min-width:0}
.knowledge-list{display:grid;gap:7px;margin-top:9px}
.knowledge-item{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;cursor:pointer}
.knowledge-item:hover,.knowledge-item.active{border-color:var(--purple);background:rgba(124,92,191,.1)}
.knowledge-dot{width:9px;height:9px;border-radius:50%;background:var(--teal);margin-top:4px;flex-shrink:0}
.knowledge-title{font-size:.82rem;font-weight:600;color:var(--text)}
.knowledge-meta{font-size:.65rem;color:var(--text3);margin-top:3px}
.knowledge-links{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.knowledge-link{font-size:.63rem;padding:2px 6px;border-radius:12px;background:rgba(74,158,255,.12);color:var(--blue);cursor:pointer}
.knowledge-link:hover{background:rgba(74,158,255,.25)}
.graph{position:relative;min-height:300px;overflow:hidden;background:radial-gradient(circle at center,rgba(124,92,191,.12),transparent 62%),var(--bg3);border:1px solid var(--border);border-radius:10px}
.graph svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.graph line{stroke:var(--border3);stroke-width:1.5}
.graph-node{position:absolute;transform:translate(-50%,-50%);max-width:118px;padding:7px 9px;border:1px solid var(--purple);border-radius:8px;background:var(--card);color:var(--text);font-size:.65rem;text-align:center;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.2)}
.graph-node:hover,.graph-node.active{background:var(--purple);color:#fff}
.suggestion{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.suggestion:last-child{border-bottom:none}
.suggestion-name{font-size:.76rem;color:var(--text)}
.suggestion-reason{font-size:.62rem;color:var(--text3);margin-top:2px}
.ai-output{white-space:pre-wrap;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.72rem;line-height:1.6;max-height:360px;overflow:auto}
.ai-warning{padding:9px 10px;background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);border-radius:8px;color:var(--amber);font-size:.72rem;line-height:1.5}
@media(max-width:760px){.knowledge-layout{grid-template-columns:1fr}.graph{min-height:270px}}

</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="sb-logo"><div class="sb-logo-main">🧠 Revision</div><div class="sb-logo-sub">Linked knowledge</div></div>
    <div class="sb-sec">Workspace</div>
    <div class="ni active" data-view="overview"><span class="ni-icon">◈</span>Overview</div>
    <div class="ni" data-view="cards"><span class="ni-icon">▣</span>Flashcards</div>

    <div class="ni" data-view="public"><span class="ni-icon">☁</span>Public notes</div>

<script>
const REVISION_KEY = 'revision_knowledge_cards';
const REVISION_PROGRESS_KEY = 'revision_knowledge_progress';
const starterCards = [
  {id:'r1',subject:'History',topic:'Industrial Revolution',title:'Why did cities grow?',answer:'Factories created jobs, drawing people from rural areas into expanding industrial cities.',links:['r2'],difficulty:2},
  {id:'r2',subject:'History',topic:'Industrial Revolution',title:'What was urbanisation?',answer:'The movement of people from the countryside to towns and cities.',links:['r1','r3'],difficulty:1},
  {id:'r3',subject:'History',topic:'Industrial Revolution',title:'What problems did urbanisation cause?',answer:'Overcrowding, poor sanitation, disease, pollution and unsafe housing.',links:['r2'],difficulty:3},
  {id:'r4',subject:'Science',topic:'Cells',title:'What do mitochondria do?',answer:'They release energy through aerobic respiration.',links:[],difficulty:2}
];
const storedCards = JSON.parse(localStorage.getItem(REVISION_KEY) || 'null');
const onlyDemoCards = Array.isArray(storedCards) && storedCards.length > 0 && storedCards.every(card => ['r1','r2','r3','r4'].includes(card.id));
const state = {
  cards: onlyDemoCards ? [] : (storedCards || []),
  progress: JSON.parse(localStorage.getItem(REVISION_PROGRESS_KEY) || '{}'),
  view: 'overview', selected: null, studyIndex: 0, revealed: false,
  xp: Number(localStorage.getItem('revision_xp') || 0),
  streak: Number(localStorage.getItem('revision_streak') || 0),
  lastReview: localStorage.getItem('revision_last_review') || '',
  publicNotes: [], aiResult: null, syncing: false
};

function saveRevision(){
  localStorage.setItem(REVISION_KEY,JSON.stringify(state.cards));
  localStorage.setItem(REVISION_PROGRESS_KEY,JSON.stringify(state.progress));
  localStorage.setItem('revision_xp',String(state.xp));
  localStorage.setItem('revision_streak',String(state.streak));
  localStorage.setItem('revision_last_review',state.lastReview);
  syncRevisionSoon();
}
function escapeRevision(value){return UI.escapeHTML(String(value||''));}
function cardById(id){return state.cards.find(card=>card.id===id);}
function linkedCards(card){return (card.links||[]).map(cardById).filter(Boolean);}
function topicStats(){
  const stats={};
  state.cards.forEach(card=>{stats[card.topic]??={total:0,reviewed:0,due:0};stats[card.topic].total++;if(state.progress[card.id])stats[card.topic].reviewed++;if(!state.progress[card.id]||state.progress[card.id].due<=Date.now())stats[card.topic].due++;});
  return stats;
}
function suggestedTopics(){
  return Object.entries(topicStats()).sort(([,a],[,b])=>b.due-a.due||a.reviewed/a.total-b.reviewed/b.total).slice(0,4);
}
function revisionUserKey(){return VaultUser.getKey();}
function revisionUsername(){return VaultUser.getUsername();}
let revisionSyncTimer=null;
function syncRevisionSoon(){clearTimeout(revisionSyncTimer);if(revisionUserKey()&&revisionUsername())revisionSyncTimer=setTimeout(syncRevision,700);}
async function syncRevision(){
  if(!revisionUserKey()||!revisionUsername()||state.syncing)return;
  state.syncing=true;
  try{await fetch(`${ThemeManager.WORKER_URL}/revision/sync`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userKey:revisionUserKey(),username:revisionUsername(),cards:state.cards,progress:state.progress,xp:state.xp,streak:state.streak})});}catch(error){}finally{state.syncing=false;}
}
async function loadRevision(){
  if(!revisionUserKey())return;
  try{const response=await fetch(`${ThemeManager.WORKER_URL}/revision/sync?userKey=${encodeURIComponent(revisionUserKey())}`);const payload=await response.json();if(payload.found&&payload.data){state.cards=Array.isArray(payload.data.cards)?payload.data.cards:[];state.progress=payload.data.progress||{};state.xp=Math.max(state.xp,Number(payload.data.xp)||0);state.streak=Math.max(state.streak,Number(payload.data.streak)||0);saveRevision();}}catch(error){}
}
async function loadPublicNotes(){try{const response=await fetch(`${ThemeManager.WORKER_URL}/revision/public${revisionUserKey()?`?userKey=${encodeURIComponent(revisionUserKey())}`:''}`);const payload=await response.json();state.publicNotes=payload.notes||[];renderRevision();}catch(error){state.publicNotes=[];}}
function awardRevisionXP(score){
  const today=new Date().toISOString().slice(0,10);const previous=state.lastReview;
  if(score){state.xp+=10;if(previous!==today){const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);state.streak=previous===yesterday?state.streak+1:1;state.lastReview=today;}}
}
function setRevisionAccount(){
  const username=(prompt('Choose a username (3–20 letters, numbers, _ or -):',revisionUsername()||'')||'').trim();if(!username)return;
  const keyInput=prompt('Paste an existing user key, or leave blank to create an account:',revisionUserKey()||'');
  if(keyInput?.trim())VaultUser.setKey(keyInput.trim());
  VaultUser.setUsername(username);
  if(!revisionUserKey()){fetch(`${ThemeManager.WORKER_URL}/lb/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,site:'qv',mastered:0,xp:0,mastered_ids:[],pending_ids:[],pending_data:[],theme:localStorage.getItem('vt_theme')||'default'})}).then(response=>response.json()).then(data=>{if(data.userKey){VaultUser.setKey(data.userKey);syncRevision();renderRevision();}else{alert(data.error||'Could not create account.')}}).catch(()=>alert('Could not connect to the account service.'));}
  else{syncRevision();renderRevision();}
}
function clearRevisionData(){if(!confirm('Delete all local Revision cards and progress?'))return;state.cards=[];state.progress={};state.xp=0;state.streak=0;state.lastReview='';saveRevision();renderRevision();}
function renderGraph(){
  const cards=state.cards.slice(0,24), width=600, height=300, center={x:50,y:50};
  const positions=cards.map((card,index)=>{const angle=(Math.PI*2*index/cards.length)-Math.PI/2;const radius=cards.length===1?0:35;return{x:center.x+Math.cos(angle)*radius,y:center.y+Math.sin(angle)*radius,card};});
  const lines=positions.flatMap(node=>linkedCards(node.card).map(link=>{const target=positions.find(item=>item.card.id===link.id);return target?`<line x1="${node.x}%" y1="${node.y}%" x2="${target.x}%" y2="${target.y}%"></line>`:''})).join('');
  return `<div class="graph"><svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">${lines}</svg>${positions.map(node=>`<button class="graph-node${state.selected===node.card.id?' active':''}" style="left:${node.x}%;top:${node.y}%" onclick="selectRevisionCard('${node.card.id}')">${escapeRevision(node.card.title)}</button>`).join('')}</div>`;
}
function renderCardList(cards=state.cards){
  return `<div class="knowledge-list">${cards.map(card=>`<div class="knowledge-item${state.selected===card.id?' active':''}" onclick="selectRevisionCard('${card.id}')"><span class="knowledge-dot"></span><div><div class="knowledge-title">${escapeRevision(card.title)}</div><div class="knowledge-meta">${escapeRevision(card.subject)} · ${escapeRevision(card.topic)} · ${linkedCards(card).length} linked idea${linkedCards(card).length===1?'':'s'}</div><div class="knowledge-links">${linkedCards(card).map(link=>`<span class="knowledge-link" onclick="event.stopPropagation();selectRevisionCard('${link.id}')">↗ ${escapeRevision(link.title)}</span>`).join('')}</div></div></div>`).join('')}</div>`;
}
function renderSuggestions(){
  const suggestions=suggestedTopics();
  return `<div class="card"><div class="sec" style="margin-top:0">Suggested next topics</div>${suggestions.length?suggestions.map(([topic,stats])=>`<div class="suggestion"><div><div class="suggestion-name">${escapeRevision(topic)}</div><div class="suggestion-reason">${stats.due} card${stats.due===1?'':'s'} due · ${stats.reviewed}/${stats.total} reviewed</div></div><button class="btn bsm" onclick="startTopic('${encodeURIComponent(topic)}')">Study</button></div>`).join(''):'<div class="ps">Add cards to receive recommendations.</div>'}</div>`;
}
function renderOverview(){
  const selected=cardById(state.selected);
  return `<div><div class="pt">Knowledge workspace</div><div class="ps">Build links between ideas, then revise the connections instead of isolated facts.</div><div class="knowledge-layout"><div class="knowledge-panel"><div class="g3"><div class="scard"><div class="snum">${state.cards.length}</div><div class="slbl">Cards</div></div><div class="scard"><div class="snum">${state.cards.reduce((n,c)=>n+(c.links||[]).length,0)/2|0}</div><div class="slbl">Connections</div></div><div class="scard"><div class="snum">${Object.keys(state.progress).length}</div><div class="slbl">Reviewed</div></div></div><div class="sec">Your knowledge graph</div>${renderGraph()}${renderCardList()}</div><div class="knowledge-panel">${renderSuggestions()}${selected?`<div class="card" style="margin-top:10px"><div class="sec" style="margin-top:0">Selected idea</div><div class="knowledge-title">${escapeRevision(selected.title)}</div><p style="font-size:.76rem;line-height:1.6;color:var(--text2);margin-top:7px">${escapeRevision(selected.answer)}</p><div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn bp" onclick="startStudy('${selected.id}')">Review</button><button class="btn" onclick="linkRevisionCard('${selected.id}')">＋ Link idea</button><button class="btn" onclick="editRevisionCard('${selected.id}')">✏ Edit</button><button class="btn br" onclick="deleteRevisionCard('${selected.id}')">🗑 Delete</button></div></div>`:''}</div></div></div>`;
}
function renderCards(){
  const card=state.cards[state.studyIndex%Math.max(state.cards.length,1)];
  if(!card)return `<div class="pt">Flashcards</div><div class="ps">No cards yet.</div>`;
  return `<div style="max-width:620px;margin:0 auto"><div class="pt">Flashcards</div><div class="ps">Review linked ideas together. Card ${state.studyIndex%state.cards.length+1} of ${state.cards.length}</div><div class="card" style="min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center"><div class="tag tp">${escapeRevision(card.topic)}</div><div style="font-size:1.15rem;font-weight:600;margin:18px 0">${escapeRevision(card.title)}</div>${state.revealed?`<p style="font-size:.85rem;color:var(--text2);line-height:1.7">${escapeRevision(card.answer)}</p><div class="knowledge-links" style="justify-content:center;margin-top:14px">${linkedCards(card).map(link=>`<span class="knowledge-link" onclick="selectRevisionCard('${link.id}')">↗ ${escapeRevision(link.title)}</span>`).join('')}</div>`:'<div class="ps">Try to answer, then reveal the explanation.</div>'}<div style="display:flex;justify-content:center;gap:7px;margin-top:20px">${state.revealed?`<button class="btn br" onclick="rateCard('${card.id}',0)">Again</button><button class="btn bg" onclick="rateCard('${card.id}',1)">Got it</button>`:`<button class="btn bp" onclick="state.revealed=true;renderRevision()">Reveal answer</button>`}</div></div></div>`;
}
function renderGraphView(){return `<div class="pt">Knowledge graph</div><div class="ps">Select a node to inspect its connected ideas.</div>${renderGraph()}${state.selected?renderCardList([cardById(state.selected)]):''}`;}
function renderCreateCard(){return `<div style="max-width:620px;margin:0 auto"><div class="pt">Create a revision card</div><div class="ps">Add an idea to your private workspace, then link it to related cards from the overview.</div><form class="card" onsubmit="event.preventDefault();submitRevisionCard()"><div class="g2"><div class="fg"><label for="new-card-subject">Subject</label><input id="new-card-subject" type="text" placeholder="e.g. Biology" required></div><div class="fg"><label for="new-card-topic">Topic</label><input id="new-card-topic" type="text" placeholder="e.g. Cells" required></div></div><div class="fg"><label for="new-card-title">Front / question</label><input id="new-card-title" type="text" placeholder="What should you remember?" required></div><div class="fg"><label for="new-card-answer">Back / explanation</label><textarea id="new-card-answer" rows="6" placeholder="Write the answer or explanation..." required></textarea></div><div class="fg"><label for="new-card-difficulty">Difficulty</label><select id="new-card-difficulty"><option value="1">Easy</option><option value="2" selected>Medium</option><option value="3">Hard</option></select></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn bp" type="submit">＋ Add card</button><button class="btn" type="button" onclick="state.view='overview';renderRevision()">Cancel</button></div></form></div>`;}
function renderSettings(){return `<div style="max-width:720px;margin:0 auto"><div class="pt">Settings & account</div><div class="ps">Your Revision workspace syncs through the shared GCSE Vault account.</div><div class="card"><div class="sec" style="margin-top:0">Account</div><div class="srow"><div><div class="knowledge-title">${revisionUsername()?escapeRevision(revisionUsername()):'No account linked'}</div><div class="knowledge-meta">${revisionUserKey()?'Linked across devices':'Create or link an account to sync'}</div></div><button class="btn bp" onclick="setRevisionAccount()">${revisionUsername()?'Manage':'Set up account'}</button></div><div class="srow"><div><div class="knowledge-title">Revision XP</div><div class="knowledge-meta">${state.xp} XP · ${state.streak} day streak · +10 XP per successful review</div></div></div></div><div class="card" style="margin-top:10px"><div class="sec" style="margin-top:0">Notes</div><div class="srow"><div><div class="knowledge-title">${state.cards.length} private cards</div><div class="knowledge-meta">Edit, link, publish, or remove your own cards.</div></div><button class="btn br" onclick="clearRevisionData()">Clear local data</button></div></div></div>`;}
function renderPublicNotes(){return `<div style="max-width:850px;margin:0 auto"><div class="pt">Public notes</div><div class="ps">Browse shared study notes. Public notes are copied into your workspace only when you choose to import them.</div><div style="display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap"><button class="btn bp" onclick="publishRevisionNotes()">☁ Publish my notes</button><button class="btn" onclick="loadPublicNotes()">🔄 Refresh</button></div><div class="knowledge-list">${state.publicNotes.length?state.publicNotes.map(note=>`<div class="card"><div class="tag tg">${escapeRevision(note.subject)}${note.level?' · '+escapeRevision(note.level):''}</div><div class="knowledge-title" style="margin-top:6px">${escapeRevision(note.title)}</div><div class="knowledge-meta">${note.cards?.length||0} cards · ${escapeRevision(note.updatedAt||'')}</div><div style="display:flex;gap:6px;margin-top:8px"><button class="btn bsm" onclick="importPublicNote('${note.id}')">＋ Import copy</button>${note.owned?`<button class="btn bsm br" onclick="deletePublicNote('${note.id}')">🗑 Delete</button>`:''}</div></div>`).join(''):'<div class="ps">No public notes have been published yet.</div>'}</div></div>`;}
function renderLeaderboard(){return `<div style="max-width:620px;margin:0 auto"><div class="pt">Revision leaderboard</div><div class="ps">Earn 10 XP each time you successfully review a card.</div><div class="card"><div id="revision-leaderboard-list" class="knowledge-list"><div class="ps">Loading leaderboard...</div></div></div></div>`;}
function renderAI(){
  const loggedIn=Boolean(AdminManager.getToken());
  return `<div style="max-width:760px;margin:0 auto"><div class="pt">AI revision tools</div><div class="ps">Generate flashcards, practice questions, and linked ideas from your notes. AI use is restricted to an authenticated administrator account.</div>${!loggedIn?`<div class="ai-warning">AI generation is locked. An administrator must log in before provider credits can be used.</div><div class="card" style="max-width:380px;margin-top:10px"><div class="fg"><label>Admin password</label><input type="password" id="revision-ai-password" placeholder="Enter admin password"></div><button class="btn bg" onclick="loginRevisionAI()">🔐 Unlock AI tools</button>${AdminManager.error?`<div class="qfb qwr">${escapeRevision(AdminManager.error)}</div>`:''}</div>`:`<div class="card"><div class="g2"><div class="fg"><label>Subject</label><input type="text" id="ai-subject" placeholder="e.g. Biology"></div><div class="fg"><label>Level</label><input type="text" id="ai-level" placeholder="e.g. GCSE, A-Level"></div></div><div class="fg"><label>Paste notes or source material</label><textarea id="ai-notes" rows="9" placeholder="Paste your notes here..."></textarea></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn bp" onclick="requestRevisionAI()">✦ Generate study guide</button><button class="btn" onclick="AdminManager.logout();renderRevision()">🔒 Lock AI</button></div>${state.aiResult?`<div class="sec">Generated result</div><div class="ai-output">${escapeRevision(JSON.stringify(state.aiResult,null,2))}</div><button class="btn bg" style="margin-top:8px" onclick="importAIResult()">＋ Add flashcards to workspace</button>`:''}</div>`}</div>`;
}
function renderRevision(){
  document.querySelectorAll('.ni').forEach(item=>item.classList.toggle('active',item.dataset.view===state.view));
  document.getElementById('page').innerHTML=state.view==='cards'?renderCards():state.view==='create'?renderCreateCard():state.view==='graph'?renderGraphView():state.view==='ai'?renderAI():state.view==='public'?renderPublicNotes():state.view==='leaderboard'?renderLeaderboard():state.view==='settings'?renderSettings():renderOverview();
  document.getElementById('sidebar-stats').textContent=`${state.cards.length} cards · ${state.cards.reduce((n,c)=>n+(c.links||[]).length,0)/2|0} links`;
  document.getElementById('sidebar-progress').textContent=`${state.xp} XP · ${Object.keys(state.progress).length} reviewed`;
  if(state.view==='leaderboard')loadRevisionLeaderboard();
}
function selectRevisionCard(id){state.selected=id;state.view=state.view==='cards'?'cards':state.view;renderRevision();}
function startTopic(topic){const decoded=decodeURIComponent(topic);const index=state.cards.findIndex(card=>card.topic===decoded);if(index>=0){state.studyIndex=index;state.revealed=false;state.view='cards';renderRevision();}}
function startStudy(id){const index=state.cards.findIndex(card=>card.id===id);if(index>=0){state.studyIndex=index;state.revealed=false;state.view='cards';renderRevision();}}
function rateCard(id,score){state.progress[id]={score,due:Date.now()+(score?86400000*3:0)};awardRevisionXP(score);state.studyIndex=(state.studyIndex+1)%Math.max(state.cards.length,1);state.revealed=false;saveRevision();renderRevision();}
async function loadRevisionLeaderboard(){try{const response=await fetch(`${ThemeManager.WORKER_URL}/revision/leaderboard`);const payload=await response.json();const target=document.getElementById('revision-leaderboard-list');if(!target)return;target.innerHTML=(payload.users||[]).map((user,index)=>`<div class="knowledge-item"><span class="knowledge-dot"></span><div><div class="knowledge-title">${index+1}. ${escapeRevision(user.username)}</div><div class="knowledge-meta">${user.xp||0} XP · ${user.streak||0} day streak</div></div></div>`).join('')||'<div class="ps">No revision accounts yet.</div>';}catch(error){const target=document.getElementById('revision-leaderboard-list');if(target)target.innerHTML='<div class="ps">Leaderboard unavailable.</div>';}}
async function publishRevisionNotes(){if(!revisionUserKey()||!revisionUsername()){alert('Set up an account before publishing notes.');state.view='settings';renderRevision();return;}const title=(prompt('Name this public note set:','My revision notes')||'').trim();if(!title)return;try{const response=await fetch(`${ThemeManager.WORKER_URL}/revision/public`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userKey:revisionUserKey(),note:{title,subject:'General',level:'',cards:state.cards}})});if(!response.ok)throw new Error();alert('Submitted for admin approval. It will appear publicly after review.');}catch(error){alert('Could not submit notes.');}}
async function importPublicNote(id){const note=state.publicNotes.find(item=>item.id===id);if(!note)return;const existing=new Set(state.cards.map(card=>String(card.title).toLowerCase()));const imported=(note.cards||[]).filter(card=>!existing.has(String(card.title||'').toLowerCase())).map(card=>({...card,id:'import'+Date.now()+Math.random().toString(36).slice(2,6),links:[]}));state.cards.push(...imported);saveRevision();state.selected=imported[0]?.id||state.selected;state.view='overview';renderRevision();}
async function deletePublicNote(id){if(!confirm('Delete this public note set?'))return;try{await fetch(`${ThemeManager.WORKER_URL}/revision/public/delete`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userKey:revisionUserKey(),id})});await loadPublicNotes();}catch(error){alert('Could not delete public notes.');}}
async function loginRevisionAI(){const password=document.getElementById('revision-ai-password')?.value||'';if(!password)return;await AdminManager.login(password);renderRevision();}
async function requestRevisionAI(){
  const notes=document.getElementById('ai-notes')?.value||'';if(!notes.trim())return;
  const button=document.querySelector('#page .bp');if(button){button.disabled=true;button.textContent='Generating...';}
  try{
    const response=await fetch(`${ThemeManager.WORKER_URL}/generate?token=${encodeURIComponent(AdminManager.getToken())}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:AdminManager.getToken(),material:`Subject: ${document.getElementById('ai-subject').value}\nLevel: ${document.getElementById('ai-level').value}\n\n${notes}`})});
    const data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);state.aiResult=data.result||data.response||data;renderRevision();
  }catch(error){AdminManager.error=error.message;renderRevision();}
}
function importAIResult(){
  const result=state.aiResult||{};const generated=Array.isArray(result.flashcards)?result.flashcards:[];
  const added=[];generated.forEach(item=>{if(!item.front&&!item.back)return;const card={id:'ai'+Date.now()+Math.random().toString(36).slice(2,6),subject:document.getElementById('ai-subject')?.value||'Custom',topic:'AI generated',title:item.front,answer:item.back,links:[],difficulty:2};state.cards.push(card);added.push(card);});
  const byTitle=new Map(state.cards.map(card=>[card.title.toLowerCase(),card]));
  (result.linked_ideas||[]).forEach(link=>{const first=byTitle.get(String(link.concept_a||'').toLowerCase());const second=byTitle.get(String(link.concept_b||'').toLowerCase());if(first&&second){first.links=first.links||[];second.links=second.links||[];if(!first.links.includes(second.id))first.links.push(second.id);if(!second.links.includes(first.id))second.links.push(first.id);}});
  if(added.length){saveRevision();state.selected=added[0].id;state.view='overview';state.aiResult=null;renderRevision();}
}
function linkRevisionCard(id){
  const source=cardById(id);const choices=state.cards.filter(card=>card.id!==id);if(!source||!choices.length)return;
  const promptText=choices.map((card,index)=>`${index+1}. ${card.title}`).join('\n');const choice=Number(prompt(`Link "${source.title}" to which idea?\n\n${promptText}`));const target=choices[choice-1];if(!target)return;
  source.links=source.links||[];target.links=target.links||[];if(!source.links.includes(target.id))source.links.push(target.id);if(!target.links.includes(source.id))target.links.push(source.id);saveRevision();renderRevision();
}
function createRevisionCard(){
  const title=prompt('What idea should this card explain?');if(!title?.trim())return;
  const answer=prompt('What is the answer or explanation?')||'';const topic=prompt('Which topic is it part of?','My topic')||'My topic';
  const card={id:'r'+Date.now(),subject:'Custom',topic:topic.trim(),title:title.trim(),answer:answer.trim(),links:[],difficulty:2};state.cards.push(card);saveRevision();state.selected=card.id;renderRevision();
}
function submitRevisionCard(){const subject=document.getElementById('new-card-subject').value.trim();const topic=document.getElementById('new-card-topic').value.trim();const title=document.getElementById('new-card-title').value.trim();const answer=document.getElementById('new-card-answer').value.trim();const difficulty=Number(document.getElementById('new-card-difficulty').value)||2;if(!subject||!topic||!title||!answer)return;const card={id:'r'+Date.now(),subject,topic,title,answer,links:[],difficulty};state.cards.push(card);state.selected=card.id;saveRevision();state.view='overview';renderRevision();}
function editRevisionCard(id){const card=cardById(id);if(!card)return;const title=prompt('Edit idea:',card.title);if(!title?.trim())return;const answer=prompt('Edit explanation:',card.answer);const topic=prompt('Edit topic:',card.topic);card.title=title.trim();card.answer=(answer||'').trim();card.topic=(topic||card.topic).trim();saveRevision();renderRevision();}
function deleteRevisionCard(id){const card=cardById(id);if(!card||!confirm(`Delete "${card.title}"?`))return;state.cards=state.cards.filter(item=>item.id!==id);state.cards.forEach(item=>item.links=(item.links||[]).filter(linkId=>linkId!==id));delete state.progress[id];state.selected=null;saveRevision();renderRevision();}
document.querySelectorAll('.ni').forEach(item=>item.addEventListener('click',()=>{state.view=item.dataset.view;if(state.view==='public')loadPublicNotes();renderRevision();}));
document.getElementById('new-card').addEventListener('click',()=>{state.view='create';renderRevision();});
document.getElementById('hbg').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
window.addEventListener('storage',event=>{if(event.key==='vt_theme'&&event.newValue)ThemeManager.applyTheme(event.newValue);});
ThemeManager.initTheme('global');
loadRevision().finally(()=>renderRevision());
</script>
