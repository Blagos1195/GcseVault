<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revision | GCSE Vault</title>
<meta name="description" content="Organise flashcards, course materials and exam practice in one revision workspace.">
<meta name="theme-color" content="#12111f">
<link rel="icon" href="data:,">
<script src="/GcseVault/worker-config.js?v=20261113-staging-config"></script>
<script src="../shared.js?v=20261110-theme-sync"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="revision.css?v=20261113-clean-navigation-v2"><link rel="stylesheet" href="product.css?v=20261110-product-tools">
</head>
<body>

<div id="app">
  <aside id="sidebar" role="navigation" aria-label="Main navigation">
    <div class="sb-logo"><div class="sb-logo-main">Revision</div><div class="sb-logo-sub">Study workspace</div></div>
    <label class="nav-label" for="revision-page-switcher">Go to</label>
    <select id="revision-page-switcher" aria-label="Navigate to a section" onchange="state.view=this.value;renderRevision()">
      <optgroup label="Study"><option value="overview">Overview</option><option value="cards">Flashcards</option></optgroup>
      <optgroup label="Library"><option value="library">Library</option><option value="resources">Course materials</option><option value="public">Public notes</option></optgroup>
      <optgroup label="Progress"><option value="analytics">Progress</option><option value="leaderboard">Leaderboard</option></optgroup>
      <optgroup label="Tools"><option value="create">New card</option><option value="graph">Knowledge map</option><option value="settings">Settings</option><option value="ai">AI tools</option></optgroup>
    </select>
    <a class="sb-link" href="/GcseVault/">GCSE Vault</a>
    <a class="sb-link" href="/GcseVault/quotes/">QuoteVault</a>
    <a class="sb-link" href="/GcseVault/dates/">DateVault</a>
    <a class="sb-link" href="/GcseVault/revision/">Revision</a>
    <a class="sb-link" href="/GcseVault/progress/">Progress dashboard</a>
    <a class="sb-link" href="/GcseVault/admin/">Admin workspace</a>
    <a class="sb-link" href="/GcseVault/feedback/">Feedback & Bugs</a>
    <div class="sb-foot"><div id="sidebar-stats">0 cards · 0 links</div><div class="sb-xp" id="sidebar-progress">0 reviewed</div></div>
  </aside>
  <main id="main">
    <header id="topbar"><button id="hbg" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">☰</button><span class="tb-title">Revision workspace</span><select id="revision-set-switcher" aria-label="Current revision set" onchange="switchRevisionSet(this.value)"></select><div class="global-search"><input id="revision-search" type="search" placeholder="Search cards, topics, notes…" autocomplete="off" aria-label="Search revision content" oninput="searchRevision(this.value)"><div id="revision-search-results" class="search-results" hidden></div></div><span id="sync-status" class="sync-status" role="status">Saved on this device</span><button class="btn bsm" id="new-card">＋ New card</button></header>
    <section id="page"></section>
  </main>
</div>
<div id="overlay"></div><div id="modal-bg"><div id="modal"></div></div><div id="toast"></div>

<script src="app.js?v=20261113-clean-navigation-v2"></script>
<script src="practice.js?v=20261110-product-quality"></script><script src="product.js?v=20261110-product-tools"></script>
<script src="/GcseVault/offline.js?v=20261113-offline-shell-v1"></script>
</body>
</html>
