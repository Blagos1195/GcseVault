<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Revision</title>
<link rel="icon" href="data:,">
<script src="../shared.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:13px;height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
:root{
  --bg:#0b0a14;--bg2:#12111f;--bg3:#1a192b;--bg4:#22203a;--bg5:#2a2840;
  --card:#161526;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--border3:rgba(255,255,255,0.22);
  --text:#dddaf0;--text2:#9a98b5;--text3:#5a587a;
  --gold:#e8c547;--gold2:#f5d76e;--gold3:#a88a20;
  --purple:#7c5cbf;--purple2:#9b7ee0;--purple3:#c4aaff;
  --teal:#2cb67d;--teal2:#3de09a;
  --coral:#e85d4a;--coral2:#ff7b6b;
  --blue:#4a9eff;--pink:#d4549a;
  --amber:#f5a623;--green:#3ecf8e;--red:#ff4d4d;
  --sidebar:196px;
}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;z-index:200;flex-shrink:0;transition:transform .2s}
#sidebar::-webkit-scrollbar{width:3px}
#sidebar::-webkit-scrollbar-thumb{background:var(--border2)}
.sb-logo{padding:12px 12px 10px;border-bottom:1px solid var(--border)}
.sb-logo-main{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--gold);font-weight:600;display:flex;align-items:center;gap:6px}
.sb-logo-sub{font-size:.6rem;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.sb-sec{font-size:.58rem;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;padding:10px 12px 3px}
.ni{display:flex;align-items:center;gap:7px;padding:6px 8px;cursor:pointer;border-radius:6px;margin:1px 5px;font-size:.78rem;color:var(--text2);transition:all .1s;user-select:none;white-space:nowrap}
.ni:hover{background:var(--bg3);color:var(--text)}
.ni.active{background:rgba(124,92,191,.28);color:var(--purple3);font-weight:500}
.ni-icon{font-size:.85rem;width:16px;text-align:center;flex-shrink:0}
.sb-foot{margin-top:auto;padding:8px 10px;border-top:1px solid var(--border);font-size:.68rem;color:var(--text3)}
.sb-xp{color:var(--gold);margin-top:2px;font-size:.72rem}
.sb-due{color:var(--coral);margin-top:2px;font-size:.7rem}
.sb-link{display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:.75rem;color:var(--blue);text-decoration:none;border-top:1px solid var(--border);transition:background .1s}
.sb-link:hover{background:var(--bg3);color:var(--blue)}
#main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}
#topbar{height:44px;min-height:44px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 14px;flex-shrink:0}
.tb-title{font-family:'Playfair Display',serif;font-size:1rem;color:var(--gold);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#page{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;padding-bottom:60px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#page::-webkit-scrollbar{width:4px}
#page::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
#hbg{display:none;background:none;border:none;color:var(--text);font-size:1.1rem;cursor:pointer;padding:4px}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150}
@media(max-width:620px){#hbg{display:block}#sidebar{position:fixed;left:0;top:0;transform:translateX(-100%)}#sidebar.open{transform:translateX(0)}#page{padding-bottom:120px;-webkit-overflow-scrolling:touch}#app{height:100dvh}}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:520px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.scard{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.snum{font-size:1.5rem;font-weight:600;line-height:1.1}
.slbl{font-size:.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.tag{display:inline-block;font-size:.62rem;padding:1px 7px;border-radius:20px;font-weight:500;line-height:1.5}
.tp{background:rgba(124,92,191,.2);color:var(--purple3)}
.tt{background:rgba(44,182,125,.14);color:var(--teal2)}
.tc-tag{background:rgba(232,93,74,.14);color:var(--coral2)}
.tg{background:rgba(232,197,71,.14);color:var(--gold)}
.tb{background:rgba(74,158,255,.14);color:var(--blue)}
.tk{background:rgba(212,84,154,.14);color:var(--pink)}
.bm{background:rgba(44,182,125,.14);color:var(--teal2);font-size:.62rem;padding:1px 7px;border-radius:20px}
.bl{background:rgba(232,197,71,.14);color:var(--gold);font-size:.62rem;padding:1px 7px;border-radius:20px}
.bn{background:rgba(74,158,255,.1);color:var(--blue);font-size:.62rem;padding:1px 7px;border-radius:20px}
.bd{background:rgba(245,166,35,.2);color:var(--amber);font-size:.62rem;padding:1px 7px;border-radius:20px}
.stars{color:var(--gold);font-size:.72rem}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;font-size:.78rem;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text);transition:all .1s}
.btn:hover{background:var(--bg3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bp{background:var(--purple);border-color:var(--purple);color:#fff}.bp:hover{background:var(--purple2)}
.bg{background:var(--gold);border-color:var(--gold);color:#0b0a14;font-weight:600}.bg:hover{background:var(--gold2)}
.br{background:rgba(232,93,74,.15);border-color:var(--coral);color:var(--coral2)}.br:hover{background:rgba(232,93,74,.25)}
.bsm{padding:3px 9px;font-size:.72rem}
.bblk{width:100%;justify-content:center}
.pb{width:100%;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin:3px 0 7px}
.pbf{height:100%;border-radius:3px;background:var(--teal);transition:width .3s}
.pbf.pu{background:var(--purple2)}.pbf.pg{background:var(--gold)}.pbf.pr{background:var(--coral)}
.fg{margin-bottom:10px}
.fg label{font-size:.72rem;color:var(--text2);display:block;margin-bottom:3px}
input[type=text],input[type=number],select,textarea{font-family:'DM Sans',sans-serif;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:7px;padding:7px 10px;font-size:.8rem;width:100%;transition:border-color .1s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple)}
textarea{resize:vertical;line-height:1.5}
select option{background:var(--bg3)}
.fbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px}
.fbtn{padding:3px 9px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.7rem;cursor:pointer;transition:all .1s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.fbtn:hover,.fbtn.active{background:var(--purple);border-color:var(--purple);color:#fff}
.dc{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:10px 13px;margin-bottom:7px;transition:border-color .12s}
.dc:hover{border-color:var(--border2)}
.dc-date{font-family:'DM Mono',monospace;font-size:.95rem;color:var(--gold);margin-bottom:3px;font-weight:500}
.dc-event{font-size:.88rem;line-height:1.5;margin-bottom:4px;color:var(--text)}
.dc-sig{font-size:.72rem;color:var(--text2);line-height:1.5;margin-bottom:5px}
.dc-m{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:.65rem;color:var(--text3)}
.dc-note{margin-top:5px;font-size:.68rem;color:var(--amber);background:rgba(245,166,35,.07);padding:3px 8px;border-radius:5px;border-left:2px solid var(--amber)}
.fc-wrap{max-width:540px;margin:0 auto}
.fc{height:180px;position:relative;cursor:pointer;border-radius:14px}
.fc-s{border-radius:14px;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;display:flex;width:100%;position:absolute;top:0;left:0;right:0;bottom:0}
.fc-front{background:var(--bg3);border:1px solid var(--border2);visibility:visible;opacity:1;pointer-events:auto;z-index:2}
.fc-back{background:linear-gradient(135deg,rgba(124,92,191,.2),rgba(44,182,125,.1));border:1px solid var(--purple);visibility:hidden;opacity:0;pointer-events:none;z-index:1}
.fc.flip .fc-front{visibility:hidden;opacity:0;pointer-events:none;z-index:1}
.fc.flip .fc-back{visibility:visible;opacity:1;pointer-events:auto;z-index:2}
.fc-lbl{font-size:.62rem;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.fc-main{font-family:'DM Mono',monospace;font-size:1.05rem;line-height:1.65;color:var(--gold)}
.fc-sub{font-size:.72rem;color:var(--text2);margin-top:7px;line-height:1.5}
.fc-hint{font-size:.65rem;color:var(--text3);margin-top:8px}
.qq{font-family:'DM Sans',sans-serif;font-size:.98rem;line-height:1.65;background:var(--bg3);border:1px solid var(--border2);border-radius:9px;padding:13px 15px;margin-bottom:10px}
.qfb{border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.78rem;line-height:1.5}
.qok{background:rgba(44,182,125,.12);border:1px solid rgba(44,182,125,.28);color:var(--text)}
.qwr{background:rgba(232,93,74,.12);border:1px solid rgba(232,93,74,.28);color:var(--text)}
.hint{font-size:.7rem;color:var(--text3);margin-top:4px;font-style:italic}
.dr{border-radius:7px;padding:7px 10px;margin-bottom:5px;font-size:.8rem;line-height:1.5}
.dr-ok{background:rgba(44,182,125,.1);border:1px solid rgba(44,182,125,.22);color:var(--text)}
.dr-near{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.22);color:var(--text)}
.dr-miss{background:rgba(232,93,74,.1);border:1px solid rgba(232,93,74,.22);color:var(--text2)}
.bback{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text2);font-size:.75rem;cursor:pointer;margin-bottom:11px;transition:all .1s;font-family:'DM Sans',sans-serif}
.bback:hover{background:var(--bg4);color:var(--text)}
.pt{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--gold);margin-bottom:2px}
.ps{font-size:.72rem;color:var(--text3);margin-bottom:11px}
.sec{font-size:.68rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;margin-top:13px}
.div{height:1px;background:var(--border);margin:11px 0}
#toast{position:fixed;bottom:14px;right:14px;background:var(--bg3);border:1px solid var(--teal);color:var(--teal2);padding:7px 13px;border-radius:9px;font-size:.78rem;z-index:9999;transform:translateX(130px);opacity:0;transition:all .22s;pointer-events:none;max-width:260px}
#toast.show{transform:translateX(0);opacity:1}
#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:center;justify-content:center;padding:14px}
#modal-bg.open{display:flex}
#modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:22px 20px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.55)}
#modal::-webkit-scrollbar{width:3px}
#modal::-webkit-scrollbar-thumb{background:var(--border2)}
.srow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:none}
.ach{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:9px}
.ach.locked{opacity:.3;filter:grayscale(1)}
.ach-i{font-size:1.5rem}
.ach-n{font-size:.78rem;font-weight:600;color:var(--gold)}
.ach-d{font-size:.68rem;color:var(--text3)}
.hm-grid{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.hm-cell{width:12px;height:12px;border-radius:2px;background:var(--bg4);transition:background .2s;cursor:default;flex-shrink:0}

.knowledge-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr);gap:12px;max-width:1100px;margin:0 auto}
.knowledge-panel{min-width:0}
.knowledge-list{display:grid;gap:7px;margin-top:9px}
.knowledge-item{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;cursor:pointer}
.knowledge-item:hover,.knowledge-item.active{border-color:var(--purple);background:rgba(124,92,191,.1)}
.knowledge-dot{width:9px;height:9px;border-radius:50%;background:var(--teal);margin-top:4px;flex-shrink:0}
.knowledge-title{font-size:.82rem;font-weight:600;color:var(--text)}
.knowledge-meta{font-size:.65rem;color:var(--text3);margin-top:3px}
.knowledge-links{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.knowledge-link{font-size:.63rem;padding:2px 6px;border-radius:12px;background:rgba(74,158,255,.12);color:var(--blue);cursor:pointer}
.knowledge-link:hover{background:rgba(74,158,255,.25)}
.graph{position:relative;min-height:300px;overflow:hidden;background:radial-gradient(circle at center,rgba(124,92,191,.12),transparent 62%),var(--bg3);border:1px solid var(--border);border-radius:10px}
.graph svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.graph line{stroke:var(--border3);stroke-width:1.5}
.graph-node{position:absolute;transform:translate(-50%,-50%);max-width:118px;padding:7px 9px;border:1px solid var(--purple);border-radius:8px;background:var(--card);color:var(--text);font-size:.65rem;text-align:center;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.2)}
.graph-node:hover,.graph-node.active{background:var(--purple);color:#fff}
.suggestion{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.suggestion:last-child{border-bottom:none}
.suggestion-name{font-size:.76rem;color:var(--text)}
.suggestion-reason{font-size:.62rem;color:var(--text3);margin-top:2px}
.ai-output{white-space:pre-wrap;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.72rem;line-height:1.6;max-height:360px;overflow:auto}
.ai-warning{padding:9px 10px;background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);border-radius:8px;color:var(--amber);font-size:.72rem;line-height:1.5}
.ai-result-section{margin-top:14px}.ai-result-section h3{font-size:.8rem;color:var(--gold);margin-bottom:7px}.ai-result-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:7px}.ai-result-label{font-size:.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.ai-result-text{font-size:.78rem;line-height:1.55;color:var(--text)}.ai-result-answer{margin-top:7px;padding-top:7px;border-top:1px solid var(--border);color:var(--text2)}.ai-relationship{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px;font-size:.74rem}.ai-relationship span:nth-child(2){color:var(--purple3);text-align:center;font-size:.65rem}
@media(max-width:760px){.knowledge-layout{grid-template-columns:1fr}.graph{min-height:270px}}

</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="sb-logo"><div class="sb-logo-main">🧠 Revision</div><div class="sb-logo-sub">Linked knowledge</div></div>
    <div class="sb-sec">Workspace</div>
    <div class="ni active" data-view="overview"><span class="ni-icon">◈</span>Overview</div>
    <div class="ni" data-view="cards"><span class="ni-icon">▣</span>Flashcards</div>
    <div class="ni" data-view="library"><span class="ni-icon">⌕</span>Library</div>
    <div class="ni" data-view="analytics"><span class="ni-icon">▤</span>Progress</div>
    <div class="ni" data-view="create"><span class="ni-icon">＋</span>New card</div>
    <div class="ni" data-view="graph"><span class="ni-icon">⌘</span>Knowledge graph</div>
    <div class="ni" data-view="public"><span class="ni-icon">☁</span>Public notes</div>
    <div class="ni" data-view="leaderboard"><span class="ni-icon">🏆</span>Leaderboard</div>
    <div class="ni" data-view="settings"><span class="ni-icon">⚙</span>Settings</div>
    <div class="ni" data-view="ai"><span class="ni-icon">✦</span>AI tools</div>
    <a class="sb-link" href="/GcseVault/">⌂ GCSE Vault</a>

    <div class="sb-foot"><div id="sidebar-stats">0 cards · 0 links</div><div class="sb-xp" id="sidebar-progress">0 reviewed</div></div>
  </aside>
  <main id="main">
    <header id="topbar"><button id="hbg" aria-label="Open menu">☰</button><span class="tb-title">Revision workspace</span><button class="btn bsm" id="new-card">＋ New card</button></header>
    <section id="page"></section>
  </main>
</div>
<div id="overlay"></div><div id="modal-bg"><div id="modal"></div></div><div id="toast"></div>

<script>
const REVISION_KEY = 'revision_knowledge_cards';
const REVISION_PROGRESS_KEY = 'revision_knowledge_progress';
const starterCards = [
  {id:'r1',subject:'History',topic:'Industrial Revolution',title:'Why did cities grow?',answer:'Factories created jobs, drawing people from rural areas into expanding industrial cities.',links:['r2'],difficulty:2},
  {id:'r2',subject:'History',topic:'Industrial Revolution',title:'What was urbanisation?',answer:'The movement of people from the countryside to towns and cities.',links:['r1','r3'],difficulty:1},
  {id:'r3',subject:'History',topic:'Industrial Revolution',title:'What problems did urbanisation cause?',answer:'Overcrowding, poor sanitation, disease, pollution and unsafe housing.',links:['r2'],difficulty:3},
  {id:'r4',subject:'Science',topic:'Cells',title:'What do mitochondria do?',answer:'They release energy through aerobic respiration.',links:[],difficulty:2}
];
const storedCards = JSON.parse(localStorage.getItem(REVISION_KEY) || 'null');
const onlyDemoCards = Array.isArray(storedCards) && storedCards.length > 0 && storedCards.every(card => ['r1','r2','r3','r4'].includes(card.id));
const revisionAccountSetsKey = 'revision_account_sets';
const revisionActiveSetKey = 'revision_active_set';
const DEFAULT_REVISION_SET_ID = 'default';
function normalizeRevisionSet(set, fallbackId){
  const id = set && set.id ? String(set.id) : fallbackId || `${DEFAULT_REVISION_SET_ID}-${Date.now()}`;
  return {
    id,
    name: set && set.name ? String(set.name) : 'My main set',
    cards: Array.isArray(set && set.cards) ? set.cards : [],
    progress: set && set.progress && typeof set.progress === 'object' ? set.progress : {},
    xp: Number(set && set.xp) || 0,
    streak: Number(set && set.streak) || 0,
    lastReview: set && set.lastReview ? String(set.lastReview) : '',
    published: Boolean(set && set.published),
    syllabus: Array.isArray(set && set.syllabus) ? set.syllabus : [],
    syllabusDone: set && set.syllabusDone && typeof set.syllabusDone === 'object' ? set.syllabusDone : {},
    reviewLog: Array.isArray(set && set.reviewLog) ? set.reviewLog : []
  };
}
const existingRevisionSets = JSON.parse(localStorage.getItem(revisionAccountSetsKey) || 'null');
const activeSetId = localStorage.getItem(revisionActiveSetKey) || DEFAULT_REVISION_SET_ID;
const existingSetList = Array.isArray(existingRevisionSets) && existingRevisionSets.length ? existingRevisionSets.map(set => normalizeRevisionSet(set, DEFAULT_REVISION_SET_ID)) : [];
const fallbackSet = normalizeRevisionSet({
  id: activeSetId,
  name: 'My main set',
  cards: onlyDemoCards ? [] : (storedCards || []),
  progress: JSON.parse(localStorage.getItem(REVISION_PROGRESS_KEY) || '{}'),
  xp: Number(localStorage.getItem('revision_xp') || 0),
  streak: Number(localStorage.getItem('revision_streak') || 0),
  lastReview: localStorage.getItem('revision_last_review') || ''
}, activeSetId);
const initialRevisionSets = existingSetList.length ? existingSetList : [fallbackSet];
const selectedRevisionSet = initialRevisionSets.find(set => set.id === activeSetId) || initialRevisionSets[0];
const state = {
  cards: Array.isArray(selectedRevisionSet?.cards) ? selectedRevisionSet.cards : (onlyDemoCards ? [] : (storedCards || [])),
  progress: selectedRevisionSet && selectedRevisionSet.progress ? selectedRevisionSet.progress : (JSON.parse(localStorage.getItem(REVISION_PROGRESS_KEY) || '{}')),

  const username=document.getElementById('revision-account-username')?.value.trim()||'';
  if(username.length<3||username.length>20||!/^[a-zA-Z0-9_-]+$/.test(username)){
    state.accountMessage='Use 3–20 letters, numbers, underscores, or hyphens for the username.';
    state.accountMessageType='error';renderRevision();return;
  }
  state.accountMessage='Creating your shared account…';state.accountMessageType='success';renderRevision();
  try{
    const response=await fetch(`${ThemeManager.WORKER_URL}/lb/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,site:'qv',mastered:0,xp:0,mastered_ids:[],pending_ids:[],pending_data:[],theme:localStorage.getItem('vt_theme')||'default'})});
    const data=await response.json();
    if(!response.ok||!data.userKey)throw new Error(data.error||'Could not create account.');
    VaultUser.setUsername(data.user?.username||username);VaultUser.setKey(data.userKey);
    state.accountMessage='Account created. Your revision sets are syncing.';state.accountMessageType='success';

async function linkRevisionAccount(){

  if(userKey.length<10){state.accountMessage='Enter the user key from your other device.';state.accountMessageType='error';renderRevision();return;}
  state.accountMessage='Checking the user key…';state.accountMessageType='success';renderRevision();
  try{
    const response=await fetch(`${ThemeManager.WORKER_URL}/lb/get?userKey=${encodeURIComponent(userKey)}`);

    state.accountMessage=`Linked to ${data.user.username}. Loading your saved revision sets…`;state.accountMessageType='success';

async function syncRevisionTheme(){

function normalizeAIResult(raw, additionalIds=[]){
  let payload = raw;
  if (typeof raw === 'string') {
    try { payload = JSON.parse(raw); } catch (error) { payload = {}; }
  }
  if (payload && payload.choices && Array.isArray(payload.choices)) {
    const content = payload.choices[0]?.message?.content;
    if (typeof content === 'string') {
      try { payload = JSON.parse(content); } catch (error) {
        const match = content.match(/\{[\s\S]*\}/);
        if (match) {
          try { payload = JSON.parse(match[0]); } catch (retryError) { payload = {}; }
        }
      }
    }
  }
  const flashcards = Array.isArray(payload?.flashcards) ? payload.flashcards.map((item, index) => ({
    id: String(item?.id || `c${index + 1}`).trim(),
    front: String(item?.front || '').trim(),
    back: String(item?.back || '').trim()
  })).filter(item => item.front || item.back) : [];
  const cardIds = new Set([...flashcards.map(card => card.id),...additionalIds]);
  const links = Array.isArray(payload?.links) ? payload.links.map(item => ({
    from_id: String(item?.from_id || '').trim(),
    to_id: String(item?.to_id || '').trim()
  })).filter(item => item.from_id !== item.to_id && cardIds.has(item.from_id) && cardIds.has(item.to_id)) : [];
  return { flashcards, links };
}
function renderAIResult(result){

async function requestRevisionAI(){
  const notes=document.getElementById('ai-notes')?.value||'';
  const requestedMode=document.getElementById('ai-mode')?.value||'new';
  if(!notes.trim()&&requestedMode!=='links'){state.aiNotice='Add topic notes or attach a notes file before generating flashcards.';renderRevision();return;}
  state.aiDraft.mode=requestedMode;
  state.aiResult=null;
  state.aiNotice='';
  const button=document.querySelector('#page .bp');
  const showStatus=(message,isError=false)=>{
    let status=document.getElementById('revision-ai-status');
    if(!status){
      status=document.createElement('div');
      status.id='revision-ai-status';
      status.className=`qfb ${isError?'qwr':'ai-warning'}`;
      status.setAttribute('role','status');
      status.setAttribute('aria-live','polite');
      button?.parentElement?.insertAdjacentElement('afterend',status);
    }
    status.className=`qfb ${isError?'qwr':'ai-warning'}`;
    status.textContent=message;
  };
  const controller=new AbortController();
  const startedAt=Date.now();
  let timer;
  const timeout=setTimeout(()=>controller.abort(),120000);
  if(button){button.disabled=true;button.textContent=requestedMode==='add'?'Finding missing cards...':requestedMode==='links'?'Finding links...':'Generating flashcards...';}
  showStatus('Sending your notes to the worker...');
  timer=setInterval(()=>showStatus(`Waiting for the AI response (${Math.floor((Date.now()-startedAt)/1000)}s). The model does not provide live progress.`),1000);
  try{
    const token=AdminManager.getToken();
    if(!token) throw new Error('Admin login expired. Please sign in again.');
    const count=Math.max(5,Math.min(100,Number(document.getElementById('ai-count')?.value)||30));
    const mode=requestedMode;
    state.aiDraft.mode=mode;
    state.aiDraft.count=String(count);
    const existingCards=mode==='new'?[]:state.cards.map(card=>({id:card.id,front:card.title,back:card.answer}));
    const response=await fetch(`${ThemeManager.WORKER_URL}/generate?token=${encodeURIComponent(token)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,count,mode,existingCards,material:`Subject: ${document.getElementById('ai-subject')?.value || ''}\nLevel: ${document.getElementById('ai-level')?.value || ''}\n\n${notes||'Find useful connections among the existing cards.'}`}),signal:controller.signal});
    showStatus('Response received. Reading the study guide...');
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||`HTTP ${response.status}`);
    state.aiResult=normalizeAIResult(data,existingCards.map(card=>card.id));
    state.aiNotice=mode==='links'?`Preview ready: ${state.aiResult.links.length} connections. Nothing has been changed yet.`:state.aiResult.flashcards.length?`Preview ready: ${state.aiResult.flashcards.length} flashcards and ${state.aiResult.links.length} links. Nothing has been saved yet.`:'No flashcards were returned. Add more topic notes or check that the requested action matches the content.';
    AdminManager.error='';
    renderRevision();
  }catch(error){
    const message=error.name==='AbortError'?'No response after 2 minutes. The browser stopped waiting; the worker may still have completed the request. Check worker logs before retrying.':error.message||'Study guide generation failed.';
    AdminManager.error=message;
    renderRevision();
    showStatus(message,true);
  } finally {
    clearTimeout(timeout);
    clearInterval(timer);
    const readyButton=document.querySelector('#page .bp');
    if(readyButton){readyButton.disabled=false;readyButton.textContent=`✦ ${aiActionLabel()}`;}
  }
}
function importAIResult(){
  const mode=state.aiDraft.mode||'new';
  const result=normalizeAIResult(state.aiResult||{},mode==='new'?[]:state.cards.map(card=>card.id));
  const subject=document.getElementById('ai-subject')?.value.trim()||'General';
  const level=document.getElementById('ai-level')?.value.trim()||'';
  const requestedName=document.getElementById('ai-set-name')?.value.trim()||'';
  const baseName=requestedName||`${subject}${level?` ${level}`:''} study guide`;
  let name=baseName;let suffix=2;
  if(mode==='new')while(state.accountSets.some(set=>set.name.toLowerCase()===name.toLowerCase()))name=`${baseName} (${suffix++})`;
  const makeId=()=>`ai${Date.now()}${Math.random().toString(36).slice(2,7)}`;
  const idMap=new Map();
  if(mode!=='new')state.cards.forEach(card=>idMap.set(card.id,card.id));
  const cards=result.flashcards.filter(item=>item.front||item.back).map(item=>{
    const id=mode==='links'&&cardById(item.id)?item.id:makeId();idMap.set(item.id,id);
    return {id,subject,topic:mode==='new'?name:(item.topic||getActiveRevisionSet().name),title:item.front,answer:item.back,source:document.getElementById('ai-source')?.value.trim()||state.aiDraft.source||'',links:[],difficulty:2};
  });
  const targetCards=mode==='new'?cards:[...state.cards,...cards];
  result.links.forEach(link=>{
    const from=idMap.get(link.from_id),to=idMap.get(link.to_id);
    if(!from||!to||from===to)return;
    const first=targetCards.find(card=>card.id===from),second=targetCards.find(card=>card.id===to);
    if(first&&!first.links.includes(to))first.links.push(to);
    if(second&&!second.links.includes(from))second.links.push(from);
  });
  if(mode==='links'){
    if(!result.links.length){state.setMessage='No valid links were returned for this set.';renderRevision();return;}
    state.aiResult=null;state.setMessage=`Repaired ${result.links.length} connections in “${getActiveRevisionSet().name}”.`;state.view='overview';saveRevision();renderRevision();return;
  }
  if(!cards.length){state.setMessage='The AI did not return any flashcards to apply.';renderRevision();return;}
  if(mode==='add'){
    state.cards.push(...cards);state.selected=cards[0].id;state.aiResult=null;state.setMessage=`Added ${cards.length} flashcards and ${result.links.length} connections to “${getActiveRevisionSet().name}”.`;
  }else{
    const newSet=normalizeRevisionSet({id:`set-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,name,cards,progress:{},xp:0,streak:0,lastReview:'',published:false});
    state.accountSets.push(newSet);state.activeSetId=newSet.id;state.cards=newSet.cards;state.progress={};state.xp=0;state.streak=0;state.lastReview='';
    state.selected=cards[0].id;state.aiResult=null;state.setMessage=`Saved ${cards.length} flashcards with ${result.links.length} connections in “${name}”.`;
  }
  state.view='overview';
  saveRevision();renderRevision();
}

  const card={id:'r'+Date.now(),subject:'Custom',topic:topic.trim(),title:title.trim(),answer:answer.trim(),links:[],difficulty:2};state.cards.push(card);saveRevision();state.selected=card.id;renderRevision();
}
function submitRevisionCard(){const subject=document.getElementById('new-card-subject').value.trim();const topic=document.getElementById('new-card-topic').value.trim();const title=document.getElementById('new-card-title').value.trim();const answer=document.getElementById('new-card-answer').value.trim();const source=document.getElementById('new-card-source').value.trim();const difficulty=Number(document.getElementById('new-card-difficulty').value)||2;if(!subject||!topic||!title||!answer)return;const card={id:'r'+Date.now(),subject,topic,title,answer,source,links:[],difficulty};state.cards.push(card);state.selected=card.id;saveRevision();state.view='overview';renderRevision();}
function editRevisionCard(id){const card=cardById(id);if(!card)return;const title=prompt('Edit idea:',card.title);if(!title?.trim())return;const answer=prompt('Edit explanation:',card.answer);const topic=prompt('Edit topic:',card.topic);card.title=title.trim();card.answer=(answer||'').trim();card.topic=(topic||card.topic).trim();saveRevision();renderRevision();}
function deleteRevisionCard(id){const card=cardById(id);if(!card)return;state.cards=state.cards.filter(item=>item.id!==id);state.cards.forEach(item=>item.links=(item.links||[]).filter(linkId=>linkId!==id));delete state.progress[id];state.selected=null;saveRevision();renderRevision();}

const revisionSidebar = document.getElementById('sidebar');
const revisionHbg = document.getElementById('hbg');
const revisionOverlay = document.getElementById('overlay');

document.querySelectorAll('.ni').forEach(item => {
  item.addEventListener('click', () => {
    const nextView = item.dataset.view || 'overview';
    state.view = nextView;
    renderRevision();
    if (revisionSidebar) revisionSidebar.classList.remove('open');
    if (revisionOverlay) revisionOverlay.style.display = 'none';
  });
});
if (revisionHbg) {
  revisionHbg.addEventListener('click', () => {
    if (!revisionSidebar) return;
    const isOpen = revisionSidebar.classList.toggle('open');
    if (revisionOverlay) revisionOverlay.style.display = isOpen ? 'block' : 'none';
  });
}
if (revisionOverlay) {
  revisionOverlay.addEventListener('click', () => {
    if (revisionSidebar) revisionSidebar.classList.remove('open');
    revisionOverlay.style.display = 'none';
  });
}
const revisionQuickCreate = document.getElementById('new-card');
if (revisionQuickCreate) {
  revisionQuickCreate.addEventListener('click', () => {
    state.view = 'create';
    renderRevision();
  });
}

renderRevision();
ThemeManager.initTheme('global');
syncRevisionTheme();
loadRevision();
loadPublicNotes();
</script>
