<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revision | GCSE Vault</title>
<meta name="description" content="Organise flashcards, course materials and exam practice in one revision workspace.">
<meta name="theme-color" content="#12111f">
<link rel="icon" href="data:,">
<script src="/GcseVault/worker-config.js?v=20261113-staging-config"></script>
<script src="../shared.js?v=20261110-theme-sync"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="revision.css?v=20261114-mobile-menu-v1"><link rel="stylesheet" href="product.css?v=20261110-product-tools">
</head>
<body>

<div id="app">


  <header id="topbar"><div class="revision-search-row"><button id="revision-mobile-menu" type="button" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false">☰</button><div class="revision-brand">Revision</div><div class="global-search"><input id="revision-search" type="search" placeholder="Search cards, topics, notes…" autocomplete="off" aria-label="Search revision content" oninput="searchRevision(this.value)"><div id="revision-search-results" class="search-results" hidden></div></div><select id="revision-set-switcher" aria-label="Current revision set" onchange="switchRevisionSet(this.value)"></select></div><div class="revision-toolbar"><span id="sync-status" class="sync-status" role="status">Saved on this device</span><button class="btn bsm" id="new-card">＋ New card</button></div></header>
  <aside id="sidebar" role="navigation" aria-label="Main navigation">
    <div class="sb-logo"><div class="sb-logo-main">Revision</div><div class="sb-logo-sub">Study workspace</div></div>
    <nav id="revision-nav" aria-label="Revision sections">
      <label class="nav-group nav-study"><span>Study</span><select aria-label="Study navigation" onchange="if(this.value){state.view=this.value;renderRevision()}"><option value="" selected>Study</option><option value="overview">Overview</option><option value="cards">Flashcards</option></select></label>
      <label class="nav-group nav-library"><span>Library</span><select aria-label="Library navigation" onchange="if(this.value){state.view=this.value;renderRevision()}"><option value="" selected>Library</option><option value="library">Library</option><option value="resources">Course materials</option><option value="public">Public notes</option></select></label>
      <label class="nav-group nav-progress"><span>Progress</span><select aria-label="Progress navigation" onchange="if(this.value){state.view=this.value;renderRevision()}"><option value="" selected>Progress</option><option value="analytics">Progress</option><option value="leaderboard">Leaderboard</option></select></label>
      <label class="nav-group nav-tools"><span>Tools</span><select aria-label="Tools navigation" onchange="if(this.value){state.view=this.value;renderRevision()}"><option value="" selected>Tools</option><option value="create">New card</option><option value="graph">Knowledge map</option><option value="settings">Settings</option><option value="ai">AI tools</option></select></label>
    </nav>
    <a class="sb-link" href="/GcseVault/admin/">Admin workspace</a>
    <a class="sb-link" href="/GcseVault/">GCSE Vault</a>
  </aside>
  <main id="main">
    <section id="page"></section>
  </main>
</div>
<div id="overlay"></div><div id="modal-bg"><div id="modal"></div></div><div id="toast"></div>

<script src="app.js?v=20261113-render-null-guard-v1"></script>
<script src="practice.js?v=20261110-product-quality"></script><script src="product.js?v=20261110-product-tools"></script>
<script src="/GcseVault/offline.js?v=20261113-offline-shell-v1"></script>
</body>
</html>
