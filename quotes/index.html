function getMPts(id){return S.masteryPts[id]||S.masteryPts[String(id)]||S.masteryPts[+id]||0;}
function addMPts(id,delta){
  const cur=getMPts(id);
  const next=Math.max(0,Math.min(100,cur+delta));
  S.masteryPts[id]=next;
  // Check both numeric and string forms to guard against localStorage type mismatch
  const wasMastered=S.mastered.has(id)||S.mastered.has(String(id))||S.mastered.has(+id);
  const wasLearning=S.learning.has(id)||S.learning.has(String(id))||S.learning.has(+id);
  if(next>=100&&!wasMastered){
    S.mastered.add(id);S.learning.delete(id);
    onMastery();
    toast('⭐ Mastered! +10 XP');addXP(10);
  } else if(next>=30&&!wasLearning&&!wasMastered){
    S.learning.add(id);
  } else if(next<30&&wasLearning&&!wasMastered){
    S.learning.delete(id);
  } else if(next<50&&wasMastered){
    S.mastered.delete(id);S.mastered.delete(String(id));
    S.learning.add(id);
    toast('📉 Mastery lost — keep practising');
  }
  save();
}
function mastPct(id){
  if(S.mastered.has(id)||S.mastered.has(String(id))||S.mastered.has(+id))return 100;
  const pts=getMPts(id);
  if(pts>0)return Math.min(100,pts);
  const srs=qSRS(id);
  return S.learning.has(id)?Math.min(29,Math.round(((srs.reps||0)/4)*25)):Math.min(10,(srs.reps||0)*3);
}
function mastColor(pct){
  return pct>=100?'var(--teal)':pct>=60?'var(--gold)':pct>=30?'var(--amber)':'var(--purple2)';
}

function normQ(s){
  return s.toLowerCase()
    .replace(/['']/g,"'").replace(/[""]/g,'"')
    .replace(/\s+/g,' ').replace(/[^a-z0-9 ',.-]/g,'').trim();
}
function lev(a,b){
  if(!a.length)return b.length;if(!b.length)return a.length;
  const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];
  for(let j=0;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    m[i][j]=a[i-1]===b[j-1]?m[i-1][j-1]:1+Math.min(m[i-1][j],m[i][j-1],m[i-1][j-1]);
  return m[a.length][b.length];
}
function wordSim(wa,wb){
  let matched=0;
  wa.forEach(w=>{
    if(wb.has(w)){matched++;return;}
    for(const bw of wb){if(w.length>3&&bw.length>3&&lev(w,bw)<=2){matched++;return;}}
  });
  return wa.length&&wb.size?(2*matched)/(wa.length+wb.size):0;
}
function sim(a,b){
  const na=normQ(a),nb=normQ(b);
  if(na===nb)return 1;
  if(na.length<=30&&nb.length<=30){
    const d=lev(na,nb);const mx=Math.max(na.length,nb.length);
    const levScore=1-d/mx;
    if(levScore>0.8)return levScore;
  }
  const wa=na.split(' ').filter(w=>w.length>2);
  const wb=new Set(nb.split(' ').filter(w=>w.length>2));
  if(!wa.length||!wb.size)return 0;
  return wordSim(wa,wb);
}

function bestMatch(inp,pool){
  let best=0,q=null;
  pool.forEach(p=>{const s=sim(inp,p.text);if(s>best){best=s;q=p;}});
  return{score:best,quote:q};
}

// Returns works PLUS individual poem titles for P&C so games can filter by poem
function worksAndPoems(){
  const qs=allQ();
  const w=['All',...new Set(qs.map(q=>q.work))];
  // Insert poem names under "Power and Conflict"
  const poems=[...new Set(qs.filter(q=>q.work==='Power and Conflict').map(q=>q.loc))].sort();
  const idx=w.indexOf('Power and Conflict');
  if(idx!==-1) w.splice(idx+1,0,...poems.map(p=>'📜 '+p));
  return w;
}
// Filter a pool by a worksAndPoems() selection value
function filterPool(pool,sel){
  if(sel==='All')return pool;
  if(sel.startsWith('📜 ')){const loc=sel.slice(2).trim();return pool.filter(q=>q.loc===loc);}
  return pool.filter(q=>q.work===sel);
}

// Apply multi-select S.flt to a pool
function applyFilters(pool){
  let out=pool;
  const ws=S.flt.works;
  const ts=S.flt.themes;
  const sr=S.flt.search.toLowerCase().trim();
  if(!ws.has('All')){
    out=out.filter(q=>{
      for(const w of ws){
        if(w.startsWith('📜 ')){if(q.loc===w.slice(2).trim())return true;}
        else{if(q.work===w)return true;}
      }
      return false;
    });
  }
  if(!ts.has('All')){
    out=out.filter(q=>(q.themes||[]).some(t=>[...ts].some(sel=>t.toLowerCase().includes(sel.toLowerCase()))));
  }
  if(sr){
    out=out.filter(q=>
      q.text.toLowerCase().includes(sr)||
      (q.char||'').toLowerCase().includes(sr)||
      (q.themes||[]).join(' ').toLowerCase().includes(sr)||
      (q.analysis||'').toLowerCase().includes(sr)||
      (q.loc||'').toLowerCase().includes(sr)||
      (q.work||'').toLowerCase().includes(sr)
    );
  }
  return out;
}

let _libSearchTimer=null;

  const val=el.value;

function rateSRS(id,grade){
  // grade: 0=Blackout, 1=Hard, 2=Good, 3=Easy, 4=Perfect
  const mDelta=[-30,-10,15,22,30][grade]??0;
  addMPts(id,mDelta);
  const srsGrade=grade<=0?0:grade<=1?1:grade<=2?2:3;
  const srs=sm2({...qSRS(id)},srsGrade);
  setQSRS(id,srs);
  const xpMap=[0,2,5,10,15];addXP(xpMap[grade]||0);
  save();
  toast(`+${xpMap[grade]||0} XP · Next in ${srs.interval}d`);
  render();
}

function fcPickNext(pool){
  // In random mode: pick unseen first, then reshuffle seen
  const fc=S.fc;
  const unseenIdxs=[...pool.keys()].filter(i=>!fc.seen.has(i));
  if(unseenIdxs.length){
    return unseenIdxs[Math.floor(Math.random()*unseenIdxs.length)];
  }
  // All seen — just pick any random excluding current
  const histPos=fc.histPos??fc.history.length-1;
  const cur=fc.history[histPos]??0;
  const others=[...pool.keys()].filter(i=>i!==cur%pool.length);
  return others.length?others[Math.floor(Math.random()*others.length)]:0;
}
function fcNext(){
  const pool=applyFilters(allQ()).length?applyFilters(allQ()):allQ();
  const fc=S.fc;
  // Trim history to current position (discard forward history if we'd gone back)
  const histPos=fc.histPos??fc.history.length-1;
  fc.history=fc.history.slice(0,histPos+1);
  let nextIdx;
  if(fc.random){
    nextIdx=fcPickNext(pool);
  } else {
    const cur=fc.history[fc.history.length-1]??0;
    nextIdx=(cur+1)%pool.length;
  }
  fc.history.push(nextIdx);
  fc.histPos=fc.history.length-1;
  if(!fc.seen)fc.seen=new Set();
  fc.seen.add(nextIdx);
  fc.flipped=false;
  render();
}
function fcPrev(){
  const fc=S.fc;
  const histPos=fc.histPos??fc.history.length-1;
  if(histPos<=0)return;
  fc.histPos=histPos-1;
  fc.flipped=false;
  render();
}
function fcToggleRandom(){

function fcResetSeen(){
  S.fc.seen=new Set();
  S.fc.history=S.fc.history.slice(-1);

function fcRandom(){

function rateFC(id,grade){
  // grade: 0=Blackout, 1=Hard, 2=Good, 3=Easy, 4=Mastered
  const mDelta=[-30,-10,15,22,35][grade]??0;
  addMPts(id,mDelta);
  const srsGrade=grade===0?0:grade===1?1:grade===2?2:3;
  const srs=sm2({...qSRS(id)},srsGrade);

function startFill() {
  let pool = applyFilters(allQ());
  if (!pool.length) pool = allQ();
  if (!pool.length) {
    alert('No quotes available.');
    return;
  }

  // Pick a random quote
  const q = pool[Math.floor(Math.random() * pool.length)];

  // Split into words
  const words = q.text.trim().split(/\s+/);
  if (!words.length) {
    alert('Selected quote is empty.');
    return;
  }

  // Build candidate positions (meaningful words only)
  const candidates = [];
  for (let i = 0; i < words.length; i++) {
    const clean = words[i].replace(/[^a-zA-Z']/g, '');
    if (clean.length >= 4) candidates.push(i);
  }

  const blanks = [];

  // Fallback for very short quotes
  if (candidates.length <= 2) {
    const mid =
      candidates.length
        ? candidates[Math.floor(candidates.length / 2)]
        : Math.floor(words.length / 2);
    blanks.push(mid);
  } else {
    // Decide how many grouped gaps to create
    let numGroups;
    if (words.length < 8) {
      numGroups = 1;
    } else if (words.length < 15) {
      numGroups = 1 + Math.floor(Math.random() * 2); // 1–2 groups
    } else {
      numGroups = 2 + Math.floor(Math.random() * 2); // 2–3 groups
    }

    // Shuffle candidates manually (avoids dependency on shuf())
    const shuffled = [...candidates];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    const used = new Set();

    for (let g = 0; g < numGroups; g++) {
      let start = null;

      // Find a candidate not too close to existing gaps
      for (const idx of shuffled) {
        let tooClose = false;
        for (const u of used) {
          if (Math.abs(idx - u) < 4) {
            tooClose = true;
            break;
          }
        }
        if (!tooClose) {
          start = idx;
          break;
        }
      }

      if (start === null) break;

      // Gap size: 2–4 words
      const gapSize = 2 + Math.floor(Math.random() * 3);

      for (let j = 0; j < gapSize; j++) {
        const pos = start + j;
        if (pos >= words.length) break;
        if (blanks.includes(pos)) continue;

        const clean = words[pos].replace(/[^a-zA-Z']/g, '');
        if (clean.length >= 2) {
          blanks.push(pos);
          used.add(pos);
        }
      }
    }
  }

  // Final fallback
  if (!blanks.length) {
    blanks.push(Math.floor(words.length / 2));
  }

  // Sort blank positions
  blanks.sort((a, b) => a - b);

  // Store game state
  S.fill = {
    active: true,
    q: q,
    blanks: blanks,
    vals: {},
    checked: false
  };

  // Render the fill-the-gap screen
  render();

  // Focus the first blank
  setTimeout(function () {
    const first = document.getElementById('b' + blanks[0]);
    if (first) first.focus();
  }, 50);
}
function checkFill(){
  S.fill.checked=true;
  const allOk=S.fill.blanks.every(i=>{
    const w=S.fill.q.text.split(' ')[i].replace(/[^a-zA-Z']/g,'');
    const ans=(S.fill.vals[i]||'').trim();
    return fillMatch(w,ans);
  });
  addMPts(S.fill.q.id,allOk?20:-8);
  if(allOk)addXP(10);
  render();
}
function fillKeydown(e, i) {
  const blanks = S.fill.blanks;
  const pos = blanks.indexOf(i);
  const isLast = pos === blanks.length - 1;
  if (e.key === 'Enter') {
    if (isLast) { e.preventDefault(); checkFill(); }
    else { e.preventDefault(); const next = document.getElementById('b' + blanks[pos + 1]); if (next) next.focus(); }
  } else if (e.key === 'Tab' && !e.shiftKey && !isLast) {
    e.preventDefault(); const next = document.getElementById('b' + blanks[pos + 1]); if (next) next.focus();
  }
}
// Typo-tolerant match for fill blanks: exact, or 1 edit distance for words ≥5 chars
function fillMatch(expected,given){
  const a=expected.toLowerCase(),b=given.toLowerCase();
  if(a===b)return true;
  if(a.length>=5&&b.length>=2&&lev(a,b)<=1)return true;
  return false;
}

  S.tc.idx++;
  if(el){el.value='';el.focus();}
  // Just update the result area without full re-render, keeping timer alive
  const res=document.querySelector('.qfb');
  const msg=ok?'✅ Correct! +5 XP':close?'🟡 Close! +2 XP':'❌ Answer: '+correct;
  const cls=ok?'qok':close?'':'qwr';
  const style=close?'margin-top:8px;background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.3);':'margin-top:8px';
  if(res){res.className='qfb '+cls;res.style.cssText=style;res.innerHTML=msg;}
  else{
    const qEl=document.querySelector('.qq');
    if(qEl){
      const newRes=document.createElement('div');
      newRes.className='qfb '+cls;newRes.style.cssText=style;newRes.style.marginTop='8px';
      newRes.textContent=msg;
      qEl.parentNode.insertBefore(newRes,qEl.nextSibling.nextSibling||null);
    }
  }
  // Update score
  const scoreEl=document.querySelector('[style*="var(--gold)"]');
  if(scoreEl&&scoreEl.tagName==='STRONG')scoreEl.textContent=S.tc.score;
  // After brief pause, clear feedback and advance question
  setTimeout(()=>{
    const nextQ=S.tc.qs[S.tc.idx%S.tc.qs.length];
    const qqEl=document.querySelector('.qq');
    if(qqEl&&S.tc.tLeft>0){
      const tp2=S.tc.type||'who_said';
      let np='';
      if(tp2==='who_said')np=`"${nextQ.text.split(' ').slice(0,8).join(' ')}…"`;
      else if(tp2==='first_word')np=`"${nextQ.text.split(' ')[0]}…" (${nextQ.work} · ${nextQ.char})`;
      else np=`"${nextQ.text}"`;
      qqEl.innerHTML=np+`<div style="font-size:.7rem;color:var(--text3);margin-top:4px">${tp2==='who_said'?nextQ.work+' · '+nextQ.loc:nextQ.char+' · '+nextQ.work}</div>`;
      const rfb=document.querySelector('.qfb');if(rfb)rfb.remove();
    }
    save();
  },800);
}

function rDump(){

    <button class="btn bg bblk" onclick="runDump()">Check My Quotes →</button>
  </div>`:`
  <button class="bback" onclick="S.dump.done=false;render()">← Try again</button>
  <div class="g3" style="margin-bottom:10px">
    <div class="scard"><div class="snum" style="color:var(--teal)">${S.dump.results.filter(r=>r.s==='ok').length}</div><div class="slbl">✅ Correct</div></div>
    <div class="scard"><div class="snum" style="color:var(--amber)">${S.dump.results.filter(r=>r.s==='near').length}</div><div class="slbl">⚠ Nearly</div></div>
    <div class="scard"><div class="snum" style="color:var(--coral)">${S.dump.results.filter(r=>r.s==='miss').length}</div><div class="slbl">❌ Not found</div></div>
  </div>
  <div style="font-size:.72rem;color:var(--text3);margin-bottom:8px">${pct(S.dump.results.filter(r=>r.s==='ok').length,S.dump.results.length)}% accuracy · ${S.dump.results.length} attempted</div>
  ${S.dump.results.map(r=>`<div class="dr ${r.s==='ok'?'dr-ok':r.s==='near'?'dr-near':'dr-miss'}">
    <span>${r.s==='ok'?'✅':r.s==='near'?'⚠️':'❌'}</span> <em>"${r.input}"</em>
    ${r.s!=='ok'&&r.match?`<div class="dr-sub">Closest: <em>"${r.match.text}"</em> — ${r.match.char}, ${r.match.work}</div>`:''}
    ${r.s==='ok'&&r.match?`<div class="dr-sub">${r.match.char} · ${r.match.work} · ${r.match.loc}</div>`:''}
  </div>`).join('')}
  `}
  </div>`;
}
function runDump(){
  const t=document.getElementById('dt').value;
  const lines=t.split('\n').map(l=>l.trim()).filter(l=>l.length>4);
  const pool=applyFilters(allQ());
  S.dump.results=lines.map(line=>{
    const {score,quote}=bestMatch(line,pool);
    const status=score>.78?'ok':score>.42?'near':'miss';
    if(quote){
      if(status==='ok')addMPts(quote.id,20);
      else if(status==='near')addMPts(quote.id,5);
    }
    return{input:line,s:status,match:quote};
  });
  addXP(S.dump.results.filter(r=>r.s==='ok').length*8);
  S.dump.done=true;render();
}

let _liveTimer;

async function saveQuote(){
  const t=(document.getElementById('a-t')?.value||'').trim();
  const c=(document.getElementById('a-c')?.value||'').trim();
  if(!t||!c){toast('Fill in quote text and character');return;}
  const act=(document.getElementById('a-act')?.value||'').trim();
  const sc=(document.getElementById('a-sc')?.value||'').trim();
  const tempId=Date.now().toString()+'-qv'+Math.random().toString(36).slice(2,6);
  const q={
    id:tempId,
    work:document.getElementById('a-w').value,
    char:c,loc:`${act}${sc?', '+sc:''}`.trim()||'Unknown',
    themes:(document.getElementById('a-th').value||'').split(',').map(t=>t.trim()).filter(Boolean),
    methods:(document.getElementById('a-me').value||'').split(',').map(m=>m.trim()).filter(Boolean),
    text:t,analysis:document.getElementById('a-an').value,
    stars:+document.getElementById('a-st').value,
    acc:document.getElementById('a-ac').value,
    note:document.getElementById('a-no').value,
    submittedAt:new Date().toISOString(),
    _submittedByMe:true,
    _status:'pending',
  };
  const fbEl=document.getElementById('add-fb');
  fbEl.innerHTML=`<div class="qfb" style="background:rgba(74,158,255,.08);border:1px solid rgba(74,158,255,.25);color:var(--blue)">⏳ Submitting…</div>`;
  try{
    const resp=await fetch(WORKER_URL+'/submit',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(q)
    });
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const result=await resp.json();
    // Use the worker-assigned ID
    if(result.id)q.id=result.id;
    // Save to pending so it shows up immediately in library & games
    S.pending=S.pending.filter(p=>p.id!==q.id);
    S.pending.push(q);
    save();
    // Push pending IDs to worker (so other devices can pick up this submission)
    lbUpdate();
    toast('📬 Quote submitted! Showing in your library while awaiting review.');
    // Reset form fields BEFORE render() so the fresh form is blank
    ['a-t','a-c','a-act','a-sc','a-th','a-me','a-an','a-no'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
    const liveDup=document.getElementById('live-dup');if(liveDup)liveDup.innerHTML='';
    buildNav();
    // Re-render the Add page so the pending list updates and fields are truly blank
    // We set the feedback AFTER render so it doesn't get wiped
    render();
    // Now the page has been re-rendered — find the feedback div in the new DOM
    const newFb=document.getElementById('add-fb');
    if(newFb)newFb.innerHTML=`<div class="qfb" style="background:rgba(124,92,191,.1);border:1px solid rgba(124,92,191,.3);color:var(--purple3)">📬 Submitted for review!<br><em style="font-size:.72rem">"${t.slice(0,60)}"</em><br><span style="font-size:.65rem;color:var(--text3)">Visible in your library now — an admin must approve it to appear for everyone.</span></div>`;
  }catch(e){
    fbEl.innerHTML=`<div class="qfb qwr">❌ Submission failed — check your internet connection.<br><span style="font-size:.68rem;color:var(--text3)">${e.message}</span></div>`;
  }
}

async function deletePendingQuote(id){
  if(!confirm('Remove this pending quote from your library?\nIf it hasn\'t been reviewed yet, the submission will also be withdrawn.'))return;
  // Use /withdraw with userKey so the worker can verify ownership and delete from KV
  const k=getUserKey();
  try{
    await fetch(WORKER_URL+'/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({userKey:k,id})});
  }catch(e){/* non-fatal — remove locally regardless */}
  S.pending=S.pending.filter(p=>String(p.id)!==String(id));
  save();lbUpdate();buildNav();toast('🗑 Submission withdrawn');render();
}

function rStats(){
  const qs=allQ();

  // Accuracy by work
  const byWork={};
  ws.forEach(w=>{
    const wq=qs.filter(q=>q.work===w);
    const qh=S.quizHistory.filter(h=>h.work===w);
    const total=qh.reduce((s,h)=>s+h.total,0);
    const correct=qh.reduce((s,h)=>s+h.correct,0);
    byWork[w]={total:wq.length,mastered:[...S.mastered].filter(id=>wq.find(q=>q.id===id)).length,quizAcc:total?pct(correct,total):null};
  });

  // Accuracy by theme
  const themeMap={};
  qs.forEach(q=>(q.themes||[]).forEach(t=>{
    if(!themeMap[t])themeMap[t]={total:0,mastered:0};
    themeMap[t].total++;
    if(S.mastered.has(q.id))themeMap[t].mastered++;
  }));
  const topThemes=Object.entries(themeMap).sort((a,b)=>b[1].total-a[1].total).slice(0,8);

  // Accuracy over time (last 14 days)

function exportJSON() {
  const d = {
    canonical: DB,
    custom: S.custom,
    mastered: [...S.mastered],
    learning: [...S.learning],
    xp: S.xp,
    streak: S.streak,
    srsData: S.srsData,
    quizHistory: S.quizHistory
  };

  const b = new Blob(
    [JSON.stringify(d, null, 2)],
    { type: 'application/json' }
  );

  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'QuoteVault-backup.json';
  a.click();
}

function exportCSV() {
  const qs = allQ();
  const h = 'Work,Character,Location,Quote,Themes,Methods,Stars,Accuracy,Analysis\n';

  const rows = qs.map(q => [
    q.work,
    q.char,
    q.loc,
    `"${q.text.replace(/"/g, '""')}"`,
    (q.themes || []).join(';'),
    (q.methods || []).join(';'),
    q.stars,
    q.acc,
    `"${(q.analysis || '').replace(/"/g, '""')}"`
  ].join(',')).join('\n');

  const b = new Blob([h + rows], { type: 'text/csv' });

  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'QuoteVault-quotes.csv';
  a.click();
}

function importJSON(evt) {
  const f = evt.target.files[0];
  if (!f) return;

  const r = new FileReader();

  r.onload = e => {
    try {
      const d = JSON.parse(e.target.result);

      if (d.custom) {
        S.custom = [...S.custom, ...d.custom];
      }

      if (d.mastered) {
        d.mastered.forEach(id => S.mastered.add(id));
      }

      if (d.learning) {
        d.learning.forEach(id => S.learning.add(id));
      }

      if (d.xp) {
        S.xp += d.xp;
      }

      if (d.srsData) {
        Object.assign(S.srsData, d.srsData);
      }

      if (d.quizHistory) {
        S.quizHistory.push(...d.quizHistory);
      }

      save();
      updateSB();
      toast('Import successful!');
      render();
    } catch (err) {
      console.error(err);
      toast('Import failed — invalid JSON');
    }
  };

  r.readAsText(f);
}

async function loadCloudQuotes(){
  try{
    const resp=await fetch(WORKER_URL+'/quotes');
    if(!resp.ok)return;
    const data=await resp.json();
    if(Array.isArray(data.items)){
      // Approved cloud quotes should not duplicate local custom OR still-pending items
      const existingIds=new Set([...DB,...S.custom,...S.pending].map(q=>String(q.id)));
      const newQuotes=data.items.filter(q=>q.text&&!existingIds.has(String(q.id)));
      // Also: if we have a pending item that just got approved (it's now in cloud quotes),
      // move it from pending → custom
      const approvedFromPending=[];
      S.pending=S.pending.filter(p=>{
        const cloudVersion=data.items.find(ci=>String(ci.id)===String(p.id));
        if(cloudVersion){approvedFromPending.push({...cloudVersion,_status:'approved'});return false;}
        return true;
      });
      if(approvedFromPending.length>0){
        // Avoid double-adding to custom
        const customIds=new Set(S.custom.map(q=>String(q.id)));
        approvedFromPending.forEach(q=>{if(!customIds.has(String(q.id)))S.custom.push(q);});
        toast(`✅ ${approvedFromPending.length} of your submitted quote${approvedFromPending.length===1?'':'s'} got approved!`,4000);
      }
      if(newQuotes.length>0){S.custom=[...S.custom,...newQuotes];}
      if(newQuotes.length>0||approvedFromPending.length>0){save();render();}
    }
  }catch(e){console.log(e);}
}

async function adminLogin(){
  const pw=(document.getElementById('adm-pw')?.value||'').trim();
  if(!pw)return;
  const errEl=document.getElementById('adm-err');
  errEl.innerHTML=`<div class="qfb" style="background:rgba(74,158,255,.08);border:1px solid rgba(74,158,255,.25);color:var(--blue)">⏳ Checking…</div>`;
  try{
    const resp=await fetch(WORKER_URL+'/auth',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pw})
    });
    if(resp.status===401){errEl.innerHTML=`<div class="qfb qwr">❌ Incorrect password</div>`;return;}
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    _adminToken=data.token;
    _adminAuth=true;
    adminLoadPending();
  }catch(e){
    errEl.innerHTML=`<div class="qfb qwr">❌ Login failed: ${e.message}</div>`;
  }
}

  render(); // show panel with loading state

    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    _adminPending=data.items||[];
  }catch(e){
    _adminPending=[];

  <div class="sec" style="margin-top:0">📬 Pending Approval</div>
  ${pendingHTML}
  <div class="sec">✅ Approved Custom Quotes</div>
  ${approvedHTML}
  </div>`;
}

async function adminApprove(idx){
  const q={..._adminPending[idx]};
  if(!q)return;
  try{
    const resp=await fetch(WORKER_URL+'/approve',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:_adminToken,id:q.id})
    });
    if(!resp.ok)throw new Error('HTTP '+resp.status);
  }catch(e){toast('⚠ Worker error: '+e.message,3500);return;}
  delete q.submittedAt;delete q._submittedByMe;delete q._status;
  // Move from pending → custom (dedup)
  S.pending=S.pending.filter(p=>p.id!==q.id);
  if(!S.custom.find(c=>String(c.id)===String(q.id)))S.custom.push(q);
  addXP(5);
  save();
  _adminPending.splice(idx,1);
  buildNav();
  toast('✅ Quote approved and added to vault! +5 XP');
  render();
}

async function adminReject(idx){
  const q=_adminPending[idx];
  if(!q)return;
  try{
    const resp=await fetch(WORKER_URL+'/reject',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:_adminToken,id:q.id})
    });
    if(!resp.ok)throw new Error('HTTP '+resp.status);
  }catch(e){toast('⚠ Worker error: '+e.message,3500);return;}
  _adminPending.splice(idx,1);
  buildNav();
  toast('❌ Quote rejected — submitter will be notified on next load');
  render();
}

async function adminDelete(idx){
  if(!confirm('Remove this quote from the vault?\nThis cannot be undone.'))return;
  const q=S.custom[idx];
  if(q?.id){
    try{await fetch(WORKER_URL+'/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:_adminToken,id:q.id})});}
    catch(e){/* non-fatal */}
  }
  S.custom.splice(idx,1);
  save();
  toast('🗑 Quote removed from vault');
  render();
}

// ─── Edit pending quote before approving ─────────
function adminEditPending(idx){
  const q=_adminPending[idx];
  if(!q)return;
  openModal(`<div>
    <div style="font-family:'Playfair Display',serif;font-size:1rem;color:var(--gold);margin-bottom:10px">✏️ Edit & Approve</div>
    ${_editFields(q,'ep')}
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn bp" onclick="adminSavePendingEdit(${idx})">✅ Save & Approve</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
  </div>`);
}

function adminSavePendingEdit(idx){
  const q={..._adminPending[idx],..._readEditFields('ep')};
  _adminPending.splice(idx,1);
  // Remove from Worker (fire and forget — already approved)
  fetch(WORKER_URL+'/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:_adminToken,id:q.id})}).catch(()=>{});
  delete q.submittedAt;delete q._submittedByMe;delete q._status;
  S.pending=S.pending.filter(p=>p.id!==q.id);
  if(!S.custom.find(c=>String(c.id)===String(q.id)))S.custom.push(q);
  addXP(5);save();buildNav();closeModal();
  toast('✅ Edited, approved & added to vault! +5 XP');
  render();
}

// ─── Edit already-approved custom quote ──────────
function adminEditApproved(idx){
  const q=S.custom[idx];
  if(!q)return;
  openModal(`<div>
    <div style="font-family:'Playfair Display',serif;font-size:1rem;color:var(--gold);margin-bottom:10px">✏️ Edit Approved Quote</div>
    ${_editFields(q,'ea')}
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn bp" onclick="adminSaveApprovedEdit(${idx})">💾 Save Changes</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
  </div>`);
}

async function adminSaveApprovedEdit(idx){
  const updated={...S.custom[idx],..._readEditFields('ea')};
  S.custom[idx]=updated;save();
  // Push edit to worker so it persists in the cloud
  try{
    await fetch(WORKER_URL+'/update-public',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:_adminToken,id:updated.id,data:updated})});
  }catch(e){/* non-fatal — local save succeeded */}
  closeModal();toast('💾 Quote updated');render();
}

// ─── Shared edit form helpers ─────────────────────
function _editFields(q,pfx){
  return`
  <div class="fg"><label>Quote Text</label><textarea id="${pfx}-t" rows="3">${q.text||''}</textarea></div>
  <div class="g2">
    <div class="fg"><label>Character</label><input type="text" id="${pfx}-c" value="${q.char||''}"></div>
    <div class="fg"><label>Work</label><input type="text" id="${pfx}-w" value="${q.work||''}"></div>
  </div>
  <div class="fg"><label>Location (e.g. Act 1, Scene 2)</label><input type="text" id="${pfx}-l" value="${q.loc||''}"></div>
  <div class="fg"><label>Themes (comma-separated)</label><input type="text" id="${pfx}-th" value="${(q.themes||[]).join(', ')}"></div>
  <div class="fg"><label>Methods (comma-separated)</label><input type="text" id="${pfx}-me" value="${(q.methods||[]).join(', ')}"></div>
  <div class="fg"><label>Analysis</label><textarea id="${pfx}-an" rows="3">${q.analysis||''}</textarea></div>
  <div class="g2">
    <div class="fg"><label>Stars (1-5)</label>
      <select id="${pfx}-st">${[1,2,3,4,5].map(n=>`<option${q.stars===n?' selected':''}>${n}</option>`).join('')}</select>
    </div>
    <div class="fg"><label>Accuracy</label>
      <select id="${pfx}-ac">
        <option${q.acc==='exact'?' selected':''}>exact</option>
        <option${q.acc==='minor'?' selected':''}>minor</option>
        <option${q.acc==='unknown'?' selected':''}>unknown</option>
      </select>
    </div>
  </div>
  <div class="fg"><label>Warning note (optional)</label><input type="text" id="${pfx}-no" value="${q.note||''}"></div>`;
}

function _readEditFields(pfx){
  const g=id=>document.getElementById(id)?.value||'';
  return{
    text:g(`${pfx}-t`).trim(),
    char:g(`${pfx}-c`).trim(),
    work:g(`${pfx}-w`).trim(),
    loc:g(`${pfx}-l`).trim(),
    themes:g(`${pfx}-th`).split(',').map(s=>s.trim()).filter(Boolean),
    methods:g(`${pfx}-me`).split(',').map(s=>s.trim()).filter(Boolean),
    analysis:g(`${pfx}-an`),
    stars:+g(`${pfx}-st`),
    acc:g(`${pfx}-ac`),
    note:g(`${pfx}-no`),
  };
}

// INIT
// ════════════════════════════════════════════════
initTheme();buildNav();updateSB();validateStreak();render();
// Load custom themes saved on server
if(getUserKey())loadServerCustomThemes();
loadCloudQuotes();
// Sync progress from worker if user has a key (multi-device support)
if(getUserKey())syncFromWorker();

// ── Global keyboard shortcuts ─────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  // Don't fire when typing in an input/textarea (except blanks which handle themselves)
  const tag = document.activeElement && document.activeElement.tagName;
  const inInput = (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT');
  const page = S.page;

  // Navigation: Backspace/Escape = go back (unless in input)
  if ((e.key === 'Escape' || (e.key === 'Backspace' && !inInput)) && page !== 'dashboard') {
    if (page === 'timed') { if (S.tc && S.tc.active) { if(S.tc.timer)clearInterval(S.tc.timer); S.tc.active=false; render(); return; } }
    if (!inInput) { e.preventDefault(); goBack(); return; }
  }

  if (page === 'srs') {
    const revealed = document.getElementById('srs-full') && document.getElementById('srs-full').style.display !== 'none';
    if (!revealed) {
      if (e.key === ' ') { e.preventDefault(); const btn=document.getElementById('srs-reveal-btn'); if(btn)btn.click(); }
    } else {
      if (e.key === '1') rateSRS(S._srsCurrentId, 0);
      else if (e.key === '2') rateSRS(S._srsCurrentId, 1);
      else if (e.key === '3') rateSRS(S._srsCurrentId, 2);
      else if (e.key === '4') rateSRS(S._srsCurrentId, 3);
      else if (e.key === '5') rateSRS(S._srsCurrentId, 4);
    }
  }

  if (page === 'flashcards') {
    const fc = S.fc;
    if (!fc.flipped) {
      if (e.key === ' ') { e.preventDefault(); S.fc.flipped=true; render(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); fcNext(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); fcPrev(); }
    } else {
      if (e.key === ' ') { e.preventDefault(); S.fc.flipped=false; render(); }
      else if (e.key === '1') { const q=_currentFCQuote(); if(q)rateFC(q.id,0); }
      else if (e.key === '2') { const q=_currentFCQuote(); if(q)rateFC(q.id,1); }
      else if (e.key === '3') { const q=_currentFCQuote(); if(q)rateFC(q.id,2); }
      else if (e.key === '4') { const q=_currentFCQuote(); if(q)rateFC(q.id,3); }
      else if (e.key === '5') { const q=_currentFCQuote(); if(q)rateFC(q.id,4); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); fcNext(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); fcPrev(); }
    }
  }

  if (page === 'quiz') {
    if (e.key === 'Enter' && !inInput) {
      e.preventDefault();
      if (S.quiz.active && !S.quiz.checked) submitQ();
      else if (S.quiz.checked) { S.quiz.idx++; S.quiz.checked=false; S.quiz.ans=''; render(); }
    }
  }

  if (page === 'timed') {
    if (e.key === 'Escape' && S.tc && S.tc.active) {
      e.preventDefault(); if(S.tc.timer)clearInterval(S.tc.timer); S.tc.active=false; render();
    }
  }
});
function _currentFCQuote(){
  const pool=applyFilters(allQ()).length?applyFilters(allQ()):allQ();
  const fc=S.fc;
  const histPos=fc.histPos??fc.history.length-1;
  const idx=fc.history[histPos];
  return idx!==undefined?pool[idx]:null;
}
// Patch revealSRS to store current id for keyboard shortcuts
const _origRevealSRS=revealSRS;
revealSRS=function(id){ S._srsCurrentId=id; _origRevealSRS(id); };


window.addEventListener('storage',e=>{
  if(e.key==='vt_theme'&&e.newValue){
    applyTheme(e.newValue);
    if(S&&S.settings){S.settings.theme=e.newValue;save();}
  }
});
