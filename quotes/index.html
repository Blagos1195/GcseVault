  {id:"1778573792023-pac022",work:"Power and Conflict",char:"Robert Browning",loc:"My Last Duchess",themes:["Power","Gender","Jealousy"],methods:["Listing","Jealous tone","Dramatic monologue"],text:"She had / A heart — how shall I say? — too soon made glad, / Too easily impressed",analysis:"The Duke complains that the Duchess was too kind, too human. His pause ('how shall I say?') performs false modesty — he knows exactly what he means. 'Too soon made glad' is the language of a man who wanted to be her only source of joy. His jealousy is revealed as a desire for absolute emotional monopoly.",stars:4,acc:"exact",note:"Jealousy; power and control; the Duke's unreliability; Browning's critique of patriarchal possession.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac023",work:"Power and Conflict",char:"Robert Browning",loc:"My Last Duchess",themes:["Power","Class","Control"],methods:["Hubris","Tone","Class diction"],text:"I choose / Never to stoop",analysis:"The Duke refuses to explain his displeasure to the Duchess — doing so would mean descending to her social level. 'Stoop' is the key word: his pride prevented the conversation that might have saved her life. Browning shows how aristocratic arrogance and toxic masculinity are fatally intertwined.",stars:5,acc:"exact",note:"Aristocratic pride; power; the Duke's fatal arrogance; Browning's critique of class.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac024",work:"Power and Conflict",char:"Robert Browning",loc:"My Last Duchess",themes:["Power","Art","Control"],methods:["Possessive language","Objectification","Opening"],text:"That's my last Duchess painted on the wall, / Looking as if she were alive.",analysis:"The opening immediately establishes the Duke as a man who possesses women — 'my last Duchess' treats her as one in a series of objects. 'Looking as if she were alive' is quietly devastating: the painting captures her vitality but she is dead. He prefers her this way — controllable, silent, permanently beautiful.",stars:5,acc:"exact",note:"Possessive language; power; objectification of women; dramatic opening; the Duke's character.",submittedAt:"2026-05-12T08:16:32.023Z"},

  // ============================================================
  // POWER AND CONFLICT — CHARGE OF THE LIGHT BRIGADE (Tennyson)
  // ============================================================

  {id:"1778573792023-pac030",work:"Power and Conflict",char:"Alfred Lord Tennyson",loc:"The Charge of the Light Brigade",themes:["Conflict","Power","Duty","Death"],methods:["Repetition","Rhythm","Anaphora"],text:"Cannon to right of them, / Cannon to left of them, / Cannon in front of them",analysis:"Relentless anaphora of 'Cannon' traps the soldiers in a triangle of fire — there is literally no escape. The repetition mirrors the mechanical relentlessness of artillery bombardment. Tennyson's dactylic rhythm throughout mimics galloping hooves, giving the poem kinetic energy even as it describes slaughter.",stars:5,acc:"exact",note:"Conflict; the reality of war; rhythm as meaning; soldiers trapped by duty and incompetent command.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac031",work:"Power and Conflict",char:"Alfred Lord Tennyson",loc:"The Charge of the Light Brigade",themes:["Conflict","Duty","Power"],methods:["Understatement","Tone","Ambiguity"],text:"Someone had blundered",analysis:"Three words that carry enormous weight. 'Someone' is deliberately vague — Tennyson implicates unnamed commanders without causing a political scandal. 'Blundered' is almost gentle for what was catastrophic incompetence that sent 600 men to their deaths. The understatement makes the line more cutting than outrage would.",stars:5,acc:"exact",note:"Critique of military command; power; responsibility; Tennyson's careful use of understatement.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac032",work:"Power and Conflict",char:"Alfred Lord Tennyson",loc:"The Charge of the Light Brigade",themes:["Conflict","Duty","Death"],methods:["Rhyme","Rhetoric","Tone"],text:"Theirs not to reason why, / Theirs but to do and die",analysis:"The rhyme of 'why' and 'die' is grimly purposeful — questioning and dying are the only options, and the soldiers choose dying over questioning. Tennyson neither condemns nor glorifies this; he presents it as the soldier's reality. The poem honours the men while quietly indicting the system that sacrificed them.",stars:5,acc:"exact",note:"Duty vs reason; power of command; soldiers' nobility; Tennyson's ambiguous tribute.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac033",work:"Power and Conflict",char:"Alfred Lord Tennyson",loc:"The Charge of the Light Brigade",themes:["Conflict","Death","Memory"],methods:["Imperative","Tone","Elegy"],text:"Honour the charge they made! / Honour the Light Brigade, / Noble six hundred!",analysis:"The poem closes with an imperative demand for remembrance. The exclamation marks are insistent and emotional. 'Noble six hundred' is an elegy compressed into three words. Tennyson insists that courage in the face of incompetent command deserves permanent memorial — even if the mission was futile.",stars:4,acc:"exact",note:"Memory and commemoration; the soldier's nobility; Tennyson's elegiac purpose; power of command.",submittedAt:"2026-05-12T08:16:32.023Z"},

  // ============================================================
  // POWER AND CONFLICT — EXPOSURE (Owen)
  // ============================================================

  {id:"1778573792023-pac040",work:"Power and Conflict",char:"Wilfred Owen",loc:"Exposure",themes:["Conflict","Nature","Suffering","Death"],methods:["Repetition","Refrain","Tone"],text:"But nothing happens.",analysis:"Owen's repeated refrain is devastating in its flat simplicity. The soldiers wait for battle — the traditional subject of war poetry — but it never comes. Instead they are killed slowly by cold and boredom. The full stop after each repetition is a door closing. 'Nothing happens' is the truest and most terrible statement of trench warfare.",stars:5,acc:"exact",note:"The reality of WWI; nature as enemy; anti-war; Owen's subversion of heroic war poetry expectations.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac041",work:"Power and Conflict",char:"Wilfred Owen",loc:"Exposure",themes:["Conflict","Nature","Death","Suffering"],methods:["Personification","Sibilance","Imagery"],text:"Our brains ache, in the merciless iced east winds that knive us",analysis:"Nature is a weapon — 'knive us' gives the wind a murderous agency equal to any enemy soldier. 'Merciless' denies nature the consolation of indifference; it actively refuses pity. The sibilance of 'iced east winds' creates a hissing, cutting sound that physically enacts the pain described.",stars:5,acc:"exact",note:"Nature as enemy; suffering; Owen's use of sound; the physical reality of trench warfare.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac042",work:"Power and Conflict",char:"Wilfred Owen",loc:"Exposure",themes:["Conflict","Death","Home","Faith"],methods:["Imagery","Contrast","Tone"],text:"Slowly our ghosts drag home: glimpsing the sunk fires, glozed / With crusted dark-red jewels",analysis:"The soldiers' imagined return home is spectral — they are already 'ghosts', half-dead. The 'sunk fires' suggest warmth dying; 'crusted dark-red jewels' makes embers sound like blood clots. Home is presented as already fading. Owen denies the soldiers even the consolation of imagined return.",stars:4,acc:"exact",note:"Home and alienation; soldiers as already dead; Owen's imagery; the futility of comfort.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac043",work:"Power and Conflict",char:"Wilfred Owen",loc:"Exposure",themes:["Death","Faith","Conflict"],methods:["Rhetorical question","Tone","Religion"],text:"Is it that we are dying?",analysis:"A quietly devastating question buried in the poem. The soldiers cannot tell if they are alive or dead — the experience of trench warfare has blurred that boundary entirely. Owen suggests that the men who survive physically may have already died in every meaningful sense. Faith and afterlife offer no comfort.",stars:4,acc:"exact",note:"Death and dying; faith; the psychological horror of war; Owen's questioning of religion and purpose.",submittedAt:"2026-05-12T08:16:32.023Z"},

  // ============================================================
  // POWER AND CONFLICT — STORM ON THE ISLAND (Heaney)
  // ============================================================

  {id:"1778573792023-pac050",work:"Power and Conflict",char:"Seamus Heaney",loc:"Storm on the Island",themes:["Nature","Power","Conflict","Fear"],methods:["Irony","Volta","Tone shift"],text:"Strange, it is a huge nothing that we fear.",analysis:"The poem's closing line is its most philosophically rich. The 'huge nothing' seems contradictory — nothingness cannot be huge — yet Heaney captures the terror of invisible power perfectly. The storm cannot be seen, only felt. 'Strange' marks the speaker's own surprised realisation: fear of absence is somehow more primal than fear of presence.",stars:5,acc:"exact",note:"Nature's power; the invisible vs visible; fear; Heaney's volta; ambiguity of 'nothing'; link to Northern Irish conflict.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac051",work:"Power and Conflict",char:"Seamus Heaney",loc:"Storm on the Island",themes:["Nature","Power","Conflict"],methods:["Military metaphor","Tone","Imagery"],text:"the wind dives / And strafes invisibly",analysis:"Military language applied to nature — 'strafes' is a WWII term for low-level aerial gunfire. Heaney collapses the distinction between natural and human violence, suggesting both are equally arbitrary and deadly. 'Invisibly' makes the attack more terrifying — you cannot prepare for what you cannot see.",stars:5,acc:"exact",note:"Nature as conflict; military metaphor; the invisible enemy; link to political conflict in Northern Ireland.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac052",work:"Power and Conflict",char:"Seamus Heaney",loc:"Storm on the Island",themes:["Nature","Power","Preparation"],methods:["Direct address","Tone","Understatement"],text:"We are prepared: we build our houses squat",analysis:"The poem opens with confident human preparation — 'We are prepared' is almost defiant. But as the poem develops, this confidence is revealed as inadequate against the storm's absolute power. The squat houses, the lack of trees, the stored crops: all fail. Heaney charts the collapse of human self-assurance.",stars:4,acc:"exact",note:"Human vs nature; preparation and failure; the poem's structural arc; Heaney's irony.",submittedAt:"2026-05-12T08:16:32.023Z"},

  // ============================================================
  // POWER AND CONFLICT — BAYONET CHARGE (Hughes)
  // ============================================================

  {id:"1778573792023-pac060",work:"Power and Conflict",char:"Ted Hughes",loc:"Bayonet Charge",themes:["Conflict","Fear","Identity","Duty"],methods:["Enjambment","Pace","Imagery"],text:"Suddenly he awoke and was running — raw / In raw-seamed hot khaki",analysis:"The poem begins mid-action, disorienting the reader as the soldier is disoriented. 'Suddenly' drops us into chaos without context. 'Raw' repeated twice — exposed, unprocessed, animal. The khaki uniform no longer represents honour; it is just hot, scratching fabric. Hughes strips war of all heroic abstraction.",stars:5,acc:"exact",note:"The reality of combat; stripping away ideology; pace and enjambment; anti-war.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac061",work:"Power and Conflict",char:"Ted Hughes",loc:"Bayonet Charge",themes:["Conflict","Identity","Ideology"],methods:["Bathos","Imagery","Tone"],text:"King, honour, human dignity, etcetera / Dropped like luxuries in a yelling alarm",analysis:"'Etcetera' is one of the most devastating words in war poetry — the abstract values men are told they fight for are dismissed with bureaucratic indifference. 'Dropped like luxuries' makes patriotism a non-essential in survival. Hughes argues that the realities of combat annihilate ideology instantly and completely.",stars:5,acc:"exact",note:"Ideology vs reality of war; 'etcetera' as key word; Hughes's anti-war argument; patriotism critiqued.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac062",work:"Power and Conflict",char:"Ted Hughes",loc:"Bayonet Charge",themes:["Conflict","Nature","Fear"],methods:["Simile","Imagery","Contrast"],text:"a yellow hare that rolled like a flame / And crawled in a threshing circle",analysis:"A hare caught in the crossfire becomes a symbol of all innocent life destroyed by war. 'Rolled like a flame' fuses animal and fire — the hare dying resembles burning. 'Threshing circle' suggests both the mechanised violence of battle and harvest imagery, hinting at wasted life and wasted potential.",stars:4,acc:"exact",note:"Innocent life destroyed by war; nature vs conflict; Hughes's imagery; the hare as symbol.",submittedAt:"2026-05-12T08:16:32.023Z"},

  // ============================================================
  // POWER AND CONFLICT — REMAINS (Armitage)
  // ============================================================

  {id:"1778573792023-pac070",work:"Power and Conflict",char:"Simon Armitage",loc:"Remains",themes:["Conflict","Guilt","PTSD","Memory"],methods:["Colloquial tone","Graphic imagery","Repetition"],text:"the drink and drugs won't flush him out — he's here in my head when I close my eyes",analysis:"The soldier cannot escape the man he killed through any means. 'Flush him out' is military language turned inward — the enemy is now inside his own mind. The casualness of 'drink and drugs' makes the coping mechanisms heartbreaking rather than shocking. Armitage captures PTSD with forensic honesty.",stars:5,acc:"exact",note:"PTSD; the psychological cost of war; guilt; Armitage's colloquial voice; modern conflict.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac071",work:"Power and Conflict",char:"Simon Armitage",loc:"Remains",themes:["Conflict","Guilt","Responsibility"],methods:["Compound imagery","Metaphor","Blunt tone"],text:"his blood-shadow stays on the street",analysis:"'Blood-shadow' is Armitage's most powerful compound image — a shadow is something cast by presence, permanent and inescapable, yet blood suggests violence. The stain on the street is a metaphor for the stain on the soldier's conscience. It cannot be washed away; it is now part of both the landscape and the speaker's psyche.",stars:5,acc:"exact",note:"Guilt and memory; the permanence of violence; imagery; the psychological cost of modern warfare.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac072",work:"Power and Conflict",char:"Simon Armitage",loc:"Remains",themes:["Conflict","Guilt","Responsibility"],methods:["Ambiguity","Tone","Slow motion imagery"],text:"I see every round as it rips through his life — / I see his face, the empty sleeve",analysis:"'Rips through his life' uses 'life' ambiguously — the bullet tears through his body and destroys his entire existence simultaneously. The soldier replays the killing in slow motion, unable to stop. 'Empty sleeve' is a specific haunting detail — particular enough to be real, disturbing enough to be unforgettable.",stars:4,acc:"exact",note:"PTSD; the haunting detail of guilt; ambiguity; Armitage's realism.",submittedAt:"2026-05-12T08:16:32.023Z"},

  // ============================================================
  // POWER AND CONFLICT — POPPIES (Weir)
  // ============================================================

  {id:"1778573792023-pac080",work:"Power and Conflict",char:"Jane Weir",loc:"Poppies",themes:["Conflict","Loss","Memory","Family"],methods:["Domestic imagery","Contrast","Sensory detail"],text:"Before you left, I pinned one onto your lapel, crimped and pressed, like a corsage",analysis:"The poppy — symbol of war remembrance — is here pinned by a mother onto her son as if for a formal celebration. 'Corsage' suggests a wedding or prom. Weir creates devastating contrast through domestic tenderness and the conventions of celebration, masking the reality of departure for war.",stars:5,acc:"exact",note:"Domestic vs conflict; the mother's perspective; poppy symbolism; contrast and irony.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac081",work:"Power and Conflict",char:"Jane Weir",loc:"Poppies",themes:["Loss","Memory","Family","Conflict"],methods:["Imagery","Sensory detail","Metaphor"],text:"I listened, hoping to hear / your playground voice catching on the wind",analysis:"The mother listens for a child's voice — not a soldier's. 'Playground voice' regresses her son to childhood innocence. The wind that might carry his voice is the same wind that carries away the dead. Weir powerfully suggests that for a mother, the child never stops being a child regardless of what war makes him.",stars:5,acc:"exact",note:"A mother's grief; memory; loss; the child vs the soldier; sensory detail.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac082",work:"Power and Conflict",char:"Jane Weir",loc:"Poppies",themes:["Loss","Memory","Freedom"],methods:["Extended metaphor","Imagery","Release"],text:"released a song bird from its cage",analysis:"The mother's act of letting her son go is figured as releasing a bird — beautiful, free, but also irreversible. The cage is her home and her love; the song bird is the son she raised. The metaphor captures the paradox of good parenting: to love fully is eventually to release. But the bird may not return.",stars:4,acc:"exact",note:"Loss and letting go; freedom vs protection; extended metaphor; the mother's sacrifice.",submittedAt:"2026-05-12T08:16:32.023Z"},

  // ============================================================
  // POWER AND CONFLICT — WAR PHOTOGRAPHER (Duffy)
  // ============================================================

  {id:"1778573792023-pac090",work:"Power and Conflict",char:"Carol Ann Duffy",loc:"War Photographer",themes:["Conflict","Memory","Guilt","Distance"],methods:["Contrast","Imagery","Tone"],text:"Rural England. Home again / to ordinary pain which simple weather can dispel",analysis:"The contrast between rural England and war zones is Duffy's central device. England's 'ordinary pain' — grief, heartbreak, bad weather — is trivial against the suffering the photographer has witnessed. 'Simple weather can dispel' implies that English suffering is merely inconvenient, not existential. The gap between worlds is Duffy's critique.",stars:5,acc:"exact",note:"The gulf between home and conflict; complicity; Duffy's critique of Western indifference; contrast.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac091",work:"Power and Conflict",char:"Carol Ann Duffy",loc:"War Photographer",themes:["Conflict","Memory","Responsibility"],methods:["Imagery","Tone","Irony"],text:"A hundred agonies in black-and-white / from which his editor will pick out five or six",analysis:"The reduction of human suffering to editorial selection is devastating. 'A hundred agonies' are real deaths, real pain; 'five or six' are what the public will see. The poet implicates the media in packaging suffering for consumption. 'Agonies' is deliberately strong against the mechanical language of 'pick out'.",stars:5,acc:"exact",note:"Media and conflict; complicity; the commercialisation of suffering; Duffy's critique.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac092",work:"Power and Conflict",char:"Carol Ann Duffy",loc:"War Photographer",themes:["Conflict","Guilt","Memory"],methods:["Religious imagery","Tone","Symbolism"],text:"In his darkroom he is finally alone / with spools of suffering set out in ordered rows",analysis:"The darkroom is like a confessional or chapel — a sacred space of processing and witness. 'Spools of suffering set out in ordered rows' recalls rows of graves or pews, fusing photographic and sacred space. He is the keeper of others' pain, alone with his archive of deaths — a role of enormous psychological weight.",stars:4,acc:"exact",note:"Religious symbolism; guilt; isolation of the photographer; the ethics of war photography.",submittedAt:"2026-05-12T08:16:32.023Z"},

  // ============================================================
  // POWER AND CONFLICT — TISSUE (Dharker)
  // ============================================================

  {id:"1778573792023-pac100",work:"Power and Conflict",char:"Imtiaz Dharker",loc:"Tissue",themes:["Power","Transience","Identity","Nature"],methods:["Extended metaphor","Imagery","Tone"],text:"Paper that lets the light / shine through",analysis:"Dharker's central metaphor: tissue paper that is translucent, fragile, and beautiful. The light shining through represents truth or humanity — something that cannot be fully contained by the paper (maps, money, records) humans use to construct power. The very things we use to assert control are revealed as permeable and temporary.",stars:5,acc:"exact",note:"Transience of power; tissue as extended metaphor; light as truth; fragility of human systems.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac101",work:"Power and Conflict",char:"Imtiaz Dharker",loc:"Tissue",themes:["Power","Control","Transience"],methods:["Imagery","Irony","Juxtaposition"],text:"the ink would drift like smoke and wouldn't / stay to be driven in though the fibres",analysis:"Ink — the medium of official records, maps, laws, money — cannot grip the tissue. It drifts 'like smoke': insubstantial, transient, undirected. All the systems of human control (borders, financial records, religious texts) are revealed as unable to truly penetrate or define human life. Dharker undermines the permanence of power structures.",stars:4,acc:"exact",note:"Power and its limits; transience; human systems vs fragility of paper; Dharker's central argument.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac102",work:"Power and Conflict",char:"Imtiaz Dharker",loc:"Tissue",themes:["Power","Identity","Humanity"],methods:["Imagery","Closing","Tone"],text:"turned into your skin",analysis:"The poem's closing image fuses tissue paper with human skin — both fragile, both temporary, both beautiful when light passes through them. Dharker suggests that true human identity cannot be captured in maps, money, or legal documents. The skin we are born in is the only real document; all others are mere tissue.",stars:5,acc:"exact",note:"Identity; the limits of power; skin as the true document; Dharker's poetic resolution.",submittedAt:"2026-05-12T08:16:32.023Z"},

  // ============================================================
  // POWER AND CONFLICT — KAMIKAZE (Garland)
  // ============================================================

  {id:"1778573792023-pac110",work:"Power and Conflict",char:"Beatrice Garland",loc:"Kamikaze",themes:["Conflict","Identity","Family","Honour"],methods:["Imagery","Contrast","Tone"],text:"a shaven head full of powerful incantations",analysis:"The pilot has been prepared for death with near-religious ceremony. 'Powerful incantations' suggests military ideology functions like religion — it fills the mind with doctrine designed to override survival instinct. Garland presents the kamikaze mission as a form of ideological possession, not a free choice.",stars:4,acc:"exact",note:"Ideology vs identity; militarism as religion; the kamikaze pilot's psychology; power over individuals.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac111",work:"Power and Conflict",char:"Beatrice Garland",loc:"Kamikaze",themes:["Conflict","Nature","Identity","Choice"],methods:["Imagery","Contrast","Sensory detail"],text:"shoals of silver fish / flashing silver as their bellies",analysis:"The poem's central turning point: the pilot sees fish and remembers his father's stories of the sea. The natural beauty of the fish — their silver flashing, their freedom — awakens something the military ideology tried to extinguish. Nature becomes the force that overrides the death instinct. The fish live; why shouldn't he?",stars:5,acc:"exact",note:"Nature vs ideology; the moment of choice; beauty as a reason to live; contrast with military duty.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac112",work:"Power and Conflict",char:"Beatrice Garland",loc:"Kamikaze",themes:["Conflict","Honour","Family","Identity"],methods:["Irony","Narrative shift","Tone"],text:"he was home again, / his family's grief and shame",analysis:"The pilot who chooses life is greeted not with relief but with shame. His family — the very people he returned for — enforce the same honour code that sent him to die. Garland's bitter irony: survival is treated as a greater disgrace than death. The family's silence becomes a form of social execution.",stars:5,acc:"exact",note:"Honour culture; the cost of breaking duty; irony of survival; family and shame.",submittedAt:"2026-05-12T08:16:32.023Z"},

  // ============================================================
  // POWER AND CONFLICT — CHECKING OUT ME HISTORY (Agard)
  // ============================================================

  {id:"1778573792023-pac120",work:"Power and Conflict",char:"John Agard",loc:"Checking Out Me History",themes:["Power","Identity","Education","Colonialism"],methods:["Dialect","Anaphora","Contrast"],text:"Dem tell me / Dem tell me / Wha dem want to tell me",analysis:"The Caribbean dialect ('Dem') is a political act in itself — Agard uses the colonised voice to critique colonial education. The anaphora of 'Dem tell me' creates a drumbeat of imposed narrative. 'Wha dem want to tell me' reveals the selection process: colonial history is curated to serve the coloniser's interests, not the colonised's identity.",stars:5,acc:"exact",note:"Power of education; colonialism; dialect as resistance; Agard's political voice; identity.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac121",work:"Power and Conflict",char:"John Agard",loc:"Checking Out Me History",themes:["Power","Identity","Colonialism","Resistance"],methods:["Staccato rhythm","Imagery","Contrast"],text:"Toussaint / a slave / with vision / lick back / Napoleon / battalion",analysis:"Toussaint L'Ouverture — leader of the Haitian Revolution — is presented as a hero of genuine power. Short staccato lines give the passage energy and pride. 'Lick back' in dialect is visceral — a physical reversal of colonial power. Agard reclaims this history as his own, opposing the nursery rhyme nonsense of the English curriculum.",stars:5,acc:"exact",note:"Reclaiming history; resistance; Agard's heroes vs colonial curriculum; dialect as empowerment.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac122",work:"Power and Conflict",char:"John Agard",loc:"Checking Out Me History",themes:["Power","Identity","Education"],methods:["Irony","Contrast","Juxtaposition"],text:"Dem tell me bout Dick Whittington and he cat / But Toussaint L'Ouverture / no dem never tell me bout dat",analysis:"The contrast is Agard's most explicit critique: English children are taught Dick Whittington (a fairy tale) but not Toussaint L'Ouverture (a revolutionary who changed world history). The injustice is exposed through juxtaposition. 'No dem never tell me bout dat' — the repeated denial of knowledge is a repeated denial of identity.",stars:5,acc:"exact",note:"Colonial education; erasure of Black history; contrast; Agard's argument about knowledge and power.",submittedAt:"2026-05-12T08:16:32.023Z"},

  // ============================================================
  // POWER AND CONFLICT — LONDON (Blake)
  // ============================================================

  {id:"1778573792023-pac130",work:"Power and Conflict",char:"William Blake",loc:"London",themes:["Power","Social justice","Suffering","Oppression"],methods:["Repetition","Imagery","Tone"],text:"In every cry of every Man, / In every Infant's cry of fear, / In every voice, in every ban",analysis:"The anaphora of 'every' is relentless and totalising — suffering in Blake's London is universal, inescapable. No one is exempt. 'Ban' implies legal prohibition: the cries are not just suffering but the sound of a people politically controlled and silenced. Blake presents oppression as the defining condition of urban life.",stars:5,acc:"exact",note:"Oppression; universal suffering; Blake's political anger; the city as prison; anaphora.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac131",work:"Power and Conflict",char:"William Blake",loc:"London",themes:["Power","Oppression","Social justice"],methods:["Oxymoron","Imagery","Symbolism"],text:"the mind-forged manacles I hear",analysis:"Blake's most celebrated image. 'Mind-forged manacles' are chains created not by physical imprisonment but by psychological conditioning — people have internalised their own oppression. 'Forged' suggests both manufactured and forced. Blake argues that the most powerful chains are those we do not recognise as chains.",stars:5,acc:"exact",note:"Psychological oppression; power; Blake's Romantic radicalism; internalised oppression; key image.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac132",work:"Power and Conflict",char:"William Blake",loc:"London",themes:["Power","Suffering","Social justice","Religion"],methods:["Imagery","Symbolism","Juxtaposition"],text:"How the Chimney-sweeper's cry / Every blackning Church appals",analysis:"The Church is 'blackening' — morally darkened by its complicity in child labour and social injustice, while being physically blackened by the soot of chimney sweeps it does nothing to protect. Blake places the institution that should offer salvation directly beside the child it ignores — an act of devastating moral accusation.",stars:4,acc:"exact",note:"Institutional complicity; child labour; religious critique; Blake's social anger.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"1778573792023-pac133",work:"Power and Conflict",char:"William Blake",loc:"London",themes:["Suffering","Power","Corruption"],methods:["Imagery","Euphemism","Irony"],text:"And the hapless Soldier's sigh / Runs in blood down Palace walls",analysis:"The soldier's sigh — an exhalation of resignation and death — becomes blood on the Palace. Blake draws a direct line from royal power to military death: kings demand wars; soldiers bleed. The Palace, symbol of power and wealth, is literally stained with the blood of those sacrificed to maintain it.",stars:5,acc:"exact",note:"War and power; royal complicity; soldiers as victims of the powerful; Blake's radical imagery.",submittedAt:"2026-05-12T08:16:32.023Z"},

  {id:"pac-london-04",work:"Power and Conflict",char:"William Blake",loc:"London",themes:["Suffering","Corruption","Social justice"],methods:["Imagery","Metaphor","Shocking contrast"],text:"And blights with plagues the Marriage hearse",analysis:"Blake's closing image fuses two opposites: a marriage (life, love, beginning) and a hearse (death, ending). The youthful Harlot's curse — venereal disease — destroys both her life and the marriages of others. Society's hypocrisy is exposed: men who visit prostitutes bring disease home to their wives. The oxymoron condemns the entire social structure.",stars:5,acc:"exact",note:"Corruption; hypocrisy; sex and society; Blake's most shocking image; the 'marriage hearse' oxymoron."},

  {id:"pac-london-05",work:"Power and Conflict",char:"William Blake",loc:"London",themes:["Suffering","Power","Childhood"],methods:["Repetition","Imagery","Pathos"],text:"How the youthful Harlot's curse / Blasts the new-born Infant's tear",analysis:"Venereal disease passed from mother to child at birth — a child born already suffering for the sins of a society that exploited its mother. 'New-born' and 'Infant' emphasise innocence; 'curse' and 'blasts' emphasise violence. The child inherits misery it had no part in creating. Blake indicts the entire system.",stars:4,acc:"exact",note:"Poverty; exploitation of women; suffering of innocents; cycle of social misery."},

  // ── OZYMANDIAS extra quotes ──
  {id:"pac-oz-06",work:"Power and Conflict",char:"Percy Bysshe Shelley",loc:"Ozymandias",themes:["Power","Hubris","Transience"],methods:["Dramatic irony","Inscription","Hubris"],text:"My name is Ozymandias, King of Kings; / Look on my Works, ye Mighty, and despair!",analysis:"The inscription on the pedestal is the poem's central irony — Ozymandias commands the mighty to despair at his greatness, but all his works are gone. The boastful imperative 'Look on my Works' is undercut entirely by 'Nothing beside remains'. His command to despair becomes a despair at his own erasure. Power has destroyed itself.",stars:5,acc:"exact",note:"Hubris; dramatic irony; the inscription vs the reality; the tyrant's delusion; power and its collapse."},

  {id:"pac-oz-07",work:"Power and Conflict",char:"Percy Bysshe Shelley",loc:"Ozymandias",themes:["Power","Art","Identity"],methods:["Imagery","Irony","Tone"],text:"Half sunk a shattered visage lies",analysis:"The king's face — symbol of his identity and power — is broken and half-buried in sand. 'Shattered' is precisely chosen: his power has not faded gracefully but broken apart. The face that once commanded an empire lies face-down in desert. Art outlasts the ruler but cannot preserve him; even his image is wrecked.",stars:4,acc:"exact",note:"The physical decay of power; the face as symbol; nature as superior force; transience."},

  // ── THE PRELUDE extra quotes ──
  {id:"pac-prel-05",work:"Power and Conflict",char:"William Wordsworth",loc:"The Prelude (Stealing the Boat)",themes:["Nature","Power","Childhood"],methods:["Personification","Gothic imagery","Tone"],text:"like a living thing / It seemed to stride after me",analysis:"The mountain pursues the boy like a predator — 'stride' is the deliberate movement of a creature with intent. Wordsworth gives nature not just agency but malice: it moves with purpose in response to his theft. The Gothic imagery turns the natural world into a moral arbiter that punishes transgression.",stars:5,acc:"exact",note:"Nature as moral force; the sublime; childhood guilt; personification; Romantic ideology."},

  {id:"pac-prel-06",work:"Power and Conflict",char:"William Wordsworth",loc:"The Prelude (Stealing the Boat)",themes:["Nature","Power","Fear"],methods:["Negative imagery","Tone","Pace"],text:"No familiar shapes / Remained, no pleasant images of trees",analysis:"After the mountain appears, the familiar comforting world vanishes. 'No familiar shapes' — the world the boy knows is replaced by something alien and threatening. Wordsworth shows how the sublime does not merely frighten; it reorganises reality entirely. The comfortable natural world is revealed as a thin surface over something far greater.",stars:4,acc:"exact",note:"The sublime's destabilising power; nature's duality; Wordsworth's psychological honesty."},

  // ── MY LAST DUCHESS extra quotes ──
  {id:"pac-mld-05",work:"Power and Conflict",char:"Robert Browning",loc:"My Last Duchess",themes:["Power","Control","Class"],methods:["Possessive language","Enjambment","Control"],text:"Notice Neptune, though, / Taming a sea-horse, thought a rarity",analysis:"The Duke points to another sculpture — Neptune taming a sea-horse. The image of a god dominating a creature mirrors exactly his own relationship to the Duchess. Browning makes the Duke unconsciously reveal himself: he collects art that reflects his own desire for domination. The visitor is being assessed as a future subject too.",stars:5,acc:"exact",note:"Power and control; the Duke's self-revelation; art as possession; the visitor as next victim."},

  {id:"pac-mld-06",work:"Power and Conflict",char:"Robert Browning",loc:"My Last Duchess",themes:["Power","Gender","Jealousy"],methods:["Listing","Tone","Dramatic monologue"],text:"she liked whate'er / She looked on, and her looks went everywhere",analysis:"The Duke resents that the Duchess found joy in everything — a sunset, a bough of cherries, a white mule. His complaint is that she did not reserve her happiness exclusively for him. Browning exposes the abuser's logic: joy that is not controlled is a threat. Her openness to the world is framed as infidelity.",stars:5,acc:"exact",note:"Jealousy and control; the Duke's possessiveness; the Duchess's vitality; gender dynamics."},

  // ── CHARGE OF THE LIGHT BRIGADE extra quotes ──
  {id:"pac-clb-05",work:"Power and Conflict",char:"Alfred Lord Tennyson",loc:"The Charge of the Light Brigade",themes:["Conflict","Death","Power"],methods:["Volta","Imagery","Tone"],text:"Into the jaws of Death, / Into the mouth of Hell",analysis:"The extended metaphor of Death as a consuming predator — 'jaws' and 'mouth' give death a physical body that swallows the soldiers. The descent from 'Death' to 'Hell' escalates the horror. Tennyson captures how soldiers knowingly rode into destruction yet continued: the ultimate demonstration of obedience over survival instinct.",stars:5,acc:"exact",note:"Courage in the face of certain death; imagery of death; the soldiers' nobility; military power."},

  {id:"pac-clb-06",work:"Power and Conflict",char:"Alfred Lord Tennyson",loc:"The Charge of the Light Brigade",themes:["Conflict","Death","Duty"],methods:["Repetition","Elegy","Structure"],text:"All that was left of them, / Left of six hundred.",
  analysis:"Tennyson's half-line creates a devastating pause — the incompleteness of the line mirrors the incompleteness of the survivors. 'All that was left' uses 'left' twice, the repetition suggesting a remainder, a remnant. The original 'six hundred' is now a number that haunts the poem's close: how many returned is left deliberately, heartbreakingly vague.",stars:4,acc:"exact",note:"The cost of war; structural meaning; elegiac tone; the survivors as remainder."},

  // ── EXPOSURE extra quotes ──
  {id:"pac-exp-05",work:"Power and Conflict",char:"Wilfred Owen",loc:"Exposure",themes:["Conflict","Nature","Death","Faith"],methods:["Religious imagery","Tone","Irony"],text:"For God's invincibility seem less assured",analysis:"Faith wavers in the trenches — if God is invincible, why are his creations suffering and dying in the mud? Owen's soldiers begin to doubt the existence of a protective deity. The careful understatement 'less assured' is more devastating than outright atheism: these are men who want to believe but cannot reconcile belief with experience.",stars:4,acc:"exact",note:"Faith in wartime; Owen's questioning of God; the psychological cost of prolonged suffering."},

  {id:"pac-exp-06",work:"Power and Conflict",char:"Wilfred Owen",loc:"Exposure",themes:["Conflict","Death","Nature"],methods:["Pathetic fallacy","Imagery","Tone"],text:"Dawn massing in the east her melancholy army",analysis:"The dawn — conventionally a symbol of hope — is here an army massing for attack. Owen's pathetic fallacy reverses every natural consolation: morning brings not light and warmth but a new wave of cold. The personification of dawn as a general marshalling troops makes even time itself into an enemy of the soldiers.",stars:5,acc:"exact",note:"Reversal of conventional imagery; nature as enemy; pathetic fallacy; Owen's subversion."},

  // ── STORM ON THE ISLAND extra quotes ──
  {id:"pac-soti-04",work:"Power and Conflict",char:"Seamus Heaney",loc:"Storm on the Island",themes:["Nature","Power","Conflict"],methods:["Direct address","Volta","Tone shift"],text:"Blast: you know what I mean",
  analysis:"The poet's sudden directness — 'you know what I mean' — shifts the register from description to conspiracy. Heaney implicates the reader: we all know what a blast means (both a gust and an explosion). The ambiguity activates the political subtext: the storm may also be the bombs of the Troubles. Reader and speaker share knowledge of violence.",stars:5,acc:"exact",note:"The Troubles; political subtext; ambiguity of 'blast'; direct address; Heaney's double meaning."},

  {id:"pac-soti-05",work:"Power and Conflict",char:"Seamus Heaney",loc:"Storm on the Island",themes:["Nature","Power","Loneliness"],methods:["Imagery","Contrast","Negation"],text:"There are no trees, no natural shelter",
  analysis:"The island's bareness is both literal and symbolic — without trees, there is nothing to deflect the storm, no intermediary between the people and raw elemental power. The string of negatives ('no trees, no natural shelter') strips the landscape of defence. Heaney suggests that human communities on the island are similarly exposed to political violence with no shelter.",stars:4,acc:"exact",note:"Isolation; vulnerability; the stripped landscape; link to political exposure in Northern Ireland."},

  // ── BAYONET CHARGE extra quotes ──
  {id:"pac-bc-04",work:"Power and Conflict",char:"Ted Hughes",loc:"Bayonet Charge",themes:["Conflict","Fear","Identity"],methods:["Caesura","Imagery","Pace"],text:"His sweat heavy, his rifle and himself",
  analysis:"The rhythmic collapse of the line — three heavy stresses, no verb — mirrors the physical exhaustion of running under fire. 'Himself' is placed last, almost as an afterthought: the rifle is as real to him as his own identity, perhaps more so. Hughes explores how war strips men down to pure physical existence, where identity is just another weight to carry.",stars:4,acc:"exact",note:"The weight of war; identity and survival; Hughes's technique; rhythm as meaning."},

  {id:"pac-bc-05",work:"Power and Conflict",char:"Ted Hughes",loc:"Bayonet Charge",themes:["Conflict","Fear","Nature"],methods:["Simile","Imagery","Contrast"],text:"In what cold clockwork of the stars and the nations / Was he the hand pointing that second?",
  analysis:"The rhetorical question lifts suddenly from the physical to the cosmic — the soldier wonders if he is a cog in some vast mechanical destiny. 'Clockwork' suggests both precision and inevitability: the stars and nations have conspired to place him here. Hughes reveals the ordinary soldier's terrible anonymity within the machinery of history and war.",stars:5,acc:"exact",note:"The individual vs history; cosmic scale; the soldier as instrument; Hughes's philosophical reach."},

  // ── REMAINS extra quotes ──
  {id:"pac-rem-04",work:"Power and Conflict",char:"Simon Armitage",loc:"Remains",themes:["Conflict","Guilt","Responsibility","Memory"],methods:["Colloquial tone","Graphic imagery","Present tense"],text:"I see every round as it rips through his life — / I see his face, the empty sleeve",analysis:"'Rips through his life' — 'life' is deliberately ambiguous between his body and his existence. The present tense ('I see') shows this is happening now, not in memory: the soldier is watching the killing on an endless loop. 'Empty sleeve' is the detail that haunts — specific enough to be real, devastating enough to be unforgettable.",stars:5,acc:"exact",note:"PTSD and intrusive memory; present tense trauma; the haunting specific detail; Armitage's technique."},

  {id:"pac-rem-05",work:"Power and Conflict",char:"Simon Armitage",loc:"Remains",themes:["Conflict","Guilt","Responsibility"],methods:["Anaphora","Ambiguity","Legal language"],text:"himself. / All three of us opened fire.",
  analysis:"The period after 'himself' creates a dramatic pause before the confession: three soldiers shot, but only this speaker is haunted. The collective 'All three of us' diffuses responsibility while the soldier simultaneously claims it — he is one of three, yet speaks as though sole guilty party. Armitage explores how guilt distributes itself unevenly among people who share an act.",stars:4,acc:"exact",note:"Shared responsibility; guilt; collective action; Armitage's moral complexity; legal ambiguity."},

  // ── POPPIES extra quotes ──
  {id:"pac-pop-04",work:"Power and Conflict",char:"Jane Weir",loc:"Poppies",themes:["Loss","Memory","Family","Conflict"],methods:["Domestic imagery","Tactile imagery","Contrast"],text:"gripped the front door, / …released a song bird from its cage",analysis:"The mother grips the front door — holding on, resisting the release — then enacts it anyway. The shift from 'gripped' (control, fear) to 'released' (letting go) captures the paradox of parenting: love requires the letting go that love resists. The song bird metaphor transforms the departure into something beautiful and irreversible.",stars:5,acc:"exact",note:"The mother's ambivalence; control and release; parental love; domestic vs military world."},

  {id:"pac-pop-05",work:"Power and Conflict",char:"Jane Weir",loc:"Poppies",themes:["Loss","Memory","Family"],methods:["Sensory detail","Tactile imagery","Emotion"],text:"I smoothed down your shirt's / upturned collar, steeled the softening / of my face",
  analysis:"The mother controls her own emotional expression — 'steeled the softening' — just as she smooths her son's collar. Both are acts of containment: the collar must be neat, the grief must not show. 'Steeled' is a hard, military word in a domestic, tender moment. Weir shows how women perform emotional control to protect their children from the weight of parental fear.",stars:5,acc:"exact",note:"Emotional control; domestic tenderness; the mother's suppressed grief; gender and war."},

  // ── WAR PHOTOGRAPHER extra quotes ──
  {id:"pac-wp-04",work:"Power and Conflict",char:"Carol Ann Duffy",loc:"War Photographer",themes:["Conflict","Memory","Guilt"],methods:["Religious imagery","Imagery","Simile"],text:"He has a job to do. Solutions slop in trays / beneath his hands which did not tremble then",
  analysis:"The photographer's hands that did not shake while photographing death now shake processing the photographs in safety — war numbs the instinct that peace restores. 'Solutions slop' combines the chemical and the moral: the developing solution and the moral solutions he cannot find. His steadiness in conflict is disturbing; his trembling in safety is human.",stars:5,acc:"exact",note:"The ethics of war photography; distance and guilt; the body as moral gauge; Duffy's imagery."},

  {id:"pac-wp-05",work:"Power and Conflict",char:"Carol Ann Duffy",loc:"War Photographer",themes:["Conflict","Guilt","Distance","Memory"],methods:["Simile","Imagery","Contrast"],text:"something is happening. A stranger's features / faintly start to twist before his eyes",
  analysis:"In the developing tray, a dead man's face slowly appears. 'Faintly start to twist' captures the photographic process but also suggests the man's face contorting in death. The word 'stranger' is charged — the photographer knew nothing of this man in life, only his death. Duffy explores how photography creates intimacy with suffering without creating connection.",stars:4,acc:"exact",note:"The photography process as metaphor; distance vs intimacy with suffering; memory; guilt."},

  // ── TISSUE extra quotes ──
  {id:"pac-tis-04",work:"Power and Conflict",char:"Imtiaz Dharker",loc:"Tissue",themes:["Power","Transience","Control"],methods:["Imagery","Irony","Symbolism"],text:"maps, / the borderlines we draw on the world,",
  analysis:"Maps — instruments of political power, colonial conquest, and national identity — are made of tissue paper. Dharker reduces the most authoritative assertion of power (drawing national borders) to fragile paper. 'Borderlines we draw' acknowledges the arbitrary human act of imposing lines on a world that has none: borders are drawn, not discovered.",stars:5,acc:"exact",note:"Political power; borders; colonialism; the fragility of human authority; maps as power."},

  {id:"pac-tis-05",work:"Power and Conflict",char:"Imtiaz Dharker",loc:"Tissue",themes:["Power","Transience","Religion"],methods:["Imagery","Symbolism","Tone"],text:"An architect could use it. / Under the layers, what \ was not brick",
  analysis:"Dharker imagines a building made of tissue — transparent, permeable, letting in light. The architect who could 'use it' might be divine or human. If buildings (institutions, power structures) were built of tissue rather than brick, they could not dominate. What lies under solid, authoritative structures is the same fragile stuff: the human beneath the institution.",stars:4,acc:"exact",note:"Power structures as brick vs tissue; fragility beneath authority; divine architecture; human institutions."},

  // ── KAMIKAZE extra quotes ──
  {id:"pac-kam-04",work:"Power and Conflict",char:"Beatrice Garland",loc:"Kamikaze",themes:["Conflict","Nature","Identity","Choice"],methods:["Imagery","List","Pace"],text:"tuna, the dark prince, / the soft-bellied mackerel",
  analysis:"The pilot recalls his father's fisherman's knowledge — specific, sensory, particular. The fish have names that suggest identity ('dark prince') and vulnerability ('soft-bellied'). This knowledge of individual creatures connects the pilot to life, particularity, and a world of meaning beyond the military ideology that seeks to reduce him to an anonymous instrument of death.",stars:4,acc:"exact",note:"Nature and identity; the father's world vs military duty; particularity of life vs anonymity of death."},

  {id:"pac-kam-05",work:"Power and Conflict",char:"Beatrice Garland",loc:"Kamikaze",themes:["Honour","Family","Identity","Conflict"],methods:["Narrative shift","Second person","Tone"],text:"she said, he had never / returned",
  analysis:"The poem's final words shift to a daughter's reported speech: 'she said, he had never / returned.' The ambiguity is devastating — the pilot who turned back physically 'returned' home, but the family's silence was such a complete rejection that in all the ways that matter, he 'never returned' at all. Social death equalled physical death.",stars:5,acc:"exact",note:"Social death vs physical death; the daughter's perspective; ambiguity; honour culture's cruelty."},

  // ── CHECKING OUT ME HISTORY extra quotes ──
  {id:"pac-comh-04",work:"Power and Conflict",char:"John Agard",loc:"Checking Out Me History",themes:["Power","Identity","Colonialism"],methods:["Contrast","Italics","Structure"],text:"Dem tell me wha dem want to tell me / But now I checking out me own history",
  analysis:"The poem's structural pivot: the passive 'dem tell me' gives way to the active 'I checking out'. Agard's speaker moves from recipient of imposed history to active seeker of his own. The Caribbean dialect 'checking out' carries both investigation and rejection — he is examining and discarding the colonial curriculum simultaneously. Self-education as liberation.",stars:5,acc:"exact",note:"Agency and education; decolonising the curriculum; Agard's pivot; dialect as resistance."},

  {id:"pac-comh-05",work:"Power and Conflict",char:"John Agard",loc:"Checking Out Me History",themes:["Power","Identity","Women","Resistance"],methods:["Extended metaphor","Italics","Contrast"],text:"Nanny de maroon / like she-devil haunt de imagination",
  analysis:"Nanny of the Maroons — an 18th century resistance leader — is rendered in italics (a different visual identity) as a supernatural, powerful figure. 'She-devil' is how colonial forces likely described her; Agard reclaims the label as a mark of terrifying power. The 'haunt' suggests she lives in the imagination still: history that was suppressed is not dead.",stars:4,acc:"exact",note:"Women's history; Nanny of the Maroons; reclaiming suppressed narratives; postcolonial identity."},

  // ── THE EMIGRÉE (Rumens) — NEW POEM ──
  {id:"pac-em-01",work:"Power and Conflict",char:"Carol Rumens",loc:"The Emigrée",themes:["Identity","Memory","Conflict","Power"],methods:["Extended metaphor","Light imagery","Nostalgia"],text:"There once was a country... I left it as a child / but my memory of it is sunlight-clear",
  analysis:"Rumens opens with fairy-tale diction ('There once was') — the lost country has mythic, unreachable quality. But 'sunlight-clear' contradicts the distance: memory is vivid, precise, warm. The emigree's homeland exists in two incompatible states simultaneously — lost in reality, perfectly preserved in memory. This tension between loss and recollection drives the entire poem.",stars:5,acc:"exact",note:"Memory vs reality; the emigree's condition; light as memory; identity and displacement."},

  {id:"pac-em-02",work:"Power and Conflict",char:"Carol Rumens",loc:"The Emigrée",themes:["Identity","Memory","Conflict","Power"],methods:["Light imagery","Personification","Optimism"],text:"It tastes of sunlight. / Its grammar still persists",
  analysis:"Memory has a physical quality — it can be tasted. The homeland is sensory and real in recollection even if inaccessible in reality. 'Grammar still persists' shifts to language: the structures, rhythms, and idioms of the lost country live in the speaker's voice and thought. Language is the indestructible form of identity — it cannot be taken by political violence or exile.",stars:5,acc:"exact",note:"Language as identity; memory and the senses; the persistence of homeland in language; emigree experience."},

  {id:"pac-em-03",work:"Power and Conflict",char:"Carol Rumens",loc:"The Emigrée",themes:["Identity","Power","Conflict","Oppression"],methods:["Personification","Extended metaphor","Defiance"],text:"The city I come from / wants me to have forgotten it",
  analysis:"The city is personified as having political will — it 'wants' the speaker to forget. This is Rumens's most direct political statement: authoritarian regimes erase diaspora identities, want emigrants to lose their sense of home and thus their claim to it. But the speaker refuses: memory is an act of resistance. To remember is to resist the state's power to define who belongs.",stars:5,acc:"exact",note:"Political power over identity; memory as resistance; authoritarian erasure; the emigree's defiance."},

  {id:"pac-em-04",work:"Power and Conflict",char:"Carol Rumens",loc:"The Emigrée",themes:["Identity","Oppression","Power","Memory"],methods:["Darkness imagery","Contrast","Metaphor"],text:"They may / as well erase my darkness with their night.",
  analysis:"'Darkness' here is the speaker's own shadow, her individual existence — a darkness the oppressive forces cannot distinguish from their own 'night' (mass darkness, oppression, erasure). The paradox: they try to erase her by absorbing her into their darkness, but she retains individual identity. The contrast between personal shadow and political night is Rumens's most concentrated image of resistance.",stars:5,acc:"exact",note:"Individual identity vs mass oppression; light and dark imagery; resistance; the emigree's survival."},

  {id:"pac-em-05",work:"Power and Conflict",char:"Carol Rumens",loc:"The Emigrée",themes:["Identity","Memory","Loss"],methods:["Personification","Tone","Closing image"],text:"I have no passport, there's a . But my city takes me dancing",
  analysis:"The speaker has no legal right of return — no passport, bureaucratic barriers — but her city takes her 'dancing' in memory and imagination. The lightness of 'dancing' against the heaviness of official exclusion is Rumens's closing affirmation: emotional and imaginative belonging cannot be administered away. The city lives in the speaker whether she can return or not.",stars:5,acc:"exact",note:"Memory vs legal identity; the power of imagination; belonging; the poem's defiant ending."},

  // ════════ AN INSPECTOR CALLS — MANY MORE QUOTES ════════

  {id:"aic-ext-01",work:"An Inspector Calls",char:"Inspector Goole",loc:"Act 3",themes:["Responsibility","Social justice","Socialism"],methods:["Anaphora","Rhetoric","Direct address"],text:"We are members of one body. We are responsible for each other.",analysis:"The Inspector's thesis, delivered with Biblical simplicity. The anaphora of 'We are' is collective, inclusive — no one is exempt. 'Members of one body' is a Christian metaphor: the community is an organism in which each part affects the whole. Priestley's socialism is expressed through moral, not economic, language — guilt is collective, not just individual.",stars:5,acc:"exact",note:"Priestley's message; collective responsibility; socialist ideology; the Inspector's purpose; key quote."},

  {id:"aic-ext-02",work:"An Inspector Calls",char:"Inspector Goole",loc:"Act 3",themes:["Responsibility","Warning","Social justice"],methods:["Rhetorical question","Warning","Prophetic tone"],text:"And if men will not learn that lesson, then they will be taught it in fire and blood and anguish.",analysis:"The Inspector's closing prophecy — WWI and WWII are implicitly predicted. 'Fire and blood and anguish' is the language of apocalypse. Priestley, writing in 1945, makes the Inspector speak as a prophet: the failure to accept social responsibility leads to the catastrophes of the 20th century. The lesson of mutual responsibility, ignored, costs everything.",stars:5,acc:"exact",note:"Priestley's warning; WWI/WWII; collective guilt; prophetic tone; dramatic irony; key closing speech."},

  {id:"aic-ext-03",work:"An Inspector Calls",char:"Inspector Goole",loc:"Act 1",themes:["Responsibility","Power","Guilt"],methods:["Dramatic irony","Simple diction","Tone"],text:"I don't need to know any more. Neither do you.",analysis:"The Inspector's quiet certainty is more powerful than Birling's bluster. He already knows everything — the investigation is not for his benefit but for the Birlings'. Each character must confront what they did; the Inspector merely catalyses that confrontation. 'Neither do you' implicates the current character directly and challenges them to acknowledge what they already know.",stars:4,acc:"exact",note:"The Inspector's power; guilt as knowledge; Priestley's dramatic technique; psychological pressure."},

  {id:"aic-ext-04",work:"An Inspector Calls",char:"Sheila Birling",loc:"Act 2",themes:["Responsibility","Gender","Change"],methods:["Dramatic irony","Tone","Self-awareness"],text:"You're beginning to pretend now that nothing's really happened at all. And I can't. How do you expect me to?",analysis:"Sheila refuses to collude in the family's erasure of guilt. Unlike Gerald and her parents, she cannot perform normalcy after what she's learned. 'Pretend' exposes the family's coping mechanism as dishonesty. Sheila's question is rhetorical and moral: once you have truly understood your responsibility, you cannot simply return to comfortable ignorance.",stars:5,acc:"exact",note:"Sheila's moral development; generational divide; the impossibility of innocence; Priestley's optimism."},

  {id:"aic-ext-05",work:"An Inspector Calls",char:"Sheila Birling",loc:"Act 1",themes:["Responsibility","Class","Guilt"],methods:["Confession","Shame","Simple diction"],text:"I know I'm to blame — and I'm desperately sorry",analysis:"Sheila is the first Birling to confess outright. 'Desperately' signals genuine distress, not social performance. Her willingness to accept blame without qualification distinguishes her from her parents' evasions. For Priestley, this moment of honest contrition is the model moral response — acknowledging fault without qualification or excuse.",stars:5,acc:"exact",note:"Sheila's moral awakening; confession and responsibility; contrast with Birling; Priestley's hope."},

  {id:"aic-ext-06",work:"An Inspector Calls",char:"Eric Birling",loc:"Act 3",themes:["Responsibility","Capitalism","Class"],methods:["Accusation","Simple diction","Direct address"],text:"And I say the girl's dead and we all helped to kill her",analysis:"Eric's brutal, plain statement cuts through the family's euphemisms and legal calculations. 'We all helped to kill her' is collective, explicit, and refuses the family's attempts to deflect. Unlike his father's endless qualifications, Eric offers a moral verdict without conditions. He is the male equivalent of Sheila in moral development.",stars:5,acc:"exact",note:"Collective guilt; Eric's development; contrast with Mr Birling; direct moral statement; Priestley's message."},

  {id:"aic-ext-07",work:"An Inspector Calls",char:"Mr Birling",loc:"Act 3",themes:["Capitalism","Responsibility","Selfishness"],methods:["Prioritisation","Tone","Dramatic irony"],text:"I was thinking of the publicity, the scandal",analysis:"Even after learning of Eva Smith's death and his family's complicity, Birling's first concern is reputation — not the dead girl, not his family's souls, but newspaper coverage. Priestley makes Birling morally ridiculous at the moment he should be most ashamed. The audience's contempt for Birling is at its highest here.",stars:5,acc:"exact",note:"Birling's moral bankruptcy; capitalism and reputation; Priestley's satire; the family vs society."},

  {id:"aic-ext-08",work:"An Inspector Calls",char:"Mrs Birling",loc:"Act 2",themes:["Class","Responsibility","Denial"],methods:["Dramatic irony","Euphemism","Class prejudice"],text:"I'm sorry she should have come to such a miserable end. But I accept no blame for it at all.",analysis:"Mrs Birling acknowledges Eva's death with a perfunctory 'sorry' then immediately denies all responsibility. The juxtaposition is Priestley's sharpest characterisation of her: a woman who performs sympathy but refuses its logical consequence — responsibility. 'Accept no blame' is a legal formulation that reveals she is protecting her interests, not engaging morally.",stars:5,acc:"exact",note:"Mrs Birling's denial; class prejudice; responsibility avoided; Priestley's critique of the upper-middle class."},

  {id:"aic-ext-09",work:"An Inspector Calls",char:"Mrs Birling",loc:"Act 2",themes:["Class","Responsibility","Power"],methods:["Irony","Dramatic irony","Foreshadowing"],text:"He ought to be dealt with very severely",
  analysis:"Mrs Birling is condemning the 'father of the child' — who is about to be revealed as Eric, her own son. Priestley constructs the most devastating dramatic irony in the play: she sentences her own child without knowing it. Her certainty, her moral outrage, her class confidence — all are about to collapse on her entirely. The audience watches in horrified anticipation.",stars:5,acc:"exact",note:"Dramatic irony; Priestley's plotting; Mrs Birling's class assumptions; the collapse of her certainty."},

  {id:"aic-ext-10",work:"An Inspector Calls",char:"Gerald Croft",loc:"Act 2",themes:["Class","Gender","Responsibility"],methods:["Tone","Euphemism","Self-justification"],text:"She was very pretty and warm-hearted — and intensely grateful.",analysis:"Gerald describes his relationship with Daisy Renton. 'Intensely grateful' is a euphemism that reveals the power imbalance: she was grateful because he had money and she had none. His phrasing performs generosity ('I helped her') while revealing exploitation. The tone of the man who saved a woman he then abandoned when inconvenient.",stars:4,acc:"exact",note:"Class and power; exploitation of women; Gerald's self-deception; Priestley's critique of men."},

  {id:"aic-ext-11",work:"An Inspector Calls",char:"Gerald Croft",loc:"Act 2",themes:["Class","Responsibility","Gender"],methods:["Admission","Tone","Euphemism"],text:"I suppose it was inevitable. She was young and pretty and warm-hearted.",
  analysis:"Gerald presents the inevitability of his affair as if it were a natural law — a young, pretty, grateful woman plus a wealthy man equals an inevitable outcome. 'Inevitable' denies choice, responsibility, and agency. Priestley exposes how men of Gerald's class naturalise their exploitation of vulnerable women, treating power imbalance as romantic destiny.",stars:4,acc:"exact",note:"Male entitlement; class and gender; euphemism; Gerald's self-justification; Priestley's critique."},

  {id:"aic-ext-12",work:"An Inspector Calls",char:"Inspector Goole",loc:"Act 1",themes:["Responsibility","Social justice","Class"],methods:["Simple diction","Moral weight","Revelation"],text:"Two hours ago a young woman died in the Infirmary.",analysis:"The Inspector's opening statement is a masterclass in dramatic economy. No preamble, no softening — just the fact of death. The precision ('two hours ago') makes it immediate and real. Priestley uses the Inspector to insist on the concrete reality of Eva Smith: she is not an abstract concept but a person who died at a specific time. The Birlings cannot abstract away from that.",stars:5,acc:"exact",note:"The Inspector's technique; Eva Smith's reality; opening the investigation; Priestley's moral urgency."},

  {id:"aic-ext-13",work:"An Inspector Calls",char:"Mr Birling",loc:"Act 1",themes:["Capitalism","Responsibility","Power"],methods:["Hubris","Dramatic irony","Rhetoric"],text:"a man has to make his own way — has to look after himself — and his family too, of course",
  analysis:"Birling's economic individualism — 'look after himself' — is immediately softened with 'and his family too, of course', as if family extends his selfishness rather than contradicting it. Priestley shows that Birling's ethics are based on a closed circle of self-interest: the family is an extension of the self, not an opening toward community. Society does not enter his calculation.",stars:4,acc:"exact",note:"Individualism vs community; Birling's self-interest; Priestley's critique of capitalism; the family circle."},

  {id:"aic-ext-14",work:"An Inspector Calls",char:"Sheila Birling",loc:"Act 2",themes:["Responsibility","Class","Power"],methods:["Dramatic irony","Tone","Self-awareness"],text:"Between us we drove that girl to commit suicide.",analysis:"Sheila's moral clarity — 'between us', not 'I' alone — acknowledges collective guilt without erasing individual responsibility. 'Drove' is an active verb: the family didn't passively allow Eva's death, they propelled it. 'Commit suicide' refuses the euphemisms her parents prefer. Sheila is Priestley's moral voice at her most direct.",stars:5,acc:"exact",note:"Collective responsibility; Sheila's moral development; active guilt; Priestley's moral message."},

  {id:"aic-ext-15",work:"An Inspector Calls",char:"Inspector Goole",loc:"Act 1",themes:["Social justice","Class","Responsibility"],methods:["Irony","Simple diction","Revelation"],text:"She'd had a lot to say — far too much — so she had to go.",analysis:"The Inspector reveals Eva Smith was fired by Birling for 'having a lot to say' — for organising workers and demanding fair wages. The irony is savage: her assertiveness, her articulation of her own needs and rights, is precisely what gets her killed. Birling silenced her voice; the play gives it back.",stars:5,acc:"exact",note:"Workers' rights; power and voice; Eva Smith's humanity; Birling's abuse of power; class oppression."},

  {id:"aic-ext-16",work:"An Inspector Calls",char:"Eric Birling",loc:"Act 3",themes:["Responsibility","Class","Guilt"],methods:["Confession","Direct speech","Shame"],text:"I was in that state when a chap easily turns nasty",analysis:"Eric's confession about forcing himself on Eva — described through euphemism ('turns nasty') — is both honest and evasive. The euphemism reveals how men of his class were taught to describe sexual violence: as a mood state, almost an accident. Yet his shame is genuine. Priestley shows a young man conditioned by class into behaviour he himself finds shameful.",stars:5,acc:"exact",note:"Sexual violence and class; Eric's guilt; euphemism and confession; male privilege; Eric's moral complexity."},

  {id:"aic-ext-17",work:"An Inspector Calls",char:"Mr Birling",loc:"Act 3",themes:["Capitalism","Responsibility","Denial"],methods:["Relief","Dramatic irony","Character revelation"],text:"There's every excuse for what both your mother and I did — it turned out unfortunately — that's all.",
  analysis:"'That's all' — Birling reduces Eva's death to an unfortunate outcome of defensible decisions. The phrase is a full stop on his engagement with guilt. Priestley makes Birling most contemptible not when he is arrogant but when he is relieved: the news that the Inspector may be a fraud frees him entirely from the moral reckoning he should not need to be forced into.",stars:5,acc:"exact",note:"Birling's moral bankruptcy; the play's ending; Priestley's critique; class and accountability."},

  {id:"aic-ext-18",work:"An Inspector Calls",char:"Sheila Birling",loc:"Act 3",themes:["Responsibility","Change","Generational divide"],methods:["Exasperation","Direct address","Simple diction"],text:"(passionately) You're not sorry at all. Not one of you. And it's the most frightening thing I've ever heard.",
  analysis:"Sheila's passionate outburst at the end distinguishes her from her family absolutely. 'Not one of you' is an indictment that includes Gerald. 'Frightening' signals that the real horror is not Eva's death but her family's incapacity for genuine remorse. For Sheila — and for Priestley — the inability to feel guilt is more terrifying than the acts that warranted it.",stars:5,acc:"exact",note:"Sheila's moral isolation; generational divide; the nature of conscience; Priestley's hope and horror."},

function sm2(card, grade) {
  // grade: 0=again, 1=hard, 2=good, 3=easy
  let {ef=2.5, interval=0, reps=0, due} = card.srs||{};
  if(grade<1){reps=0;interval=1;}
  else{
    reps++;
    if(reps===1)interval=1;
    else if(reps===2)interval=6;
    else interval=Math.round(interval*ef);
    ef=Math.max(1.3,ef+(0.1-(3-grade)*(0.08+(3-grade)*0.02)));
  }
  const d=new Date();d.setDate(d.getDate()+interval);
  return{ef,interval,reps,due:d.toISOString().slice(0,10)};
}
function isDue(srs){if(!srs||!srs.due)return true;return srs.due<=new Date().toISOString().slice(0,10);}
function dueCount(){return allQ().filter(q=>isDue(q.srs||{})).length;}

function validateStreak(){

  const today =
    new Date().toISOString().slice(0,10);

  const todayDate =
    new Date(today);

  const lastDate =
    new Date(S.lastXpDate);

  const days =
    Math.floor(
      (todayDate - lastDate) /
      86400000
    );

  if(days > 1){

    S.streak = 0;

    save();

    const k = getUserKey();

    if(k){
      fetch(
        WORKER_URL + '/lb/streak',
        {
          method:'POST',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify({
            userKey:k,
            streak:0,
            max_streak:S.maxStreak
          })
        }
      ).catch(()=>{});
    }
  }
}

// ── Sync FROM worker on load (multi-device support) ──
async function syncFromWorker(){
  const k=getUserKey();
  if(!k)return;
  try{
    const r=await fetch(WORKER_URL+'/lb/get?userKey='+encodeURIComponent(k));
    if(!r.ok)return;
    const d=await r.json();
    if(!d.found||!d.user)return;
    const u=d.user;
    // Sync username
    if(u.username&&!getUsername()){setUsername(u.username);}
    // Sync XP — take the higher of local vs remote (XP never decreases)
    const remoteXP=u.qv_xp||0;
    if(remoteXP>S.xp){
      S.xp=remoteXP;
      toast(`☁️ XP synced from cloud (${remoteXP} XP)`,2500);
    }
    // Sync streak — also restore lastXpDate so addXP doesn't reset a synced streak
    const remoteStreak=u.streak||0;const remoteMaxStreak=u.max_streak||0;
    if(remoteStreak>S.streak){
      S.streak=remoteStreak;
      // If we have no local XP activity date, assume they were active today to protect the streak
      // (addXP checks lastXpDate==='' and resets to 1 if so)
      if(!S.lastXpDate){
        S.lastXpDate=new Date().toISOString().slice(0,10);
        localStorage.setItem('qv_lastxpdate',S.lastXpDate);
      }
    }
    if(remoteMaxStreak>S.maxStreak){S.maxStreak=remoteMaxStreak;}
// Sync theme — load custom themes first so a custom theme key can be resolved
    if(u.theme){
      const localTheme=(S.settings&&S.settings.theme)||'default';
      if(u.theme&&u.theme!==localTheme){
        await loadServerCustomThemes();
        applyTheme(u.theme);
        if(S.settings)S.settings.theme=u.theme;
      }
    }
    // Merge mastered IDs
    const remoteMastered=Array.isArray(u.qv_mastered_ids)?u.qv_mastered_ids:[];
    if(remoteMastered.length>S.mastered.size){
      let added=0;
      remoteMastered.forEach(id=>{
        const numId=+id;
        const key=Number.isFinite(numId)&&String(numId)===String(id)?numId:id;
        if(!S.mastered.has(key)&&!S.mastered.has(String(key))){
          S.mastered.add(key);S.masteryPts[key]=100;added++;
        }
      });
      if(added>0){save();toast(`☁️ Synced ${added} mastered quote${added===1?'':'s'} from cloud`,3000);}
    }
    // Sync pending submissions from other devices
    const remotePending=Array.isArray(u.qv_pending_data)?u.qv_pending_data:[];
    if(remotePending.length>0){
      const localPendingIds=new Set(S.pending.map(p=>String(p.id)));
      let syncedPending=0;
      remotePending.forEach(item=>{
        if(!localPendingIds.has(String(item.id))){
          S.pending.push({...item,_submittedByMe:true,_status:'pending'});
          syncedPending++;
        }
      });
      if(syncedPending>0){save();toast(`☁️ Synced ${syncedPending} pending submission${syncedPending===1?'':'s'}`,3000);}
    }
    // Check for rejections
    const rejectedIds=Array.isArray(u.qv_rejected_ids)?u.qv_rejected_ids:[];
    if(rejectedIds.length>0){
      // Only prompt for rejections the user hasn't already acknowledged ("keep for now")
      const acknowledgedIds=new Set(JSON.parse(localStorage.getItem('qv_rej_ack')||'[]').map(String));
      const myRejected=S.pending.filter(p=>p._submittedByMe&&rejectedIds.includes(String(p.id))&&!acknowledgedIds.has(String(p.id)));
      if(myRejected.length>0){
        promptRejectedQuotes(myRejected,rejectedIds);
        return; // render called inside prompt
      }
    }
    save();render();
  }catch(e){/* non-fatal */}
}

function promptRejectedQuotes(rejected,allRejectedIds){
  const names=rejected.map(q=>`"${q.text.slice(0,50)}"`).join(', ');
  const msg=rejected.length===1
    ?`Your submitted quote ${names} was reviewed and not approved. Would you like to remove it from your library?`
    :`${rejected.length} of your submitted quotes were not approved: ${names}. Would you like to remove them from your library?`;
  openModal(`<div>
    <div style="font-family:'Playfair Display',serif;font-size:1rem;color:var(--coral);margin-bottom:8px">📋 Submission Update</div>
    <div style="font-size:.78rem;color:var(--text2);margin-bottom:14px;line-height:1.6">${msg}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn br" onclick="dismissRejected(true)">🗑 Remove from my library</button>
      <button class="btn" onclick="dismissRejected(false)">Keep for now</button>
    </div>
  </div>`);
  window._pendingRejectedIds=allRejectedIds;
  window._pendingRejected=rejected;
}

function dismissRejected(remove){
  const rejected=window._pendingRejected||[];
  const rejectedIds=window._pendingRejectedIds||[];
  if(remove){
    const rejSet=new Set(rejectedIds.map(String));
    S.pending=S.pending.filter(p=>!rejSet.has(String(p.id)));
    save();
    // Tell worker to clear rejected ids for this user
    const k=getUserKey();
    if(k){
      fetch(WORKER_URL+'/lb/register',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({userKey:k,username:getUsername(),site:'qv',mastered:S.mastered.size,xp:S.xp,
          mastered_ids:[...S.mastered].map(String),pending_ids:[],pending_data:[]})
      }).catch(()=>{});
    }
    // Clear the local acknowledgement store too (no longer needed for removed quotes)
    const existing=JSON.parse(localStorage.getItem('qv_rej_ack')||'[]');
    const cleaned=existing.filter(id=>!rejectedIds.map(String).includes(String(id)));
    localStorage.setItem('qv_rej_ack',JSON.stringify(cleaned));
  }else{
    // "Keep for now" — remember these IDs so we don't prompt again next login
    const existing=JSON.parse(localStorage.getItem('qv_rej_ack')||'[]');
    const merged=[...new Set([...existing.map(String),...rejectedIds.map(String)])];
    localStorage.setItem('qv_rej_ack',JSON.stringify(merged));
    // Also mark the pending entries locally so they show as rejected in the UI
    S.pending=S.pending.map(p=>rejectedIds.map(String).includes(String(p.id))?{...p,_rejected:true}:p);
    save();
  }
  window._pendingRejectedIds=null;window._pendingRejected=null;
  closeModal();save();render();
}

async function applyUserKey(){
  const inp=document.getElementById('uk-input');
  if(!inp)return;
  const v=inp.value.trim();
  if(!v){document.getElementById('uk-err').innerHTML=`<span style="color:var(--coral)">Please paste a key</span>`;return;}
  // Validate it looks like a key
  if(v.length<10){document.getElementById('uk-err').innerHTML=`<span style="color:var(--coral)">That doesn't look like a valid key</span>`;return;}
  const errEl=document.getElementById('uk-err');
  errEl.innerHTML=`<span style="color:var(--blue)">⏳ Looking up key…</span>`;
  try{
    const r=await fetch(WORKER_URL+'/lb/get?userKey='+encodeURIComponent(v));
    const d=await r.json();
    if(!d.found){
      errEl.innerHTML=`<span style="color:var(--coral)">Key not found — double-check and try again</span>`;
      return;
    }
    // Key is valid — apply it
    setUserKey(v);
    if(d.user?.username)setUsername(d.user.username);
    closeModal();
    toast('🔑 Key linked! Syncing your progress…',2500);
    // Sync immediately
    await syncFromWorker();
    render();
  }catch(e){
    errEl.innerHTML=`<span style="color:var(--coral)">Connection error — check your internet</span>`;
  }
}
