    </select></div>
    <div class="fg"><label>Questions</label><select id="qn"><option value="5">5</option><option value="10" selected>10</option><option value="15">15</option><option value="20">20</option></select></div>
    <button class="btn bp bblk" onclick="startQuiz()">Start Quiz →</button>
  </div></div>`;
}
function startQuiz(){
  const w=document.getElementById('qw').value;
  const t=document.getElementById('qt').value;
  const n=+document.getElementById('qn').value;
  let pool=w==='All'?allQ():allQ().filter(q=>q.topic===w);
  if(pool.length<4)pool=allQ();
  S.quiz={active:true,topic:w,type:t,num:n,qs:shuf(pool).slice(0,n),idx:0,score:0,ans:'',checked:false};
  render();
}

// Difficulty ramp: for adaptive mode, determine question type by position
function getAdaptiveType(idx,total){
  const frac=idx/total;
  if(frac<0.25)return'period';          // Easy: which period?
  if(frac<0.45)return'section';         // Easy-medium: which theme?
  if(frac<0.65)return'date_to_event';   // Medium: date → event
  if(frac<0.82)return'event_to_date';   // Hard: event → year
  return'significance';                  // Hardest: explain significance
}

function getDiffLabel(type){
  if(type==='period'||type==='section')return`<span class="diff-badge diff-easy">🟢 Easy</span>`;
  if(type==='date_to_event')return`<span class="diff-badge diff-med">🟡 Medium</span>`;
  if(type==='event_to_date')return`<span class="diff-badge diff-hard">🔴 Hard</span>`;
  if(type==='significance')return`<span class="diff-badge diff-hard">🔴 Hardest</span>`;
  return'';
}

function rQuizQ(){
  const{qs,idx,score,checked,ans}=S.quiz;
  const q=qs[idx];
  let type=S.quiz.type==='adaptive'?getAdaptiveType(idx,qs.length):S.quiz.type;
  let prompt='',instr='',correct='',ph='',isLong=false;
  if(type==='date_to_event'){
    prompt=`<span style="font-family:'DM Mono',monospace;color:var(--gold);font-size:1.1rem">${q.year}</span><div style="font-size:.7rem;color:var(--text3);margin-top:5px">${q.topic} · ${q.period}</div>`;
    instr='What happened on this date? Describe the event.';correct=q.event;ph='Describe the event…';isLong=true;
  }else if(type==='event_to_date'){
    prompt=`${q.event}<div style="font-size:.7rem;color:var(--text3);margin-top:5px">${q.topic} · ${q.period}</div>`;
    instr='What year (or date) did this happen? Be as precise as possible.';correct=q.year;ph='e.g. 1929 or November 1938…';
  }else if(type==='significance'){
    prompt=`<span style="font-family:'DM Mono',monospace;color:var(--gold)">${q.year}</span> — ${q.event}<div style="font-size:.7rem;color:var(--text3);margin-top:5px">${q.topic}</div>`;
    instr='Explain WHY this event was significant. Include causes AND consequences.';correct=q.significance;ph='Explain significance in detail…';isLong=true;
  }else if(type==='period'){
    prompt=`${q.event}<div style="font-size:.7rem;color:var(--text3);margin-top:5px">${q.topic}</div>`;
    instr='Which period does this event belong to?';correct=q.period;ph='e.g. Weimar Republic, Anglo-Saxon, 19th Century…';
  }else if(type==='section'){
    prompt=`${q.event}<div style="font-size:.7rem;color:var(--text3);margin-top:5px">${q.topic} · ${q.year}</div>`;
    instr='Which theme or section does this belong to?';correct=q.section||q.period;ph='e.g. Consolidation of Power, Punishment…';
  }

  let feedback='';
  if(checked){
    const userN=normQ(ans||'');const corrN=normQ(correct);
    let ok=false,close=false;
    if(type==='event_to_date'){
      const nums=ans.match(/\d{3,4}/g)||[];
      const corrNums=correct.match(/\d{3,4}/g)||[];
      ok=nums.some(n=>corrNums.includes(n));
      if(!ok&&nums.length){close=nums.some(n=>corrNums.some(cn=>Math.abs(+n-+cn)<=5));}
    }else if(type==='period'||type==='section'){
      ok=userN.includes(corrN.slice(0,8))||corrN.includes(userN.slice(0,8))||sim(userN,corrN)>0.7;
      if(!ok)close=sim(userN,corrN)>0.45;
    }else{
      const s=sim(ans||'',correct);
      ok=s>0.55;
      if(!ok)close=s>0.30;
    }
    if(ok){S.quiz.score++;addXP(15);addMPts(q.id,10);}
    else if(close){addXP(5);addMPts(q.id,3);} // partial credit
    else{addXP(2);addMPts(q.id,-10);}
    S.quizHistory.push({date:new Date().toISOString().slice(0,10),correct:ok?1:0,total:1,topic:q.topic});
    save();
    const fbClass=ok?'qok':close?'qfb':'qwr';
    const fbStyle=close?'background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.3);':'';
    feedback=`<div class="qfb ${fbClass}" style="${fbStyle}">
      ${ok?'✅ Correct! +15 XP':close?'🟡 Close — nearly right! +5 XP':'❌ Not quite — +2 XP for trying'}
      <div style="margin-top:6px;font-size:.78rem"><strong style="color:var(--gold)">Answer:</strong><br>${correct}</div>
      ${type!=='significance'?`<div style="margin-top:5px;font-size:.73rem;color:var(--text2)">${q.significance.slice(0,180)}…</div>`:''}
    </div>
    <button class="btn bp" style="margin-top:9px" onclick="nextQQ()">Next →</button>`;
  }

  const activeType=S.quiz.type==='adaptive'?getAdaptiveType(idx,qs.length):S.quiz.type;
  return`<div>
  ${backBtn()}
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
    <span style="font-size:.7rem;color:var(--text3)">Q${idx+1}/${S.quiz.qs.length}</span>
    <div style="display:flex;align-items:center;gap:8px">
      ${S.quiz.type==='adaptive'?getDiffLabel(activeType):''}
      <span style="font-size:.7rem;color:var(--gold)">Score: ${score}</span>
    </div>
  </div>
  <div class="pb"><div class="pbf" style="width:${pct(idx,S.quiz.qs.length)}%"></div></div>
  <div class="qq">${prompt}</div>
  <div style="font-size:.72rem;color:var(--text2);margin-bottom:8px">${instr}</div>
  ${!checked?`
  ${isLong?`<textarea id="qans" rows="3" placeholder="${ph}" onkeydown="if(event.ctrlKey&&event.key==='Enter')submitQ()">${ans}</textarea><div class="hint">Ctrl+Enter to submit</div>`:
  `<input type="text" id="qans" placeholder="${ph}" value="${ans||''}" onkeydown="if(event.key==='Enter')submitQ()">`}
  <div style="display:flex;gap:7px;margin-top:8px">
    <button class="btn bp" onclick="submitQ()">Submit</button>
    <button class="btn" onclick="nextQQ()">Skip →</button>
  </div>`:''}
  ${feedback}
  </div>`;
}
function submitQ(){const el=document.getElementById('qans');S.quiz.ans=el?el.value:'';S.quiz.checked=true;render();}
function nextQQ(){S.quiz.idx++;S.quiz.ans='';S.quiz.checked=false;render();}
function rQuizEnd(){
  const{score,qs}=S.quiz;const p=pct(score,qs.length);
  return`<div>
  ${backBtn()}
  <div class="pt">Quiz Complete!</div>
  <div class="card" style="text-align:center;max-width:340px;margin:12px auto">
    <div style="font-size:2rem;margin-bottom:6px">${p>=80?'🏆':p>=60?'⭐':'📚'}</div>
    <div style="font-size:1.8rem;font-family:'Playfair Display',serif;color:var(--gold)">${score} / ${qs.length}</div>
    <div style="color:var(--text2);margin-top:4px">${p>=80?'Excellent!':p>=60?'Good work!':p>=40?'Keep going!':'More revision needed'}</div>
    <div class="pb" style="margin:9px 0"><div class="pbf pg" style="width:${p}%"></div></div>
  </div>
  <div style="display:flex;gap:8px;justify-content:center">
    <button class="btn bp" onclick="S.quiz.active=false;render()">New Quiz</button>
    <button class="btn" onclick="go('stats')">Stats →</button>
  </div></div>`;
}

    return`<div>

    </div>
    <div id="tc-ring" style="position:relative;display:inline-block;width:70px;height:70px">
      <svg width="70" height="70" style="position:absolute;top:0;left:0;transform:rotate(-90deg)"><circle cx="35" cy="35" r="28" fill="none" stroke="var(--bg4)" stroke-width="5"/><circle id="tc-arc" cx="35" cy="35" r="28" fill="none" stroke="${S.tc.tLeft<15?'var(--coral)':'var(--teal)'}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${2*Math.PI*28}" stroke-dashoffset="${2*Math.PI*28*(1-S.tc.tLeft/S.tc.total)}"/></svg>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:600;font-family:'DM Mono',monospace;color:${S.tc.tLeft<15?'var(--coral)':'var(--gold)'}" id="tc-num">${S.tc.tLeft}</div>

function startTC(){
  if(S.tc.timer)clearInterval(S.tc.timer);
  const w=document.getElementById('tcw').value;
  const t=+document.getElementById('tct').value;
  const tp=document.getElementById('tctype').value;
  const pool=w==='All'?allQ():allQ().filter(q=>q.topic===w);
  S.tc={active:true,topic:w,qs:shuf(pool),idx:0,score:0,tLeft:t,total:t,timer:null,ans:'',result:null,type:tp};
  render();startTCTimer();
}
function startTCTimer(){
  if(S.tc.timer)clearInterval(S.tc.timer);
  S.tc.timer=setInterval(()=>{
    S.tc.tLeft=Math.max(0,S.tc.tLeft-1);S.tc.result=null;
    const numEl=document.getElementById('tc-num');
    const pbEl=document.getElementById('tc-pb');
    const arcEl=document.getElementById('tc-arc');
    if(numEl){numEl.textContent=S.tc.tLeft;numEl.style.color=S.tc.tLeft<15?'var(--coral)':'var(--gold)';}
    if(pbEl){pbEl.style.width=pct(S.tc.tLeft,S.tc.total)+'%';pbEl.className='pbf'+(S.tc.tLeft<15?' pr':'');}
    if(arcEl){arcEl.setAttribute('stroke',S.tc.tLeft<15?'var(--coral)':'var(--teal)');arcEl.setAttribute('stroke-dashoffset',2*Math.PI*28*(1-S.tc.tLeft/S.tc.total));}
    if(S.tc.tLeft<=0){clearInterval(S.tc.timer);S.tc.timer=null;render();}
  },1000);
}
function checkTC(){
  const el=document.getElementById('tc-ans');
  const ans=(el?el.value:'').trim();
  const q=S.tc.qs[S.tc.idx%S.tc.qs.length];
  const tp=S.tc.type||'event_to_date';
  let correct='',ok=false,close=false;
  if(tp==='event_to_date'){
    correct=q.year;const nums=ans.match(/\d{3,4}/g)||[];const corrNums=q.year.match(/\d{3,4}/g)||[];
    ok=nums.some(n=>corrNums.includes(n));
    if(!ok&&nums.length)close=nums.some(n=>corrNums.some(cn=>Math.abs(+n-+cn)<=5));
  }else if(tp==='date_to_event'){correct=q.event;const s=sim(ans,q.event);ok=s>0.55;if(!ok)close=s>0.30;}
  else{correct=q.period;ok=normQ(ans).includes(normQ(q.period).slice(0,6))||sim(ans,q.period)>0.7;if(!ok)close=sim(ans,q.period)>0.4;}
  if(ok){S.tc.score++;addXP(5);addMPts(q.id,10);S.tc.result={ok:true};}
  else if(close){addXP(2);addMPts(q.id,3);S.tc.result={ok:false,close:true,correct};}
  else{addMPts(q.id,-8);S.tc.result={ok:false,correct};}
  S.tc.idx++;
  if(el){el.value='';el.focus();}
  const res=document.querySelector('.qfb');
  if(res){res.className='qfb '+(ok?'qok':'qwr');res.innerHTML=(ok?'✅ Correct! +5 XP':'❌ Answer: '+correct);}
  else{
    const qEl=document.querySelector('.qq');
    if(qEl){const r=document.createElement('div');r.className='qfb '+(ok?'qok':'qwr');r.style.marginTop='8px';r.textContent=(ok?'✅ Correct! +5 XP':'❌ Answer: '+correct);qEl.parentNode.insertBefore(r,qEl.nextSibling.nextSibling||null);}
  }
  setTimeout(()=>{
    const nextQ=S.tc.qs[S.tc.idx%S.tc.qs.length];
    const qqEl=document.querySelector('.qq');
    if(qqEl&&S.tc.tLeft>0){
      const tp2=S.tc.type||'event_to_date';
      if(tp2==='event_to_date')qqEl.innerHTML=nextQ.event.slice(0,80);
      else if(tp2==='date_to_event')qqEl.innerHTML=`<span style="font-family:'DM Mono',monospace;color:var(--gold)">${nextQ.year}</span>`;
      else qqEl.innerHTML=nextQ.event.slice(0,80);
      const rfb=document.querySelector('.qfb');if(rfb)rfb.remove();
    }
    save();
  },800);
}
function skipTC(){S.tc.idx++;const el=document.getElementById('tc-ans');if(el){el.value='';el.focus();}}
function endTC(){if(S.tc.timer){clearInterval(S.tc.timer);S.tc.timer=null;}S.tc.tLeft=0;render();}
function rTCEnd(){
  if(S.tc.timer){clearInterval(S.tc.timer);S.tc.timer=null;}
  return`<div>

function tlInitCanvas(){
  const canvas=document.getElementById('tl-canvas');if(!canvas)return;
  const wrap=document.getElementById('tl-canvas-wrap');if(!wrap)return;
  const W=wrap.clientWidth||300;
  canvas.width=W*window.devicePixelRatio;
  canvas.height=_tlState.HEIGHT*window.devicePixelRatio;
  canvas.style.height=_tlState.HEIGHT+'px';
  _tlState.canvas=canvas;_tlState.ctx=canvas.getContext('2d');
  _tlState.ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  _tlState.WIDTH=W;
  const selTopic=S.tl.topic||topics().filter(t=>t!=='All')[0];
  let pool=allQ().filter(q=>q.topic===selTopic);
  if(S.tl.period&&S.tl.period!=='All')pool=pool.filter(q=>q.period===S.tl.period);
  pool=pool.slice().sort((a,b)=>a.yearNum-b.yearNum);
  _tlState.pool=pool;
  const minY=pool[0]?.yearNum??0;const maxY=pool[pool.length-1]?.yearNum??minY+1;
  _tlState.minY=minY;_tlState.maxY=maxY;
  const range=Math.max(maxY-minY,1);
  const baseZoom=(W*0.88)/range;
  _tlState.baseZoom=baseZoom;
  if(S.tl.tlZoom!=null){_tlState.zoom=S.tl.tlZoom;}else{_tlState.zoom=baseZoom;}
  if(S.tl.tlOffset!=null){_tlState.offset=S.tl.tlOffset;}else{_tlState.offset=(W*(1-0.88)/2);}
  tlBindEvents();tlDraw();
}

function tlDraw(){
  const{ctx,WIDTH,HEIGHT,zoom,offset,minY,maxY,pool,selectedId}=_tlState;
  if(!ctx)return;
  ctx.clearRect(0,0,WIDTH,HEIGHT);
  const CY=HEIGHT/2;
  const PERIOD_COL={'Anglo-Saxon':'#7F77DD','Norman':'#1D9E75','Later Middle Ages':'#D85A30','Early Modern':'#D4537E','18th Century':'#378ADD','19th Century':'#BA7517','Modern':'#639922','Weimar Republic':'#9b7ee0','Nazi Germany':'#e85d4a','Henry VIII':'#e8c547','American West':'#3de09a','Whitechapel':'#d4549a'};
  function pCol(p){return PERIOD_COL[p]||'#9b7ee0';}
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,CY);ctx.lineTo(WIDTH,CY);ctx.stroke();
  const periodBounds={};
  pool.forEach(q=>{
    if(!periodBounds[q.period])periodBounds[q.period]={min:q.yearNum,max:q.yearNum};
    periodBounds[q.period].min=Math.min(periodBounds[q.period].min,q.yearNum);
    periodBounds[q.period].max=Math.max(periodBounds[q.period].max,q.yearNum);
  });
  Object.entries(periodBounds).forEach(([p,{min,max}])=>{
    const x1=offset+(min-5-minY)*zoom;const x2=offset+(max+5-minY)*zoom;
    if(x2<0||x1>WIDTH)return;
    ctx.fillStyle=pCol(p)+'18';ctx.fillRect(Math.max(0,x1),CY-80,Math.min(WIDTH,x2)-Math.max(0,x1),160);
  });
  const yearsVisible=WIDTH/zoom;
  const niceIntervals=[1,2,5,10,25,50,100,200,500];
  let interval=niceIntervals.find(i=>yearsVisible/i<15)||500;
  const firstTick=Math.ceil(minY/interval)*interval;
  ctx.font='10px DM Mono, monospace';ctx.textAlign='center';
  for(let y=firstTick-interval;y<=maxY+interval;y+=interval){
    const x=offset+(y-minY)*zoom;if(x<-40||x>WIDTH+40)continue;
    ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,CY-10);ctx.lineTo(x,CY+10);ctx.stroke();
    ctx.fillStyle='rgba(90,88,122,0.9)';ctx.fillText(y,x,CY+22);
  }
  pool.forEach((q,i)=>{
    const x=offset+(q.yearNum-minY)*zoom;if(x<-20||x>WIDTH+20)return;
    const isMastered=S.mastered.has(q.id);const isLearning=S.learning.has(q.id);const isSel=selectedId===q.id;
    const col=isMastered?'#3de09a':isLearning?'#e8c547':pCol(q.period);
    const r=isSel?9:(q.stars===5?6:4);const above=i%2===0;const labelY=above?CY-18:CY+30;
    ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,CY+(above?-r:r));ctx.lineTo(x,above?CY-13:CY+22);ctx.stroke();
    if(isSel){ctx.beginPath();ctx.arc(x,CY,r+4,0,Math.PI*2);ctx.strokeStyle=col+'55';ctx.lineWidth=2;ctx.stroke();}
    ctx.beginPath();ctx.arc(x,CY,r,0,Math.PI*2);ctx.fillStyle=col+'33';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=isSel?2.5:1.5;ctx.stroke();
    const maxLabelW=Math.max(50,zoom*20);let label=q.year;
    if(zoom>_tlState.baseZoom*1.5)label=q.year+' '+q.event;
    ctx.font=(isSel?'bold ':'')+`10px DM Mono, monospace`;ctx.fillStyle=isSel?col:'rgba(155,152,181,0.85)';ctx.textAlign='center';
    let txt=label;while(ctx.measureText(txt).width>maxLabelW&&txt.length>4)txt=txt.slice(0,-2)+'\u2026';
    ctx.fillText(txt,x,labelY);
  });
  const lbl=document.getElementById('tl-zoom-label');
  if(lbl)lbl.textContent=`${pool.length} events · ${Math.round(yearsVisible)} yrs visible`;
}

function tlXtoYear(x){return _tlState.minY+(x-_tlState.offset)/_tlState.zoom;}
function tlClampOffset(){
  const{WIDTH,zoom,minY,maxY}=_tlState;const range=Math.max(maxY-minY,1);const dataW=range*zoom;
  const padding=WIDTH*0.15;_tlState.offset=Math.min(padding,Math.max(WIDTH-dataW-padding,_tlState.offset));
}
function tlBindEvents(){
  const canvas=_tlState.canvas;if(!canvas||canvas._tlBound)return;canvas._tlBound=true;
  canvas.addEventListener('mousedown',e=>{_tlState.isDragging=true;_tlState._didDrag=false;_tlState.dragStartX=e.clientX;_tlState.dragStartOffset=_tlState.offset;});
  window.addEventListener('mousemove',e=>{if(!_tlState.isDragging)return;_tlState._didDrag=true;_tlState.offset=_tlState.dragStartOffset+(e.clientX-_tlState.dragStartX);tlClampOffset();tlSaveState();tlDraw();});
  window.addEventListener('mouseup',()=>{_tlState.isDragging=false;});
  canvas.addEventListener('click',e=>{
    if(_tlState._didDrag)return;
    const rect=canvas.getBoundingClientRect();const x=(e.clientX-rect.left);const y=(e.clientY-rect.top);const CY=_tlState.HEIGHT/2;
    let hit=null;let bestDist=14;
    _tlState.pool.forEach(q=>{const qx=_tlState.offset+(q.yearNum-_tlState.minY)*_tlState.zoom;const dist=Math.sqrt((x-qx)**2+(y-CY)**2);if(dist<bestDist){bestDist=dist;hit=q;}});
    if(hit){_tlState.selectedId=hit.id;tlShowDetail(hit);tlDraw();}
  });
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();const rect=canvas.getBoundingClientRect();const mouseX=e.clientX-rect.left;const yearAtMouse=tlXtoYear(mouseX);
    const factor=e.deltaY<0?1.15:0.87;_tlState.zoom=Math.max(_tlState.baseZoom*0.5,Math.min(_tlState.baseZoom*50,_tlState.zoom*factor));
    _tlState.offset=mouseX-(yearAtMouse-_tlState.minY)*_tlState.zoom;tlClampOffset();tlSaveState();tlDraw();
  },{passive:false});
  let _lastTouchX=0;
  canvas.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(e.touches.length===1){_tlState.isDragging=true;_lastTouchX=e.touches[0].clientX;_tlState.dragStartOffset=_tlState.offset;_tlState._didDrag=false;}
    else if(e.touches.length===2){_tlState.isPinching=true;_tlState.isDragging=false;const dx=e.touches[0].clientX-e.touches[1].clientX;const dy=e.touches[0].clientY-e.touches[1].clientY;_tlState.pinchStartDist=Math.sqrt(dx*dx+dy*dy);_tlState.pinchStartZoom=_tlState.zoom;_tlState.pinchMidX=(e.touches[0].clientX+e.touches[1].clientX)/2;const rect=canvas.getBoundingClientRect();_tlState.pinchYearAtMid=tlXtoYear(_tlState.pinchMidX-rect.left);}
  },{passive:false});
  canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(_tlState.isPinching&&e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX;const dy=e.touches[0].clientY-e.touches[1].clientY;const dist=Math.sqrt(dx*dx+dy*dy);const ratio=dist/_tlState.pinchStartDist;_tlState.zoom=Math.max(_tlState.baseZoom*0.5,Math.min(_tlState.baseZoom*50,_tlState.pinchStartZoom*ratio));const rect=canvas.getBoundingClientRect();const midX=(e.touches[0].clientX+e.touches[1].clientX)/2-rect.left;_tlState.offset=midX-(_tlState.pinchYearAtMid-_tlState.minY)*_tlState.zoom;tlClampOffset();tlSaveState();tlDraw();}
    else if(_tlState.isDragging&&e.touches.length===1){const dx=e.touches[0].clientX-_lastTouchX;_lastTouchX=e.touches[0].clientX;_tlState.offset+=dx;tlClampOffset();tlSaveState();tlDraw();_tlState._didDrag=true;}
  },{passive:false});
  canvas.addEventListener('touchend',e=>{
    _tlState.isPinching=false;
    if(e.touches.length===0){_tlState.isDragging=false;if(!_tlState._didDrag){const last=e.changedTouches[0];const rect=canvas.getBoundingClientRect();const x=last.clientX-rect.left;const y=last.clientY-rect.top;const CY=_tlState.HEIGHT/2;let hit=null;let bestDist=20;_tlState.pool.forEach(q=>{const qx=_tlState.offset+(q.yearNum-_tlState.minY)*_tlState.zoom;const dist=Math.sqrt((x-qx)**2+(y-CY)**2);if(dist<bestDist){bestDist=dist;hit=q;}});if(hit){_tlState.selectedId=hit.id;tlShowDetail(hit);tlDraw();}}}
  },{passive:false});
}
function tlShowDetail(q){
  const el=document.getElementById('tl-detail');if(!el)return;
  el.innerHTML=`<div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">
    <div style="font-family:'DM Mono',monospace;color:var(--gold);font-size:.88rem;flex-shrink:0">${q.year}</div>
    <div style="flex:1;min-width:160px">
      <div style="font-size:.82rem;color:var(--text);margin-bottom:3px">${q.event}</div>
      <div style="font-size:.7rem;color:var(--text2);line-height:1.5;margin-bottom:4px">${q.significance.slice(0,180)}${q.significance.length>180?'…':''}</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap">

        ${S.mastered.has(q.id)?'<span class="bm">Mastered</span>':S.learning.has(q.id)?'<span class="bl">Learning</span>':'<span class="bn">New</span>'}
      </div>
    </div>
  </div>`;
}
function tlSaveState(){S.tl.tlZoom=_tlState.zoom;S.tl.tlOffset=_tlState.offset;save();}
function tlZoomIn(){const W=_tlState.WIDTH;const yr=tlXtoYear(W/2);_tlState.zoom=Math.min(_tlState.baseZoom*50,_tlState.zoom*1.5);_tlState.offset=W/2-(yr-_tlState.minY)*_tlState.zoom;tlClampOffset();tlSaveState();tlDraw();}
function tlZoomOut(){const W=_tlState.WIDTH;const yr=tlXtoYear(W/2);_tlState.zoom=Math.max(_tlState.baseZoom*0.5,_tlState.zoom/1.5);_tlState.offset=W/2-(yr-_tlState.minY)*_tlState.zoom;tlClampOffset();tlSaveState();tlDraw();}
function tlZoomReset(){_tlState.zoom=_tlState.baseZoom;_tlState.offset=_tlState.WIDTH*(1-0.88)/2;tlSaveState();tlDraw();}
function tlHighlightDate(id){
  _tlState.selectedId=id;const q=getQ(id);if(!q)return;
  const x=(q.yearNum-_tlState.minY)*_tlState.zoom;
  _tlState.offset=_tlState.WIDTH/2-x;tlClampOffset();tlSaveState();tlDraw();if(q)tlShowDetail(q);
}

let _dragId = null;

function dragStart(id, e){
  _dragId = id;
  if(e && e.dataTransfer){
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', id);
    // Custom compact ghost image
    const ghost = document.createElement('div');
    ghost.style.cssText = 'position:fixed;top:-300px;left:-300px;background:#1a192b;color:#c4aaff;padding:4px 10px;border-radius:6px;font-size:.7rem;font-family:"DM Sans",sans-serif;white-space:nowrap;border:1px solid #7c5cbf;pointer-events:none;z-index:99999;max-width:200px;overflow:hidden;';
    const q = allQ().find(q=>q.id===id);
    ghost.textContent = q ? (q.year + ' · ' + q.event.slice(0,30)+'…') : id;
    document.body.appendChild(ghost);
    try{ e.dataTransfer.setDragImage(ghost, 100, 15); }catch(err){}
    setTimeout(()=>{ if(ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 50);
  }
}

    <button class="btn" onclick="S.tl.mode='browse';render()">← Browse View</button>
    <button class="btn" onclick="S.tl.placed={};S.tl.checked=false;render()">🔄 Reset</button>
    <button id="dd-check-btn" class="btn bg" onclick="checkDDTimeline()" style="${Object.keys(placed).length>0?'':'display:none'}">${checked?'🔄 Re-check Answers':'✅ Check Answers'}${!allPlaced&&!checked?' ('+Object.keys(placed).length+'/'+CARDS.length+' placed)':''}</button>

      <span style="color:var(--amber)">🟡 ${closeCount} close</span> ·
      <span style="color:var(--coral2)">🔴 ${Object.keys(placed).length-correctCount-closeCount} off</span>

      <button class="tl-zoom-btn" onclick="ddZoomIn()">＋</button>
      <button class="tl-zoom-btn" onclick="ddZoomOut()">－</button>
      <button class="tl-zoom-btn" onclick="ddZoomReset()">⟳ Fit</button>
      <span id="dd-zoom-label" style="font-size:.65rem;color:var(--text3);flex:1"></span>
    </div>
    <div id="dd-canvas-wrap" style="position:relative;overflow:hidden;touch-action:none;cursor:grab"
      ondragover="ddDragOver(event)"
      ondrop="ddDropOnTimeline(event)"
      ondragleave="ddDragLeave()">
      <canvas id="dd-canvas" style="display:block;width:100%"></canvas>
    </div>
  </div>

  <div style="margin-top:8px">
    <div class="sec" style="margin-top:0">📦 Event Bank — drag onto timeline above</div>
    <div style="font-size:.68rem;color:var(--text3);margin-bottom:6px">${bankCards.length} remaining · placed cards appear as dots on the timeline · check answers any time</div>
    <div class="tl-bank" id="dd-bank"
      ondragover="event.preventDefault()"
      ondrop="ddDropToBank(event)">
      ${bankHTML||'<div style="font-size:.75rem;color:var(--teal2);padding:8px">✅ All cards placed! Press Check Answers.</div>'}
    </div>
  </div>
  </div>`;
}

function ddInitCanvas(){
  const canvas=document.getElementById('dd-canvas');if(!canvas)return;
  const wrap=document.getElementById('dd-canvas-wrap');if(!wrap)return;
  const W=wrap.clientWidth||300;const H=130;
  canvas.width=W*window.devicePixelRatio;canvas.height=H*window.devicePixelRatio;canvas.style.height=H+'px';wrap.style.height=H+'px';
  const ctx=canvas.getContext('2d');ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  const selTopic=S.tl.topic||'Crime & Punishment';
  let pool=allQ().filter(q=>q.topic===selTopic);
  if(S.tl.period&&S.tl.period!=='All')pool=pool.filter(q=>q.period===S.tl.period);
  pool=pool.slice().sort((a,b)=>a.yearNum-b.yearNum);
  const minY=pool[0]?.yearNum??0;const maxY=pool[pool.length-1]?.yearNum??minY+1;
  const range=Math.max(maxY-minY,1);
  const baseZoom=(W*0.88)/range;
  _ddState={
    ..._ddState,canvas,ctx,WIDTH:W,HEIGHT:H,minY,maxY,range,baseZoom,
    zoom:_ddState.baseZoom===baseZoom?_ddState.zoom:baseZoom,
    offset:_ddState.baseZoom===baseZoom?_ddState.offset:W*(1-0.88)/2,
    cards:pool,placed:S.tl.placed||{},checked:S.tl.checked||false
  };
  _ddState.baseZoom=baseZoom;
  ddBindEvents();ddDraw();
}

function ddXtoYear(x){return _ddState.minY+(x-_ddState.offset)/_ddState.zoom;}
function ddYearToX(y){return _ddState.offset+(y-_ddState.minY)*_ddState.zoom;}
function ddSnapToNearestYear(y){return Math.round(y);}
function ddClampOffset(){
  const{WIDTH,zoom,minY,maxY}=_ddState;const range=Math.max(maxY-minY,1);const dataW=range*zoom;
  const padding=WIDTH*0.15;_ddState.offset=Math.min(padding,Math.max(WIDTH-dataW-padding,_ddState.offset));
}

function ddDraw(){
  const{ctx,WIDTH,HEIGHT,zoom,offset,minY,maxY,cards,placed,checked,range}=_ddState;
  if(!ctx)return;
  ctx.clearRect(0,0,WIDTH,HEIGHT);
  const CY=HEIGHT/2;
  const tolerance=Math.max(3,range*0.025);
  const decadeTol=Math.max(10,range*0.08);

  // axis line
  ctx.strokeStyle='rgba(255,255,255,0.13)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,CY);ctx.lineTo(WIDTH,CY);ctx.stroke();

  // tick marks and year labels
  const yearsVisible=WIDTH/zoom;
  const niceIntervals=[1,2,5,10,25,50,100,200,500];
  let interval=niceIntervals.find(i=>yearsVisible/i<15)||500;
  const firstTick=Math.ceil(minY/interval)*interval;
  ctx.font='9px DM Mono, monospace';ctx.textAlign='center';
  for(let y=firstTick-interval;y<=maxY+interval;y+=interval){
    const x=offset+(y-minY)*zoom;if(x<-40||x>WIDTH+40)continue;
    ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,CY-12);ctx.lineTo(x,CY+12);ctx.stroke();
    ctx.fillStyle='rgba(90,88,122,0.9)';ctx.fillText(y,x,CY+25);
  }

  // hoverYear indicator line
  if(_ddState.hoverYear!=null){
    const hx=offset+(_ddState.hoverYear-minY)*zoom;
    if(hx>0&&hx<WIDTH){
      ctx.strokeStyle='rgba(124,92,191,0.8)';ctx.lineWidth=2;ctx.setLineDash([4,3]);
      ctx.beginPath();ctx.moveTo(hx,10);ctx.lineTo(hx,HEIGHT-10);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='rgba(124,92,191,0.9)';ctx.font='bold 10px DM Mono, monospace';ctx.textAlign='center';
      ctx.fillText(''+_ddState.hoverYear,hx,18);
    }
  }

  // Draw placed dots on axis
  Object.entries(placed).forEach(([id,yearPlaced])=>{
    const x=offset+(yearPlaced-minY)*zoom;if(x<-20||x>WIDTH+20)return;
    const q=cards.find(c=>c.id===id);if(!q)return;
    const diff=Math.abs(yearPlaced-q.yearNum);
    let col;
    if(!checked)col='#9b7ee0';
    else if(diff<=tolerance)col='#3de09a';
    else if(diff<=decadeTol)col='#e8c547';
    else col='#e85d4a';

    // Draw a line from axis to label above/below
    const above=(id.charCodeAt(id.length-1)%2===0);
    const labelY=above?CY-32:CY+42;
    ctx.strokeStyle=col+'55';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,CY+(above?-7:7));ctx.lineTo(x,above?CY-28:CY+35);ctx.stroke();

    // Dot on axis
    ctx.beginPath();ctx.arc(x,CY,6,0,Math.PI*2);
    ctx.fillStyle=col+'44';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke();

    // Label: short event name above/below
    ctx.font='9px DM Sans, sans-serif';ctx.textAlign='center';ctx.fillStyle=col;
    const label=checked?(diff<=tolerance?'✓ '+q.year:diff<=decadeTol?'~ '+q.year:'✗ '+q.year):q.event.slice(0,20)+'…';
    let txt=label;
    const maxW=80;while(ctx.measureText(txt).width>maxW&&txt.length>4)txt=txt.slice(0,-2)+'\u2026';
    ctx.fillText(txt,x,labelY);

    // If checked and wrong, draw correct position ghost
    if(checked&&diff>tolerance){
      const cx=offset+(q.yearNum-minY)*zoom;
      if(cx>0&&cx<WIDTH){
        ctx.beginPath();ctx.arc(cx,CY,5,0,Math.PI*2);
        ctx.strokeStyle='rgba(61,224,154,0.4)';ctx.lineWidth=1;ctx.setLineDash([2,2]);ctx.stroke();ctx.setLineDash([]);
        ctx.strokeStyle='rgba(61,224,154,0.25)';ctx.lineWidth=1;ctx.setLineDash([2,4]);
        ctx.beginPath();ctx.moveTo(x,CY);ctx.lineTo(cx,CY);ctx.stroke();ctx.setLineDash([]);
        ctx.font='8px DM Mono, monospace';ctx.fillStyle='rgba(61,224,154,0.5)';ctx.textAlign='center';
        ctx.fillText(q.year,cx,above?CY+30:CY-22);
      }
    }
  });

  const lbl=document.getElementById('dd-zoom-label');
  if(lbl)lbl.textContent=`${cards.length} events · ${Math.round(yearsVisible)}y visible · zoom/pan to navigate`;
}

function ddBindEvents(){
  const canvas=document.getElementById('dd-canvas');
  const wrap=document.getElementById('dd-canvas-wrap');
  if(!canvas||!wrap||wrap._ddBound)return;wrap._ddBound=true;

  // Pan — only when not hovering a placed card and no active drag
  wrap.addEventListener('mousedown',e=>{
    if(e.target!==canvas)return;
    _ddState.isDragging=true;_ddState._didDrag=false;
    _ddState.dragStartX=e.clientX;_ddState.dragStartOffset=_ddState.offset;
    wrap.style.cursor='grabbing';
  });
  window.addEventListener('mousemove',e=>{
    if(!_ddState.isDragging)return;
    _ddState._didDrag=true;
    _ddState.offset=_ddState.dragStartOffset+(e.clientX-_ddState.dragStartX);
    ddClampOffset();ddDraw();
  });
  window.addEventListener('mouseup',()=>{_ddState.isDragging=false;wrap.style.cursor='grab';});

  // Wheel zoom
  wrap.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();const mouseX=e.clientX-rect.left;const yearAtMouse=ddXtoYear(mouseX);
    const factor=e.deltaY<0?1.15:0.87;
    _ddState.zoom=Math.max(_ddState.baseZoom*0.5,Math.min(_ddState.baseZoom*50,_ddState.zoom*factor));
    _ddState.offset=mouseX-(yearAtMouse-_ddState.minY)*_ddState.zoom;
    ddClampOffset();ddDraw();
  },{passive:false});

  // Touch pan & pinch
  let _lastTX=0;
  wrap.addEventListener('touchstart',e=>{
    if(e.touches.length===1){_ddState.isDragging=true;_ddState._didDrag=false;_lastTX=e.touches[0].clientX;}
    else if(e.touches.length===2){
      _ddState.isPinching=true;_ddState.isDragging=false;
      const dx=e.touches[0].clientX-e.touches[1].clientX;const dy=e.touches[0].clientY-e.touches[1].clientY;
      _ddState.pinchStartDist=Math.sqrt(dx*dx+dy*dy);_ddState.pinchStartZoom=_ddState.zoom;
      const rect=canvas.getBoundingClientRect();
      _ddState.pinchMidX=(e.touches[0].clientX+e.touches[1].clientX)/2-rect.left;
      _ddState.pinchYearAtMid=ddXtoYear(_ddState.pinchMidX);
    }
  },{passive:true});
  wrap.addEventListener('touchmove',e=>{
    if(e.cancelable)e.preventDefault();
    if(_ddState.isPinching&&e.touches.length===2){
      const dx=e.touches[0].clientX-e.touches[1].clientX;const dy=e.touches[0].clientY-e.touches[1].clientY;
      const dist=Math.sqrt(dx*dx+dy*dy);const ratio=dist/_ddState.pinchStartDist;
      _ddState.zoom=Math.max(_ddState.baseZoom*0.5,Math.min(_ddState.baseZoom*50,_ddState.pinchStartZoom*ratio));
      const rect=canvas.getBoundingClientRect();
      const midX=(e.touches[0].clientX+e.touches[1].clientX)/2-rect.left;
      _ddState.offset=midX-(_ddState.pinchYearAtMid-_ddState.minY)*_ddState.zoom;
      ddClampOffset();ddDraw();
    }else if(_ddState.isDragging&&e.touches.length===1){
      _ddState._didDrag=true;const dx=e.touches[0].clientX-_lastTX;_lastTX=e.touches[0].clientX;
      _ddState.offset+=dx;ddClampOffset();ddDraw();
    }
  },{passive:false});
  wrap.addEventListener('touchend',()=>{_ddState.isPinching=false;_ddState.isDragging=false;});
}

function ddZoomIn(){const W=_ddState.WIDTH;const yr=ddXtoYear(W/2);_ddState.zoom=Math.min(_ddState.baseZoom*50,_ddState.zoom*1.5);_ddState.offset=W/2-(yr-_ddState.minY)*_ddState.zoom;ddClampOffset();ddDraw();}
function ddZoomOut(){const W=_ddState.WIDTH;const yr=ddXtoYear(W/2);_ddState.zoom=Math.max(_ddState.baseZoom*0.5,_ddState.zoom/1.5);_ddState.offset=W/2-(yr-_ddState.minY)*_ddState.zoom;ddClampOffset();ddDraw();}
function ddZoomReset(){_ddState.zoom=_ddState.baseZoom;_ddState.offset=_ddState.WIDTH*(1-0.88)/2;ddDraw();}

function ddDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  const wrap=document.getElementById('dd-canvas-wrap');if(!wrap)return;
  const rect=wrap.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const year=ddSnapToNearestYear(ddXtoYear(x));
  _ddState.hoverYear=year;
  ddDraw();
  // Update indicator
  const ind=document.getElementById('dd-year-ind');
  const val=document.getElementById('dd-year-val');
  if(ind){ind.style.display='block';}
  if(val){val.textContent=year;}
}

function ddDragLeave(){
  _ddState.hoverYear=null;ddDraw();
  const ind=document.getElementById('dd-year-ind');if(ind)ind.style.display='none';
}

function ddDropOnTimeline(e){
  e.preventDefault();
  const id=_dragId||e.dataTransfer?.getData('text/plain');
  if(!id)return;
  const wrap=document.getElementById('dd-canvas-wrap');if(!wrap)return;
  const rect=wrap.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const yearPlaced=ddSnapToNearestYear(ddXtoYear(x));
  if(!S.tl.placed)S.tl.placed={};
  S.tl.placed[id]=yearPlaced;
  _ddState.placed=S.tl.placed;
  _ddState.hoverYear=null;
  S.tl.checked=false;_ddState.checked=false;
  _dragId=null;
  // Hide indicator
  const ind=document.getElementById('dd-year-ind');if(ind)ind.style.display='none';
  ddDraw();
  ddUpdateUI();
  save();
}

function ddUpdateUI(){
  const selTopic=S.tl.topic||'Crime & Punishment';
  let pool=allQ().filter(q=>q.topic===selTopic);
  if(S.tl.period&&S.tl.period!=='All')pool=pool.filter(q=>q.period===S.tl.period);
  const placed=S.tl.placed||{};
  const bankCards=pool.filter(q=>!placed[q.id]);
  const allPlaced=bankCards.length===0;
  // Update bank HTML
  const bank=document.getElementById('dd-bank');
  if(bank){
    bank.innerHTML=allPlaced
      ?'<div style="font-size:.75rem;color:var(--teal2);padding:8px">✅ All cards placed! Press Check Answers.</div>'
      :bankCards.map(q=>`<div style="background:var(--card);border:1px solid var(--border2);border-radius:7px;padding:5px 9px;font-size:.72rem;cursor:grab;line-height:1.4;max-width:180px;flex-shrink:0" id="dcard-${q.id}" draggable="true" ondragstart="dragStart('${q.id}',event)" ontouchstart="ddTouchStart('${q.id}',event)" ontouchmove="ddTouchMove(event)" ontouchend="ddTouchEnd(event)"><div style="font-size:.6rem;color:var(--text3);margin-bottom:2px">${q.period||''}</div><div style="font-weight:500">${q.event.slice(0,50)}${q.event.length>50?'…':''}</div></div>`).join('');
  }
  // Update placed counter
  const counter=document.getElementById('dd-placed-counter');
  if(counter)counter.textContent=Object.keys(placed).length+'/'+pool.length+' placed';
  // Show/update check button
  const btn=document.getElementById('dd-check-btn');
  if(btn){
    const n=Object.keys(placed).length;
    if(n>0){
      btn.style.display='';
      btn.textContent=S.tl.checked?'🔄 Re-check Answers':'✅ Check Answers'+((!allPlaced&&!S.tl.checked)?' ('+n+'/'+pool.length+' placed)':'');
    } else {
      btn.style.display='none';
    }
  }
}

function ddDropToBank(e){
  e.preventDefault();
  const id=_dragId||e.dataTransfer?.getData('text/plain');
  if(!id)return;
  if(S.tl.placed&&S.tl.placed[id])delete S.tl.placed[id];
  _ddState.placed=S.tl.placed||{};_dragId=null;
  ddDraw();render();
}

function checkDDTimeline(){
  const selTopic=S.tl.topic||'Crime & Punishment';
  let pool=allQ().filter(q=>q.topic===selTopic);
  if(S.tl.period&&S.tl.period!=='All')pool=pool.filter(q=>q.period===S.tl.period);
  const placed=S.tl.placed||{};
  const range=Math.max((_ddState.maxY||0)-(_ddState.minY||0),1);
  const tolerance=Math.max(3,range*0.025);
  const decadeTol=Math.max(10,range*0.08);
  let correct=0,close=0;
  pool.forEach(q=>{
    const yr=placed[q.id];if(yr===undefined)return;
    const diff=Math.abs(yr-q.yearNum);
    if(diff<=tolerance){correct++;addMPts(q.id,10);}
    else if(diff<=decadeTol){close++;addMPts(q.id,3);}
    else{addMPts(q.id,-8);}
  });
  S.tl.checked=true;_ddState.checked=true;_ddState.placed=placed;
  S.tl.score=correct;addXP(correct*15+close*5);save();render();
}

// Touch drag support
let _ddTouchCardId=null,_ddTouchClone=null;
function ddTouchStart(id,e){
  e.stopPropagation();_ddTouchCardId=id;
  const el=document.getElementById('dcard-'+id);if(!el)return;
  _ddTouchClone=el.cloneNode(true);
  _ddTouchClone.style.cssText='position:fixed;z-index:9999;pointer-events:none;opacity:0.88;border:1px solid var(--purple2);border-radius:7px;padding:5px 9px;background:var(--card);font-size:.72rem;max-width:150px;transition:none;';
  document.body.appendChild(_ddTouchClone);
}
function ddTouchMove(e){
  if(!_ddTouchClone)return;
  e.preventDefault();
  const t=e.touches[0];
  _ddTouchClone.style.left=(t.clientX-75)+'px';_ddTouchClone.style.top=(t.clientY-30)+'px';
  const wrap=document.getElementById('dd-canvas-wrap');
  if(wrap){
    const rect=wrap.getBoundingClientRect();
    if(t.clientX>=rect.left&&t.clientX<=rect.right&&t.clientY>=rect.top&&t.clientY<=rect.bottom){
      const x=t.clientX-rect.left;
      const yr=ddSnapToNearestYear(ddXtoYear(x));
      _ddState.hoverYear=yr;ddDraw();
      const ind=document.getElementById('dd-year-ind');const val=document.getElementById('dd-year-val');
      if(ind)ind.style.display='block';if(val)val.textContent=yr;
    }else{
      _ddState.hoverYear=null;ddDraw();
      const ind=document.getElementById('dd-year-ind');if(ind)ind.style.display='none';
    }
  }
}
function ddTouchEnd(e){
  if(!_ddTouchClone){_ddTouchCardId=null;return;}
  const t=e.changedTouches[0];
  document.body.removeChild(_ddTouchClone);_ddTouchClone=null;
  _ddState.hoverYear=null;
  const ind=document.getElementById('dd-year-ind');if(ind)ind.style.display='none';

  const wrap=document.getElementById('dd-canvas-wrap');
  const bank=document.getElementById('dd-bank');
  if(wrap){
    const r=wrap.getBoundingClientRect();
    if(t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom){
      const x=t.clientX-r.left;const yearPlaced=ddSnapToNearestYear(ddXtoYear(x));
      if(!S.tl.placed)S.tl.placed={};
      S.tl.placed[_ddTouchCardId]=yearPlaced;_ddState.placed=S.tl.placed;
      S.tl.checked=false;_ddState.checked=false;
      _ddTouchCardId=null;ddDraw();ddUpdateUI();save();
      return;
    }
  }
  if(bank){
    const r=bank.getBoundingClientRect();
    if(t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom){
      if(S.tl.placed&&S.tl.placed[_ddTouchCardId])delete S.tl.placed[_ddTouchCardId];
      _ddState.placed=S.tl.placed||{};_ddTouchCardId=null;render();return;
    }
  }
  _ddTouchCardId=null;ddDraw();
}

function rDump(){
  return`<div>
  ${backBtn()}
  <div class="pt">Brain Dump</div>
  <div class="ps">Write every date + event you can remember (one per line)</div>
  ${!S.dump.done?`
  <div class="card" style="max-width:540px">
    <div class="fg"><label>Topic</label><select id="dw">${topics().map(t=>`<option>${t}</option>`).join('')}</select></div>
    <div class="fg"><label>Type all events/dates you can remember (one per line)</label>
    <textarea id="dt" style="min-height:150px" placeholder="1829 Metropolitan Police Act&#10;1923 Hyperinflation&#10;1066 Norman Conquest&#10;…keep going!"></textarea></div>
    <button class="btn bg bblk" onclick="runDump()">Check My Answers →</button>
  </div>`:`
  <button class="bback" onclick="S.dump.done=false;render()">← Try again</button>
  <div class="g3" style="margin-bottom:10px">
    <div class="scard"><div class="snum" style="color:var(--teal)">${S.dump.results.filter(r=>r.s==='ok').length}</div><div class="slbl">✅ Correct</div></div>
    <div class="scard"><div class="snum" style="color:var(--amber)">${S.dump.results.filter(r=>r.s==='near').length}</div><div class="slbl">⚠ Nearly</div></div>
    <div class="scard"><div class="snum" style="color:var(--coral)">${S.dump.results.filter(r=>r.s==='miss').length}</div><div class="slbl">❌ Not found</div></div>
  </div>
  ${S.dump.results.map(r=>`<div class="dr ${r.s==='ok'?'dr-ok':r.s==='near'?'dr-near':'dr-miss'}">
    <span>${r.s==='ok'?'✅':r.s==='near'?'⚠️':'❌'}</span> <em>${r.input}</em>
    ${r.s!=='ok'&&r.match?`<div style="font-size:.68rem;color:var(--text3);margin-top:3px">Closest: ${r.match.year} — ${r.match.event}</div>`:''}
    ${r.s==='ok'&&r.match?`<div style="font-size:.68rem;color:var(--text3);margin-top:3px">${r.match.year} · ${r.match.topic}</div>`:''}
  </div>`).join('')}
  `}
  </div>`;
}
function runDump(){
  const w=document.getElementById('dw').value;
  const t=document.getElementById('dt').value;
  const lines=t.split('\n').map(l=>l.trim()).filter(l=>l.length>3);
  const pool=w==='All'?allQ():allQ().filter(q=>q.topic===w);
  S.dump.results=lines.map(line=>{
    const{score,quote}=bestMatch(line,pool);
    const s=score>.65?'ok':score>.35?'near':'miss';
    if(quote&&s==='ok')addMPts(quote.id,10);
    else if(quote&&s==='near')addMPts(quote.id,3);
    return{input:line,s,match:quote};
  });
  addXP(S.dump.results.filter(r=>r.s==='ok').length*8);
  S.dump.done=true;render();
}

function rAdd(){
  const topicOpts=["Crime & Punishment","Weimar & Nazi Germany","Henry VIII","American West","Other"];
  const myPending=S.pending.filter(p=>p._submittedByMe&&p._status==='pending');
  return`<div>

  <div class="ps">Suggest a fact · goes to admin queue for approval · visible to you immediately while pending</div>
  <div style="max-width:520px">
    <div class="fg"><label>Year / Date *</label><input type="text" id="a-yr" placeholder="e.g. 1929 or November 1938"></div>
    <div class="fg"><label>Event *</label><input type="text" id="a-ev" placeholder="Brief name of the event" oninput="liveDupCheck()"></div>
    <div id="live-dup" style="margin-bottom:8px"></div>

function liveDupCheck(){
  const ev=(document.getElementById('a-ev')?.value||'').trim();
  if(ev.length<5){document.getElementById('live-dup').innerHTML='';return;}
  const{score,quote}=bestMatch(ev,allQ());
  const el=document.getElementById('live-dup');
  if(score>.85)el.innerHTML=`<div class="qfb qwr" style="font-size:.72rem">⚠ Possible duplicate: <em>${quote.year} — ${quote.event}</em></div>`;
  else if(score>.5)el.innerHTML=`<div class="qfb" style="background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.2);font-size:.72rem">Similar exists: ${quote.year} — ${quote.event}</div>`;
  else el.innerHTML=`<div style="font-size:.68rem;color:var(--teal2)">✓ No close duplicate found</div>`;
}
function checkDupFact(){
  const ev=(document.getElementById('a-ev')?.value||'').trim();
  if(!ev){document.getElementById('add-fb').innerHTML=`<div class="qfb qwr">Enter an event first.</div>`;return;}
  const{score,quote}=bestMatch(ev,allQ());
  const el=document.getElementById('add-fb');
  if(score>.85)el.innerHTML=`<div class="qfb qwr">⚠ Likely duplicate:<br>${quote.year} — ${quote.event}</div>`;
  else if(score>.5)el.innerHTML=`<div class="qfb" style="background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.2)">Most similar (${Math.round(score*100)}%):<br>${quote.year} — ${quote.event}</div>`;
  else el.innerHTML=`<div class="qfb qok">✓ No duplicate — looks new!</div>`;
}
async function saveFact(){
  const yr=(document.getElementById('a-yr')?.value||'').trim();
  const ev=(document.getElementById('a-ev')?.value||'').trim();
  const sig=(document.getElementById('a-sig')?.value||'').trim();
  if(!yr||!ev||!sig){toast('Fill in year, event, and significance');return;}
  const tempId=Date.now().toString()+'-dv'+Math.random().toString(36).slice(2,6);
  const q={id:tempId,year:yr,event:ev,significance:sig,
    topic:document.getElementById('a-to').value,period:document.getElementById('a-pe').value,
    section:document.getElementById('a-sec').value,category:document.getElementById('a-cat').value,
    stars:+document.getElementById('a-st').value,note:document.getElementById('a-no').value,
    yearNum:parseInt(yr.match(/\d+/)?.[0])||0,submittedAt:new Date().toISOString(),
    _submittedByMe:true,_status:'pending'};
  const fbEl=document.getElementById('add-fb');
  fbEl.innerHTML=`<div class="qfb" style="background:rgba(74,158,255,.08);border:1px solid rgba(74,158,255,.25);color:var(--blue)">⏳ Submitting…</div>`;
  try{
    const resp=await fetch(WORKER_URL+'/dv/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q)});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const result=await resp.json();
    if(result.id)q.id=result.id;
    S.pending=S.pending.filter(p=>p.id!==q.id);
    S.pending.push(q);
    save();
    lbUpdate();
    toast('📬 Fact submitted! Showing in your library while awaiting review.');
    fbEl.innerHTML=`<div class="qfb" style="background:rgba(124,92,191,.1);border:1px solid rgba(124,92,191,.3);color:var(--purple3)">📬 Submitted! Visible in your library now — an admin must approve it to appear for everyone.</div>`;
    ['a-yr','a-ev','a-sig','a-pe','a-sec','a-no'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
    document.getElementById('live-dup').innerHTML='';
    buildNav();render();
  }catch(e){fbEl.innerHTML=`<div class="qfb qwr">❌ Submission failed — ${e.message}</div>`;}
}

async function deletePendingFact(id){
  if(!confirm('Remove this pending fact from your library?\nIf it hasn\'t been reviewed yet, the submission will also be withdrawn.'))return;
  try{
    await fetch(WORKER_URL+'/dv/reject',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:'',id,pw:''})});
  }catch(e){/* non-fatal */}
  S.pending=S.pending.filter(p=>String(p.id)!==String(id));
  save();lbUpdate();buildNav();toast('🗑 Submission removed');render();
}

function doReset(){if(confirm('Reset ALL progress?')){S.mastered=new Set();S.learning=new Set();S.hidden=new Set();S.xp=0;S.streak=0;S.srsData={};S.quizHistory=[];S.masteryPts={};save();toast('Reset done');render();}}
function doResetMastery(){if(confirm('Reset all mastery points? XP and SRS data kept.')){S.mastered=new Set();S.learning=new Set();S.masteryPts={};save();toast('Mastery reset');render();}}
function exportJSON(){
  const d={canonical:DB,custom:S.custom,mastered:[...S.mastered],learning:[...S.learning],xp:S.xp,streak:S.streak,srsData:S.srsData,quizHistory:S.quizHistory};
  const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='DateVault-backup.json';a.click();
}
function importJSON(evt){
  const f=evt.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{
    const d=JSON.parse(e.target.result);
    if(d.custom)S.custom=[...S.custom,...d.custom];
    if(d.mastered)d.mastered.forEach(id=>S.mastered.add(id));
    if(d.learning)d.learning.forEach(id=>S.learning.add(id));
    if(d.xp)S.xp+=d.xp;
    if(d.srsData)Object.assign(S.srsData,d.srsData);
    if(d.quizHistory)S.quizHistory.push(...d.quizHistory);
    save();updateSB();toast('Import successful!');render();
  }catch(e){toast('Import failed — invalid JSON');}};
  r.readAsText(f);
}

function exportCSV(){
  const qs=allQ();
  const h='Year,Event,Significance,Topic,Period,Section,Category,Stars\n';
  const rows=qs.map(q=>[
    `"${(q.year||'').replace(/"/g,'""')}"`,
    `"${(q.event||'').replace(/"/g,'""')}"`,
    `"${(q.significance||'').replace(/"/g,'""')}"`,
    q.topic||'',q.period||'',q.section||'',q.category||'',q.stars||''
  ].join(',')).join('\n');
  const b=new Blob([h+rows],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='DateVault-dates.csv';a.click();
}

async function adminApprove(idx){
  const q={..._adminPending[idx]};if(!q)return;
  try{
    const resp=await fetch(WORKER_URL+'/dv/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:_adminToken,id:q.id})});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
  }catch(e){toast('⚠ Worker error: '+e.message,3500);return;}
  delete q.submittedAt;delete q._submittedByMe;delete q._status;delete q._userSubmitted;
  // Move from pending → custom (dedup)
  S.pending=S.pending.filter(p=>p.id!==q.id);
  if(!S.custom.find(c=>String(c.id)===String(q.id)))S.custom.push(q);
  addXP(5);save();
  _adminPending.splice(idx,1);buildNav();toast('✅ Fact approved! +5 XP');render();
}
async function adminReject(idx){
  const q=_adminPending[idx];if(!q)return;
  try{
    const resp=await fetch(WORKER_URL+'/dv/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:_adminToken,id:q.id})});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
  }catch(e){toast('⚠ Worker error: '+e.message,3500);return;}
  _adminPending.splice(idx,1);
  toast('❌ Fact rejected — submitter will be notified on next load');render();
}
async function adminDeleteApproved(idx){
  const q=S.custom[idx];if(!q)return;
  if(!confirm(`Delete "${q.event||q.year}"?`))return;
  if(q.id){
    try{await fetch(WORKER_URL+'/dv/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:_adminToken,id:q.id})});}
    catch(e){/*non-fatal*/}
  }
  S.custom.splice(idx,1);save();toast('🗑 Fact deleted');render();
}

async function loadCloudFacts(){
  try{
    const resp=await fetch(WORKER_URL+'/dv/quotes');if(!resp.ok)return;
    const data=await resp.json();
    if(Array.isArray(data.items)){
      const existingIds=new Set([...DB,...S.custom,...S.pending].map(q=>String(q.id)));
      const newFacts=data.items.filter(f=>f.yearNum!==undefined&&!existingIds.has(String(f.id)));
      // Move newly approved pending items to custom
      const approvedFromPending=[];
      S.pending=S.pending.filter(p=>{
        const cloudVersion=data.items.find(ci=>String(ci.id)===String(p.id));
        if(cloudVersion){approvedFromPending.push({...cloudVersion});return false;}
        return true;
      });
      if(approvedFromPending.length>0){
        const customIds=new Set(S.custom.map(q=>String(q.id)));
        approvedFromPending.forEach(q=>{if(!customIds.has(String(q.id)))S.custom.push(q);});
        toast(`✅ ${approvedFromPending.length} of your submitted fact${approvedFromPending.length===1?'':'s'} got approved!`,4000);
      }
      if(newFacts.length>0){S.custom=[...S.custom,...newFacts];}
      if(newFacts.length>0||approvedFromPending.length>0){save();render();}
    }
  }catch(e){console.log(e);}
}

  if(!S.custom.find(c=>String(c.id)===String(q.id)))S.custom.push(q);

  <div class="g2">
    <div class="fg"><label>Topic</label><input type="text" id="${pfx}-to" value="${q.topic||''}"></div>
    <div class="fg"><label>Period</label><input type="text" id="${pfx}-pe" value="${q.period||''}"></div>
  </div>
  <div class="g2">
    <div class="fg"><label>Section</label><input type="text" id="${pfx}-sec" value="${q.section||''}"></div>
    <div class="fg"><label>Category</label><input type="text" id="${pfx}-cat" value="${q.category||''}"></div>
  </div>
  <div class="fg"><label>Stars (1-5)</label>
    <select id="${pfx}-st">${[1,2,3,4,5].map(n=>`<option${q.stars===n?' selected':''}>${n}</option>`).join('')}</select>
  </div>
  <div class="fg"><label>Note (optional)</label><input type="text" id="${pfx}-no" value="${q.note||''}"></div>`;
}
function _dvReadFields(pfx){
  const g=id=>document.getElementById(id)?.value||'';
  return{year:g(`${pfx}-yr`).trim(),event:g(`${pfx}-ev`).trim(),significance:g(`${pfx}-sig`).trim(),topic:g(`${pfx}-to`).trim(),period:g(`${pfx}-pe`).trim(),section:g(`${pfx}-sec`).trim(),category:g(`${pfx}-cat`).trim(),stars:+g(`${pfx}-st`),note:g(`${pfx}-no`).trim(),yearNum:parseInt((g(`${pfx}-yr`).match(/\d+/)||[])[0])||0};
}

// ════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════
initTheme();buildNav();updateSB();render();
loadCloudFacts();
// Sync progress from worker if user has a key (multi-device support)
if(getUserKey())syncFromWorker();


// ── Global keyboard shortcuts ─────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  const tag = document.activeElement && document.activeElement.tagName;
  const inInput = (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT');
  const page = S.page;

  // Escape / Backspace = go back (not in inputs)
  if (e.key === 'Escape' && page !== 'dashboard') {
    if (page === 'timed' && S.tc && S.tc.active) {
      e.preventDefault(); if(S.tc.timer)clearInterval(S.tc.timer); S.tc.active=false; render(); return;
    }
    if (!inInput) { e.preventDefault(); goBack(); return; }
  }
  if (e.key === 'Backspace' && !inInput && page !== 'dashboard') {
    e.preventDefault(); goBack(); return;
  }

  if (page === 'srs') {
    if (!S.srs_show) {
      if (e.key === ' ') { e.preventDefault(); S.srs_show=true; render(); }
    } else {
      const q = S.srs_q;
      if (!q) return;
      if (e.key === '1') rateSRS(q.id, 1);
      else if (e.key === '2') rateSRS(q.id, 2);
      else if (e.key === '3') rateSRS(q.id, 3);
      else if (e.key === '4') rateSRS(q.id, 4);
      else if (e.key === '5') rateSRS(q.id, 5);
    }
  }

  if (page === 'flashcards') {
    if (!S.fc.flipped) {
      if (e.key === ' ') { e.preventDefault(); S.fc.flipped=true; render(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); S.fc.idx++; S.fc.flipped=false; render(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); S.fc.idx=Math.max(0,S.fc.idx-1); S.fc.flipped=false; render(); }
    } else {
      const pool=(S.fc.topic==='All'?allQ():allQ().filter(q=>q.topic===S.fc.topic));
      const q=pool[S.fc.idx%pool.length];
      if (e.key === ' ') { e.preventDefault(); S.fc.flipped=false; render(); }
      else if (q && e.key === '1') rateFC(q.id, 0);
      else if (q && e.key === '2') rateFC(q.id, 1);
      else if (q && e.key === '3') rateFC(q.id, 2);
      else if (q && e.key === '4') rateFC(q.id, 3);
      else if (q && e.key === '5') rateFC(q.id, 4);
      else if (e.key === 'ArrowRight') { e.preventDefault(); S.fc.idx++; S.fc.flipped=false; render(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); S.fc.idx=Math.max(0,S.fc.idx-1); S.fc.flipped=false; render(); }
    }
  }

  if (page === 'quiz') {
    if (e.key === 'Enter' && !inInput) {
      e.preventDefault();
      if (S.quiz.active && !S.quiz.checked) submitQ();
      else if (S.quiz.checked) { S.quiz.idx++; S.quiz.checked=false; S.quiz.ans=''; render(); }
    }
  }

  if (page === 'timed') {
    if (e.key === 'Escape' && S.tc && S.tc.active) {
      e.preventDefault(); if(S.tc.timer)clearInterval(S.tc.timer); S.tc.active=false; render();
    }
  }
});

// Sync theme instantly when changed in another tab/vault
window.addEventListener('storage',e=>{
  if(e.key==='vt_theme'&&e.newValue){
    applyTheme(e.newValue);
    if(S&&S.settings){S.settings.theme=e.newValue;save();}
  }
});
</script>
