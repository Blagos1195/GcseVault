<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>DateVault – GCSE History</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:13px;height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
:root{
  --bg:#0b0a14;--bg2:#12111f;--bg3:#1a192b;--bg4:#22203a;--bg5:#2a2840;
  --card:#161526;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--border3:rgba(255,255,255,0.22);
  --text:#dddaf0;--text2:#9a98b5;--text3:#5a587a;
  --gold:#e8c547;--gold2:#f5d76e;--gold3:#a88a20;
  --purple:#7c5cbf;--purple2:#9b7ee0;--purple3:#c4aaff;
  --teal:#2cb67d;--teal2:#3de09a;
  --coral:#e85d4a;--coral2:#ff7b6b;
  --blue:#4a9eff;--pink:#d4549a;
  --amber:#f5a623;--green:#3ecf8e;--red:#ff4d4d;
  --sidebar:196px;
}
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;z-index:200;flex-shrink:0;transition:transform .2s}
#sidebar::-webkit-scrollbar{width:3px}
#sidebar::-webkit-scrollbar-thumb{background:var(--border2)}
.sb-logo{padding:12px 12px 10px;border-bottom:1px solid var(--border)}
.sb-logo-main{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--gold);font-weight:600;display:flex;align-items:center;gap:6px}
.sb-logo-sub{font-size:.6rem;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.sb-sec{font-size:.58rem;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;padding:10px 12px 3px}
.ni{display:flex;align-items:center;gap:7px;padding:6px 8px;cursor:pointer;border-radius:6px;margin:1px 5px;font-size:.78rem;color:var(--text2);transition:all .1s;user-select:none;white-space:nowrap}
.ni:hover{background:var(--bg3);color:var(--text)}
.ni.active{background:rgba(124,92,191,.28);color:var(--purple3);font-weight:500}
.ni-icon{font-size:.85rem;width:16px;text-align:center;flex-shrink:0}
.sb-foot{margin-top:auto;padding:8px 10px;border-top:1px solid var(--border);font-size:.68rem;color:var(--text3)}
.sb-xp{color:var(--gold);margin-top:2px;font-size:.72rem}
.sb-due{color:var(--coral);margin-top:2px;font-size:.7rem}
.sb-link{display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:.75rem;color:var(--blue);text-decoration:none;border-top:1px solid var(--border);transition:background .1s}
.sb-link:hover{background:var(--bg3);color:var(--blue)}
#main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}
#topbar{height:44px;min-height:44px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 14px;flex-shrink:0}
.tb-title{font-family:'Playfair Display',serif;font-size:1rem;color:var(--gold);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#page{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;padding-bottom:60px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#page::-webkit-scrollbar{width:4px}
#page::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
#hbg{display:none;background:none;border:none;color:var(--text);font-size:1.1rem;cursor:pointer;padding:4px}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150}
@media(max-width:620px){#hbg{display:block}#sidebar{position:fixed;left:0;top:0;transform:translateX(-100%)}#sidebar.open{transform:translateX(0)}#page{padding-bottom:120px;-webkit-overflow-scrolling:touch}#app{height:100dvh}}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:520px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.scard{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.snum{font-size:1.5rem;font-weight:600;line-height:1.1}
.slbl{font-size:.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.tag{display:inline-block;font-size:.62rem;padding:1px 7px;border-radius:20px;font-weight:500;line-height:1.5}
.tp{background:rgba(124,92,191,.2);color:var(--purple3)}
.tt{background:rgba(44,182,125,.14);color:var(--teal2)}
.tc-tag{background:rgba(232,93,74,.14);color:var(--coral2)}
.tg{background:rgba(232,197,71,.14);color:var(--gold)}
.tb{background:rgba(74,158,255,.14);color:var(--blue)}
.tk{background:rgba(212,84,154,.14);color:var(--pink)}
.bm{background:rgba(44,182,125,.14);color:var(--teal2);font-size:.62rem;padding:1px 7px;border-radius:20px}
.bl{background:rgba(232,197,71,.14);color:var(--gold);font-size:.62rem;padding:1px 7px;border-radius:20px}
.bn{background:rgba(74,158,255,.1);color:var(--blue);font-size:.62rem;padding:1px 7px;border-radius:20px}
.bd{background:rgba(245,166,35,.2);color:var(--amber);font-size:.62rem;padding:1px 7px;border-radius:20px}
.stars{color:var(--gold);font-size:.72rem}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;font-size:.78rem;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text);transition:all .1s}
.btn:hover{background:var(--bg3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bp{background:var(--purple);border-color:var(--purple);color:#fff}.bp:hover{background:var(--purple2)}
.bg{background:var(--gold);border-color:var(--gold);color:#0b0a14;font-weight:600}.bg:hover{background:var(--gold2)}
.br{background:rgba(232,93,74,.15);border-color:var(--coral);color:var(--coral2)}.br:hover{background:rgba(232,93,74,.25)}
.bsm{padding:3px 9px;font-size:.72rem}
.bblk{width:100%;justify-content:center}
.pb{width:100%;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin:3px 0 7px}
.pbf{height:100%;border-radius:3px;background:var(--teal);transition:width .3s}
.pbf.pu{background:var(--purple2)}.pbf.pg{background:var(--gold)}.pbf.pr{background:var(--coral)}
.fg{margin-bottom:10px}
.fg label{font-size:.72rem;color:var(--text2);display:block;margin-bottom:3px}
input[type=text],input[type=number],select,textarea{font-family:'DM Sans',sans-serif;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:7px;padding:7px 10px;font-size:.8rem;width:100%;transition:border-color .1s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple)}
textarea{resize:vertical;line-height:1.5}
select option{background:var(--bg3)}
.fbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px}
.fbtn{padding:3px 9px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.7rem;cursor:pointer;transition:all .1s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.fbtn:hover,.fbtn.active{background:var(--purple);border-color:var(--purple);color:#fff}
.dc{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:10px 13px;margin-bottom:7px;transition:border-color .12s}
.dc:hover{border-color:var(--border2)}
.dc-date{font-family:'DM Mono',monospace;font-size:.95rem;color:var(--gold);margin-bottom:3px;font-weight:500}
.dc-event{font-size:.88rem;line-height:1.5;margin-bottom:4px;color:var(--text)}
.dc-sig{font-size:.72rem;color:var(--text2);line-height:1.5;margin-bottom:5px}
.dc-m{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:.65rem;color:var(--text3)}
.dc-note{margin-top:5px;font-size:.68rem;color:var(--amber);background:rgba(245,166,35,.07);padding:3px 8px;border-radius:5px;border-left:2px solid var(--amber)}
.fc-wrap{max-width:540px;margin:0 auto}
.fc{height:180px;position:relative;cursor:pointer;border-radius:14px}
.fc-s{border-radius:14px;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;display:flex;width:100%;position:absolute;top:0;left:0;right:0;bottom:0}
.fc-front{background:var(--bg3);border:1px solid var(--border2);visibility:visible;opacity:1;pointer-events:auto;z-index:2}
.fc-back{background:linear-gradient(135deg,rgba(124,92,191,.2),rgba(44,182,125,.1));border:1px solid var(--purple);visibility:hidden;opacity:0;pointer-events:none;z-index:1}
.fc.flip .fc-front{visibility:hidden;opacity:0;pointer-events:none;z-index:1}
.fc.flip .fc-back{visibility:visible;opacity:1;pointer-events:auto;z-index:2}
.fc-lbl{font-size:.62rem;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.fc-main{font-family:'DM Mono',monospace;font-size:1.05rem;line-height:1.65;color:var(--gold)}
.fc-sub{font-size:.72rem;color:var(--text2);margin-top:7px;line-height:1.5}
.fc-hint{font-size:.65rem;color:var(--text3);margin-top:8px}
.qq{font-family:'DM Sans',sans-serif;font-size:.98rem;line-height:1.65;background:var(--bg3);border:1px solid var(--border2);border-radius:9px;padding:13px 15px;margin-bottom:10px}
.qfb{border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.78rem;line-height:1.5}
.qok{background:rgba(44,182,125,.12);border:1px solid rgba(44,182,125,.28);color:var(--text)}
.qwr{background:rgba(232,93,74,.12);border:1px solid rgba(232,93,74,.28);color:var(--text)}
.hint{font-size:.7rem;color:var(--text3);margin-top:4px;font-style:italic}
.dr{border-radius:7px;padding:7px 10px;margin-bottom:5px;font-size:.8rem;line-height:1.5}
.dr-ok{background:rgba(44,182,125,.1);border:1px solid rgba(44,182,125,.22);color:var(--text)}
.dr-near{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.22);color:var(--text)}
.dr-miss{background:rgba(232,93,74,.1);border:1px solid rgba(232,93,74,.22);color:var(--text2)}
.bback{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text2);font-size:.75rem;cursor:pointer;margin-bottom:11px;transition:all .1s;font-family:'DM Sans',sans-serif}
.bback:hover{background:var(--bg4);color:var(--text)}
.pt{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--gold);margin-bottom:2px}
.ps{font-size:.72rem;color:var(--text3);margin-bottom:11px}
.sec{font-size:.68rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;margin-top:13px}
.div{height:1px;background:var(--border);margin:11px 0}
#toast{position:fixed;bottom:14px;right:14px;background:var(--bg3);border:1px solid var(--teal);color:var(--teal2);padding:7px 13px;border-radius:9px;font-size:.78rem;z-index:9999;transform:translateX(130px);opacity:0;transition:all .22s;pointer-events:none;max-width:260px}
#toast.show{transform:translateX(0);opacity:1}
#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;align-items:center;justify-content:center}
#modal-bg.open{display:flex}
#modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:18px;max-width:480px;width:92%;max-height:80vh;overflow-y:auto}
#modal::-webkit-scrollbar{width:3px}
#modal::-webkit-scrollbar-thumb{background:var(--border2)}
.srow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:none}
.ach{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:9px}
.ach.locked{opacity:.3;filter:grayscale(1)}
.ach-i{font-size:1.5rem}
.ach-n{font-size:.78rem;font-weight:600;color:var(--gold)}
.ach-d{font-size:.68rem;color:var(--text3)}
.hm-grid{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.hm-cell{width:12px;height:12px;border-radius:2px;background:var(--bg4);transition:background .2s;cursor:default;flex-shrink:0}
/* ── TIMELINE ── */
#tl-outer{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:10px;background:var(--bg3);margin-bottom:10px;touch-action:none;user-select:none}
#tl-canvas-wrap{overflow:hidden;width:100%;cursor:grab;touch-action:none;user-select:none}
#tl-canvas-wrap:active{cursor:grabbing}
#tl-canvas-wrap canvas{display:block;width:100%}
.tl-zoom-bar{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--bg2);border-bottom:1px solid var(--border)}
.tl-zoom-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:5px;padding:2px 9px;font-size:.75rem;cursor:pointer;font-family:'DM Sans',sans-serif}
.tl-zoom-btn:hover{background:var(--bg4)}
.tl-zoom-label{font-size:.65rem;color:var(--text3);flex:1}
.tl-detail-box{margin-top:0;padding:10px 14px;background:var(--card);border-top:1px solid var(--border);min-height:44px;font-size:.78rem}
/* drag-and-drop timeline */
.tl-bank{display:flex;flex-wrap:wrap;gap:7px;padding:10px;background:var(--bg2);border-radius:8px;min-height:60px;border:1px solid var(--border)}
.tl-bank.drag-over{border-color:var(--purple2);background:rgba(124,92,191,.06)}
/* SRS info box */
.srs-info{background:rgba(124,92,191,.08);border:1px solid rgba(124,92,191,.25);border-radius:9px;padding:10px 13px;margin-bottom:12px;font-size:.75rem;line-height:1.6;color:var(--text2)}
.srs-info strong{color:var(--purple3)}
/* Difficulty badge */
.diff-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:.65rem;font-weight:600}
.diff-easy{background:rgba(44,182,125,.15);color:var(--teal2);border:1px solid rgba(44,182,125,.3)}
.diff-med{background:rgba(232,197,71,.15);color:var(--gold);border:1px solid rgba(232,197,71,.3)}
.diff-hard{background:rgba(232,93,74,.15);color:var(--coral2);border:1px solid rgba(232,93,74,.3)}
/* Multi-select dropdown (filter panel) */
.flt-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.msd-wrap{position:relative;display:inline-block;min-width:150px;flex:1}
.msd-trigger{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;padding:7px 30px 7px 10px;font-size:.78rem;color:var(--text);cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .15s}
.msd-trigger:after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--text3);transition:transform .15s}
.msd-wrap.open .msd-trigger:after{transform:translateY(-50%) rotate(180deg)}
.msd-wrap.open .msd-trigger{border-color:var(--border3)}
.msd-dropdown{display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:100%;max-height:220px;overflow-y:auto;background:var(--bg3);border:1px solid var(--border2);border-radius:9px;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.45);padding:4px}
.msd-wrap.open .msd-dropdown{display:block}
.msd-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:.78rem;color:var(--text2);transition:background .1s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.msd-item:hover{background:var(--bg4);color:var(--text)}
.msd-item.sel{color:var(--text)}
.msd-check{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border2);background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.65rem;transition:all .1s}
.msd-item.sel .msd-check{background:var(--purple);border-color:var(--purple);color:#fff}
.msd-item.sel-cat .msd-check{background:var(--teal);border-color:var(--teal);color:#0b0a14}
.tog{width:34px;height:19px;background:var(--bg4);border-radius:19px;cursor:pointer;position:relative;transition:background .18s;border:1px solid var(--border2);flex-shrink:0}
.tog.on{background:var(--purple)}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;background:#fff;border-radius:50%;transition:transform .18s}
.tog.on::after{transform:translateX(15px)}
.sm2-badge{font-family:'DM Mono',monospace;font-size:.6rem;padding:1px 6px;border-radius:4px;background:var(--bg4);color:var(--text3)}
</style>
</head>
<body>
<div id="overlay" onclick="closeSB()"></div>
<div id="modal-bg" onclick="if(event.target===this)closeModal()"><div id="modal"></div></div>

<div id="app">
<div id="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-main">🏛 DateVault</div>
    <div class="sb-logo-sub">GCSE History · Edexcel</div>
  </div>
  <nav id="nav"></nav>
  <a class="sb-link" href="https://blagos1195.github.io/Gcse-QuoteVault/" target="_blank">📚 Switch to QuoteVault</a>
  <div class="sb-foot">
    <div>⚡ <span id="sb-xp">0</span> XP · Lv <span id="sb-lv">1</span></div>
    <div class="sb-xp">🔥 <span id="sb-str">0</span> day streak</div>
    <div class="sb-due" id="sb-due"></div>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <button id="hbg" onclick="toggleSB()">☰</button>
    <span class="tb-title" id="tb-title">Dashboard</span>
    <button class="btn bsm" onclick="exportJSON()" title="Export">⬇</button>
    <label class="btn bsm" title="Import" style="cursor:pointer">⬆<input type="file" accept=".json" style="display:none" onchange="importJSON(event)"></label>
  </div>
  <div id="page"></div>
</div>
</div>
<div id="toast"></div>

<script>
const WORKER_URL = "https://quotevault-api.noah-l-barker.workers.dev";

// ════════════════════════════════════════════════
// COLOUR THEMES
// ════════════════════════════════════════════════
// ── built-in themes (keep 'default' key — it is referenced elsewhere) ──
const THEMES = {
  'default': {
    label:'Vault', desc:'The original dark-purple theme',
    '--bg':'#0b0a14','--bg2':'#12111f','--bg3':'#1a192b','--bg4':'#22203a','--bg5':'#2a2840',
    '--card':'#161526','--border':'rgba(255,255,255,0.07)','--border2':'rgba(255,255,255,0.13)','--border3':'rgba(255,255,255,0.22)',
    '--text':'#dddaf0','--text2':'#9a98b5','--text3':'#5a587a',
    '--gold':'#e8c547','--gold2':'#f5d76e','--gold3':'#a88a20',
    '--purple':'#7c5cbf','--purple2':'#9b7ee0','--purple3':'#c4aaff',
    '--teal':'#2cb67d','--teal2':'#3de09a',
    '--coral':'#e85d4a','--coral2':'#ff7b6b',
    '--blue':'#4a9eff','--pink':'#d4549a','--amber':'#f5a623','--green':'#3ecf8e','--red':'#ff4d4d',
  },
  'midnight': {
    label:'Midnight', desc:'Deep navy with indigo accents',
    '--bg':'#080c14','--bg2':'#0e1220','--bg3':'#141a2c','--bg4':'#1c2438','--bg5':'#242e46',
    '--card':'#0e1220','--border':'rgba(99,132,255,0.09)','--border2':'rgba(99,132,255,0.16)','--border3':'rgba(99,132,255,0.26)',
    '--text':'#e4eaf8','--text2':'#8899cc','--text3':'#3d4d78',
    '--gold':'#f0c060','--gold2':'#f8d880','--gold3':'#a07820',
    '--purple':'#6366f1','--purple2':'#818cf8','--purple3':'#c7d2fe',
    '--teal':'#06b6d4','--teal2':'#22d3ee',
    '--coral':'#f43f5e','--coral2':'#fb7185',
    '--blue':'#60a5fa','--pink':'#e879f9','--amber':'#fbbf24','--green':'#34d399','--red':'#f87171',
  },
  'forest': {

// ── custom themes: stored in localStorage ──
function getCustomThemes(){
  try{return JSON.parse(localStorage.getItem('dv_custom_themes')||'{}');}catch{return {};}
}
function saveCustomThemes(obj){
  localStorage.setItem('dv_custom_themes',JSON.stringify(obj));
}
function getAllThemes(){
  return {...THEMES,...getCustomThemes()};
}

function applyTheme(key){
  const all=getAllThemes();
  const t=all[key]||THEMES['default'];
  const root=document.documentElement.style;
  Object.entries(t).forEach(([k,v])=>{if(k.startsWith('--'))root.setProperty(k,v);});
  // Save to shared cross-app key so both Vault apps stay in sync
  localStorage.setItem('vt_theme',key);
  if(S&&S.settings){S.settings.theme=key;save();}
  // Push theme to worker for cross-device sync (fire and forget)
  const uk=getUserKey();
  if(uk){
    fetch(WORKER_URL+'/lb/update-theme',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({userKey:uk,theme:key})}).catch(()=>{});
  }
}

function initTheme(){
  // Prefer shared key, fall back to per-app settings, then default
  const k=localStorage.getItem('vt_theme')||(S&&S.settings&&S.settings.theme)||'default';
  const all=getAllThemes();
  const t=all[k]||THEMES['default'];
  const root=document.documentElement.style;
  Object.entries(t).forEach(([k2,v])=>{if(k2.startsWith('--'))root.setProperty(k2,v);});
  if(S&&S.settings)S.settings.theme=k;
}

// ── custom theme builder ──
function openThemeBuilder(editKey){
  const all=getAllThemes();
  const base=editKey?all[editKey]:THEMES['default'];
  const isNew=!editKey||!getCustomThemes()[editKey];
  const title=isNew?'Create Custom Theme':'Edit Theme';
  // colour pickers for key vars
  const picks=[
    ['Background','--bg'],['Surface','--bg2'],['Card','--card'],
    ['Text','--text'],['Muted text','--text2'],
    ['Accent (gold)','--gold'],['Primary (purple)','--purple'],['Purple light','--purple2'],
    ['Teal','--teal'],['Coral','--coral'],['Blue','--blue'],
  ];
  const rows=picks.map(([lbl,v])=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:.78rem;color:var(--text2)">${lbl}</span>
      <input type="color" id="tc-${v.replace(/-/g,'_')}" value="${base[v]||'#000000'}"
        style="width:40px;height:26px;border:none;border-radius:5px;cursor:pointer;background:none;padding:0">
    </div>`).join('');
  openModal(`<div>
    <div style="font-family:'Playfair Display',serif;font-size:1rem;color:var(--gold);margin-bottom:10px">🎨 ${title}</div>
    <div class="fg"><label>Theme name</label>
      <input type="text" id="tc-name" placeholder="My theme" value="${editKey&&isNew===false?all[editKey].label||editKey:''}">
    </div>
    <div class="fg"><label>Description (optional)</label>
      <input type="text" id="tc-desc" placeholder="A short description" value="${editKey?all[editKey].desc||'':''}">
    </div>
    <div style="margin:8px 0 4px;font-size:.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em">Colours</div>
    <div style="max-height:300px;overflow-y:auto;padding-right:4px">${rows}</div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="btn bp" onclick="saveCustomTheme('${editKey||''}')">💾 Save & Apply</button>
      ${editKey&&!isNew?`<button class="btn br" onclick="deleteCustomTheme('${editKey}')">🗑 Delete</button>`:''}
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
  </div>`);
}

function saveCustomTheme(editKey){
  const name=document.getElementById('tc-name')?.value.trim()||'My Theme';
  const desc=document.getElementById('tc-desc')?.value.trim()||'';
  const key=editKey||(name.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+Date.now());
  const picks=[
    ['--bg'],['--bg2'],['--card'],['--text'],['--text2'],
    ['--gold'],['--purple'],['--purple2'],['--teal'],['--coral'],['--blue'],
  ];
  const base=getAllThemes()[editKey]||THEMES['default'];
  const t={...base,label:name,desc};
  picks.forEach(([v])=>{
    const el=document.getElementById('tc-'+v.replace(/-/g,'_'));
    if(el)t[v]=el.value;
  });
  // auto-derive the secondary/tertiary vars from the primaries
  t['--bg3']=lighten(t['--bg'],10);t['--bg4']=lighten(t['--bg'],18);t['--bg5']=lighten(t['--bg'],26);
  t['--text3']=lighten(t['--text2'],-30);
  t['--gold2']=lighten(t['--gold'],15);t['--gold3']=lighten(t['--gold'],-20);
  t['--teal2']=lighten(t['--teal'],18);
  t['--coral2']=lighten(t['--coral'],15);
  const ct=getCustomThemes();ct[key]=t;saveCustomThemes(ct);
  closeModal();applyTheme(key);render();toast('🎨 Theme saved & applied!');
}

function deleteCustomTheme(key){
  if(!confirm('Delete this custom theme?'))return;
  const ct=getCustomThemes();delete ct[key];saveCustomThemes(ct);
  if(S.settings?.theme===key){applyTheme('default');}
  closeModal();render();toast('Theme deleted');
}

function lighten(hex,amt){
  try{
    let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    r=Math.max(0,Math.min(255,r+amt));g=Math.max(0,Math.min(255,g+amt));b=Math.max(0,Math.min(255,b+amt));
    return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
  }catch{return hex;}
}

// S.flt holds the multi-select filter state for the library
// We initialise it lazily so it doesn't break the existing simple S.tf/pf/sf
function initFlt(){
  if(!S.flt)S.flt={topics:new Set(['All']),periods:new Set(['All']),categories:new Set(['All']),search:''};
}

function toggleFltTopic(v){
  initFlt();const s=S.flt.topics;
  if(v==='All'){s.clear();s.add('All');}
  else{s.delete('All');s.has(v)?s.delete(v):s.add(v);if(!s.size)s.add('All');}
  S.flt.periods=new Set(['All']);
  const wasOpen=document.getElementById('msd-topic')?.classList.contains('open');
  render();
  if(wasOpen){const el=document.getElementById('msd-topic');if(el)el.classList.add('open');}
}
function toggleFltPeriod(v){
  initFlt();const s=S.flt.periods;
  if(v==='All'){s.clear();s.add('All');}
  else{s.delete('All');s.has(v)?s.delete(v):s.add(v);if(!s.size)s.add('All');}
  const wasOpen=document.getElementById('msd-period')?.classList.contains('open');
  render();
  if(wasOpen){const el=document.getElementById('msd-period');if(el)el.classList.add('open');}
}
function toggleFltCat(v){
  initFlt();const s=S.flt.categories;
  if(v==='All'){s.clear();s.add('All');}
  else{s.delete('All');s.has(v)?s.delete(v):s.add(v);if(!s.size)s.add('All');}
  const wasOpen=document.getElementById('msd-cat')?.classList.contains('open');
  render();
  if(wasOpen){const el=document.getElementById('msd-cat');if(el)el.classList.add('open');}
}
function clearLibFlt(){S.flt={topics:new Set(['All']),periods:new Set(['All']),categories:new Set(['All']),search:''};render();}

function toggleMsd(id){
  const el=document.getElementById(id);if(!el)return;
  const isOpen=el.classList.contains('open');
  document.querySelectorAll('.msd-wrap.open').forEach(e=>e.classList.remove('open'));
  if(!isOpen)el.classList.add('open');
}
document.addEventListener('click',()=>{
  document.querySelectorAll('.msd-wrap.open').forEach(e=>e.classList.remove('open'));
});

function truncateLabels(items,max=2){
  if(!items.length)return'All';
  if(items.length<=max)return items.join(', ');
  return`${items.slice(0,max).join(', ')} <span style="color:var(--text3)">+${items.length-max} more</span>`;
}

function applyLibFilters(pool){
  initFlt();
  let out=pool;
  const ts=S.flt.topics;
  const ps=S.flt.periods;
  const cs=S.flt.categories;
  const sr=(S.flt.search||'').toLowerCase().trim();
  if(!ts.has('All'))out=out.filter(q=>ts.has(q.topic));
  if(!ps.has('All'))out=out.filter(q=>ps.has(q.period));
  if(!cs.has('All'))out=out.filter(q=>cs.has(q.category));
  if(sr)out=out.filter(q=>
    (q.event||'').toLowerCase().includes(sr)||
    (q.year||'').toLowerCase().includes(sr)||
    (q.significance||'').toLowerCase().includes(sr)||
    (q.section||'').toLowerCase().includes(sr)||
    (q.topic||'').toLowerCase().includes(sr)||
    (q.period||'').toLowerCase().includes(sr)
  );
  return out;
}

function renderLibFilters(){
  initFlt();
  const qs=allQincHidden();
  const allTopics=['All',...new Set(qs.map(q=>q.topic))];
  const topicPool=S.flt.topics.has('All')?qs:qs.filter(q=>S.flt.topics.has(q.topic));
  const allPeriods=['All',...new Set(topicPool.map(q=>q.period))].sort((a,b)=>a==='All'?-1:b==='All'?1:a.localeCompare(b));
  const allCats=['All',...new Set(qs.map(q=>q.category).filter(Boolean))].sort((a,b)=>a==='All'?-1:b==='All'?1:a.localeCompare(b));

  const activeTp=[...S.flt.topics].filter(v=>v!=='All');
  const activePe=[...S.flt.periods].filter(v=>v!=='All');
  const activeCa=[...S.flt.categories].filter(v=>v!=='All');
  const activeCount=activeTp.length+activePe.length+activeCa.length+(S.flt.search?1:0);

  const tpLabel=activeTp.length?truncateLabels(activeTp):'All topics';
  const peLabel=activePe.length?truncateLabels(activePe):'All periods';
  const caLabel=activeCa.length?truncateLabels(activeCa):'All categories';

  const msdItems=(list,activeSet,fn,selCls)=>list.map(v=>{
    const sel=activeSet.has(v);
    const enc=encodeURIComponent(v);
    return`<div class="msd-item${sel?` sel ${selCls}`:''}" onclick="${fn}(decodeURIComponent('${enc}'));event.stopPropagation()">
      <div class="msd-check">${sel?'✓':''}</div><span>${v}</span>
    </div>`;
  }).join('');

  return`<div style="margin-bottom:10px">
  <input type="text" placeholder="Search dates, events, significance…" value="${(S.flt.search||'').replace(/"/g,'&quot;')}"
    oninput="S.flt.search=this.value;render()" style="margin-bottom:8px">
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">
    <div style="flex-shrink:0">
      <div style="font-size:.6rem;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.08em">Topic</div>
      <div class="msd-wrap" id="msd-topic">
        <button class="msd-trigger" style="${activeTp.length?'border-color:var(--purple);color:var(--text)':''}"
          onclick="toggleMsd('msd-topic');event.stopPropagation()">${tpLabel}${activeTp.length?` <span style="background:var(--purple);color:#fff;border-radius:10px;padding:0 5px;font-size:.65rem;margin-left:4px">${activeTp.length}</span>`:''}</button>
        <div class="msd-dropdown">${msdItems(allTopics,S.flt.topics,'toggleFltTopic','')}</div>
      </div>
    </div>
    <div style="flex-shrink:0">
      <div style="font-size:.6rem;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.08em">Period</div>
      <div class="msd-wrap" id="msd-period">
        <button class="msd-trigger" style="${activePe.length?'border-color:var(--teal);color:var(--text)':''}"
          onclick="toggleMsd('msd-period');event.stopPropagation()">${peLabel}${activePe.length?` <span style="background:var(--teal);color:#0b0a14;border-radius:10px;padding:0 5px;font-size:.65rem;margin-left:4px;font-weight:700">${activePe.length}</span>`:''}</button>
        <div class="msd-dropdown">${msdItems(allPeriods,S.flt.periods,'toggleFltPeriod','')}</div>
      </div>
    </div>
    <div style="flex-shrink:0">
      <div style="font-size:.6rem;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.08em">Category</div>
      <div class="msd-wrap" id="msd-cat">
        <button class="msd-trigger" style="${activeCa.length?'border-color:var(--gold);color:var(--text)':''}"
          onclick="toggleMsd('msd-cat');event.stopPropagation()">${caLabel}${activeCa.length?` <span style="background:var(--gold);color:#0b0a14;border-radius:10px;padding:0 5px;font-size:.65rem;margin-left:4px;font-weight:700">${activeCa.length}</span>`:''}</button>
        <div class="msd-dropdown">${msdItems(allCats,S.flt.categories,'toggleFltCat','sel-cat')}</div>
      </div>
    </div>
  </div>
  ${activeCount?`<div style="margin-bottom:4px"><button class="btn bsm" onclick="clearLibFlt()" style="color:var(--coral);border-color:var(--coral)">✕ Clear filters (${activeCount})</button></div>`:''}
  </div>`;
}

{id:"wr001",topic:"Weimar & Nazi Germany",period:"Weimar Republic",era:"1919–1923",yearNum:1918,year:"November 1918",event:"Kaiser Wilhelm II abdicates — Germany surrenders",significance:"Germany's defeat shocked many. The 'stab in the back' myth emerged. Republic born in defeat — lasting hostility to democracy among nationalists.",category:"Political",stars:5,section:"Birth of the Weimar Republic"},
{id:"wr002",topic:"Weimar & Nazi Germany",period:"Weimar Republic",era:"1919–1923",yearNum:1919,year:"January 1919",event:"Spartacist Uprising — communist revolution attempt crushed",significance:"Luxemburg was murdered. Showed the fragility of the new republic and its reliance on anti-democratic forces.",category:"Political",stars:5,section:"Challenges to Weimar"},
{id:"wr003",topic:"Weimar & Nazi Germany",period:"Weimar Republic",era:"1919–1923",yearNum:1919,year:"June 1919",event:"Treaty of Versailles signed",significance:"Germany lost 13% of land. Article 231 'war guilt clause'. Republic blamed for the 'Diktat' — the 'November Criminals' accusation.",category:"Political",stars:5,section:"Birth of the Weimar Republic"},
{id:"wr004",topic:"Weimar & Nazi Germany",period:"Weimar Republic",era:"1919–1923",yearNum:1920,year:"March 1920",event:"Kapp Putsch — right-wing coup attempt in Berlin",significance:"Freikorps seized Berlin for 4 days. Army refused to fire on rebels. Showed the army's lack of loyalty to the republic.",category:"Political",stars:5,section:"Challenges to Weimar"},
{id:"wr005",topic:"Weimar & Nazi Germany",period:"Weimar Republic",era:"1919–1923",yearNum:1921,year:"1921",event:"Reparations set at 132 billion gold marks",significance:"Led directly to hyperinflation when France occupied the Ruhr in 1923.",category:"Economic",stars:5,section:"Weimar's Economic Problems"},
{id:"wr006",topic:"Weimar & Nazi Germany",period:"Weimar Republic",era:"1919–1923",yearNum:1923,year:"1923",event:"Hyperinflation — German mark becomes worthless",significance:"By November 1923 one US dollar = 4.2 trillion marks. Middle classes devastated — this group later turned to Hitler.",category:"Economic",stars:5,section:"Weimar's Economic Problems"},
{id:"wr007",topic:"Weimar & Nazi Germany",period:"Weimar Republic",era:"1919–1923",yearNum:1923,year:"November 1923",event:"Munich Beer Hall Putsch — Hitler's attempted coup fails",significance:"16 Nazis killed by police. Hitler arrested, served 9 months. Wrote Mein Kampf in prison. Used trial as propaganda platform.",category:"Political",stars:5,section:"Challenges to Weimar"},
{id:"wr008",topic:"Weimar & Nazi Germany",period:"Weimar Republic",era:"1924–1929",yearNum:1924,year:"1924",event:"Dawes Plan — US loans stabilise Germany",significance:"800 million marks in US loans. Industrial output exceeded pre-war levels by 1928. Recovery built on fragile foundation.",category:"Economic",stars:5,section:"The Golden Twenties"},
{id:"wr009",topic:"Weimar & Nazi Germany",period:"Weimar Republic",era:"1924–1929",yearNum:1925,year:"1925",event:"Hindenburg elected President of Germany",significance:"Hero of WWI. Later appointed Hitler as Chancellor — one of the most consequential decisions in history.",category:"Political",stars:4,section:"The Golden Twenties"},
{id:"wr010",topic:"Weimar & Nazi Germany",period:"Weimar Republic",era:"1924–1929",yearNum:1928,year:"1928",event:"Nazis win only 12 seats — at their lowest ebb",significance:"NSDAP had only 2.6% of the vote. Without economic catastrophe, Hitler might never have come to power.",category:"Political",stars:5,section:"The Golden Twenties"},
{id:"wr011",topic:"Weimar & Nazi Germany",period:"Weimar Republic",era:"1929–1933",yearNum:1929,year:"October 1929",event:"Wall Street Crash triggers Great Depression",significance:"US banks recalled loans. Six million unemployed by 1932. Direct causal link between economic collapse and Nazi electoral success.",category:"Economic",stars:5,section:"Rise of the Nazis"},
{id:"wr012",topic:"Weimar & Nazi Germany",period:"Weimar Republic",era:"1929–1933",yearNum:1930,year:"September 1930",event:"Nazis win 107 seats — second largest party",significance:"From 12 seats to 107 in two years. Goebbels proved masterful at exploiting the media.",category:"Political",stars:5,section:"Rise of the Nazis"},
{id:"wr013",topic:"Weimar & Nazi Germany",period:"Weimar Republic",era:"1929–1933",yearNum:1932,year:"July 1932",event:"Nazis win 230 seats — largest party but no majority",significance:"Hitler demanded Chancellorship; Hindenburg refused. Nazi vote then fell to 196 seats in November 1932.",category:"Political",stars:4,section:"Rise of the Nazis"},
{id:"wr014",topic:"Weimar & Nazi Germany",period:"Weimar Republic",era:"1929–1933",yearNum:1933,year:"30 January 1933",event:"Hitler appointed Chancellor of Germany",significance:"Von Papen said 'we've hired him'. This colossal misjudgement ended the Weimar Republic. Hitler came to power legally.",category:"Political",stars:5,section:"Rise of the Nazis"},
{id:"ng001",topic:"Weimar & Nazi Germany",period:"Nazi Germany",era:"1933–1945",yearNum:1933.1,year:"February 1933",event:"Reichstag Fire — decree suspending civil liberties",significance:"Suspended freedom of speech, press, and assembly. Mass arrests of communists. Legal basis for Nazi terror.",category:"Political",stars:5,section:"Consolidation of Power"},
{id:"ng002",topic:"Weimar & Nazi Germany",period:"Nazi Germany",era:"1933–1945",yearNum:1933.2,year:"March 1933",event:"Enabling Act — Hitler given power to rule by decree",significance:"Passed with two-thirds majority. The legal end of Weimar democracy. Germany became a one-party state within months.",category:"Political",stars:5,section:"Consolidation of Power"},
{id:"ng003",topic:"Weimar & Nazi Germany",period:"Nazi Germany",era:"1933–1945",yearNum:1933.3,year:"April 1933",event:"Boycott of Jewish businesses begins",significance:"First organised state action against Jews. Set the tone for escalating persecution.",category:"Social",stars:5,section:"Persecution of Jews"},
{id:"ng004",topic:"Weimar & Nazi Germany",period:"Nazi Germany",era:"1933–1945",yearNum:1934,year:"June 1934",event:"Night of the Long Knives — SA leadership murdered",significance:"Hitler ordered murder of SA leader Röhm. Army swore personal oath to Hitler. Complete control secured.",category:"Political",stars:5,section:"Consolidation of Power"},
{id:"ng005",topic:"Weimar & Nazi Germany",period:"Nazi Germany",era:"1933–1945",yearNum:1934.5,year:"August 1934",event:"Death of Hindenburg — Hitler becomes Führer",significance:"Hitler merged Chancellor and President offices. Complete personal dictatorship established.",category:"Political",stars:5,section:"Consolidation of Power"},
{id:"ng006",topic:"Weimar & Nazi Germany",period:"Nazi Germany",era:"1933–1945",yearNum:1935,year:"September 1935",event:"Nuremberg Laws — Jews stripped of citizenship",significance:"Jews could no longer be German citizens. Made antisemitism the law of the land.",category:"Legal",stars:5,section:"Persecution of Jews"},
{id:"ng007",topic:"Weimar & Nazi Germany",period:"Nazi Germany",era:"1933–1945",yearNum:1938,year:"November 1938",event:"Kristallnacht — Night of Broken Glass",significance:"7,500 Jewish businesses smashed, 1,400 synagogues burned, 30,000 sent to concentration camps. Major escalation.",category:"Social",stars:5,section:"Persecution of Jews"},
{id:"ng008",topic:"Weimar & Nazi Germany",period:"Nazi Germany",era:"1933–1945",yearNum:1942,year:"January 1942",event:"Wannsee Conference — Final Solution planned",significance:"15 senior Nazis coordinated systematic murder of all European Jews. 6 million Jews murdered in the Holocaust.",category:"Political",stars:5,section:"Persecution of Jews"},

// ── HENRY VIII & WOLSEY ──────────────────────────────────────────────────
{id:"hw001",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1509,year:"1509",event:"Henry VIII becomes King & marries Catherine of Aragon",significance:"Henry VIII succeeded to the throne aged 17. He married Catherine of Aragon, his late brother Arthur's widow — they had been betrothed since 1503. The marriage would last 24 years before Henry sought an annulment, triggering the English Reformation.",category:"Political",stars:5,section:"Henry VIII, Renaissance Prince"},
{id:"hw002",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1509.5,year:"1509",event:"Wolsey appointed Royal Almoner",significance:"Wolsey was appointed to distribute royal charity to the poor, making him part of the royal council. This was the first step in his remarkable rise from the son of an Ipswich butcher to the most powerful man in England after the king.",category:"Political",stars:4,section:"The Rise of Wolsey and His Policies"},
{id:"hw003",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1513,year:"1513",event:"Battle of Flodden — Catherine of Aragon leads army as regent",significance:"While Henry warred in France, Catherine of Aragon acted as regent and led the English army to victory over Scotland. James IV of Scotland was killed. One of England's greatest military victories — and a rare example of Catherine's political authority.",category:"Military",stars:4,section:"Henry VIII, Renaissance Prince"},
{id:"hw004",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1515,year:"1515",event:"Wolsey appointed Lord Chancellor",significance:"Wolsey became Lord Chancellor, the highest legal and administrative office in England. He now dominated government entirely, handling diplomacy, finance and law — effectively running the country while Henry pursued pleasure and hunting.",category:"Political",stars:5,section:"The Rise of Wolsey and His Policies"},
{id:"hw005",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1515.5,year:"1515",event:"Francis I becomes King of France",significance:"Francis I acceded to the French throne, beginning a long rivalry with both Henry VIII and Charles V. This reshaped European power dynamics and forced England to constantly recalibrate its alliances throughout Wolsey's ministry.",category:"Political",stars:3,section:"The Rise of Wolsey and His Policies"},
{id:"hw006",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1516,year:"1516",event:"Charles I becomes King of Spain",significance:"Charles I of Spain (later Holy Roman Emperor Charles V) became king, making him ruler of Spain, the Netherlands and much of Italy. He was also Catherine of Aragon's nephew — a fact that would prove crucial when Henry sought a divorce.",category:"Political",stars:4,section:"The Rise of Wolsey and His Policies"},
{id:"hw007",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1517,year:"1517",event:"Wolsey's enclosure inquiry — 260 cases brought against landowners",significance:"Wolsey launched an investigation into whether land was being illegally enclosed. 260 cases were brought against landowners. In 1523 angry landowners used parliament to stop the inquiries — an early sign of the limits of Wolsey's power.",category:"Social",stars:3,section:"The Rise of Wolsey and His Policies"},
{id:"hw008",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1518,year:"1518",event:"Treaty of London — 'universal peace' brokered by Wolsey",significance:"Wolsey engineered a peace treaty signed by England, France, the Papacy, Spain and other powers. It was a major diplomatic triumph — Wolsey positioned England as the honest broker of European peace, greatly enhancing his and Henry's prestige.",category:"Political",stars:5,section:"Wolsey's Foreign Policy"},
{id:"hw009",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1518.5,year:"1518",event:"Wolsey appointed papal legate",significance:"Wolsey was appointed permanent papal legate (legatus a latere), giving him authority over the English church that outranked even the Archbishop of Canterbury. This made him the most powerful churchman in England and caused resentment among the clergy.",category:"Religious",stars:4,section:"The Rise of Wolsey and His Policies"},
{id:"hw010",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1519,year:"1519",event:"Charles I of Spain becomes Holy Roman Emperor Charles V",significance:"Charles was elected Holy Roman Emperor, making him ruler of Spain, the Netherlands, Austria, much of Italy and Germany. This vast power created an imbalance in Europe that shaped Wolsey's entire foreign policy for the next decade.",category:"Political",stars:5,section:"The Rise of Wolsey and His Policies"},
{id:"hw011",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1519.5,year:"1519",event:"Cromwell joins Wolsey's council",significance:"Thomas Cromwell entered Wolsey's service, gaining his first experience of government administration. This would prove formative — Cromwell learned how to manage parliament, finances and patronage directly from the most powerful administrator of the age.",category:"Political",stars:3,section:"The Rise of Wolsey and His Policies"},
{id:"hw012",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1520,year:"June 1520",event:"Field of the Cloth of Gold",significance:"A lavish summit between Henry VIII and Francis I near Calais. Tens of thousands attended; jousting, feasting and extraordinary displays of wealth. Despite the spectacle, it produced no lasting alliance — Wolsey had already begun negotiations with Charles V.",category:"Political",stars:4,section:"Wolsey's Foreign Policy"},
{id:"hw013",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1521,year:"August 1521",event:"Treaty of Bruges — England sides formally with Charles V against France",significance:"After the Field of the Cloth of Gold, Wolsey switched sides and signed a formal alliance with Charles V. Francis I declared war on Charles in April 1521. England was now committed to war with France.",category:"Political",stars:4,section:"Wolsey's Foreign Policy"},
{id:"hw014",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1522,year:"1522",event:"Henry declares war on France",significance:"Following the Treaty of Bruges, Henry declared war on France in May 1522. The campaign was expensive and inconclusive. Wolsey agreed a triple attack with Charles V and the Duke of Bourbon in 1523, which also failed to deliver results.",category:"Military",stars:3,section:"Wolsey's Foreign Policy"},
{id:"hw015",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1523,year:"1523",event:"Cromwell becomes MP for the first time",significance:"Cromwell was elected MP and made his first notable speech in parliament — against the costs of Wolsey's war with France. He began building his own political reputation, separate from Wolsey's patronage.",category:"Political",stars:3,section:"The Rise of Wolsey and His Policies"},
{id:"hw016",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1525,year:"1525",event:"The Amicable Grant — tax crisis and Suffolk revolt",significance:"Wolsey demanded priests pay one third of their income as tax and laypeople one sixth, without parliamentary approval. It caused outrage. In May 1525, 3,000 men rose in Suffolk. Henry was forced to abandon the grant — a serious blow to Wolsey's authority.",category:"Political",stars:5,section:"The Rise of Wolsey and His Policies"},
{id:"hw017",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1525.3,year:"1525",event:"Battle of Pavia — Francis I taken prisoner by Charles V",significance:"Francis I was captured by Charles V's forces at Pavia in Italy. This shattered the European balance of power. Wolsey then negotiated the Treaty of More — a peace with France — switching sides again now that Charles had become too powerful.",category:"Military",stars:4,section:"The Rise of Wolsey and His Policies"},
{id:"hw018",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1525.6,year:"1525",event:"Treaty of More — Wolsey makes peace with France",significance:"With Charles V now dangerously powerful after Pavia, Wolsey reversed English policy and signed a peace treaty with France. This flexibility showed Wolsey's diplomatic skill but also highlighted how England was too weak to dictate European affairs.",category:"Political",stars:4,section:"Wolsey's Foreign Policy"},
{id:"hw019",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1526,year:"1526",event:"Eltham Ordinances — court reforms that sidelined Wolsey's rivals",significance:"Wolsey issued the Eltham Ordinances, officially to save money and improve hygiene at court. They also removed many of Wolsey's political rivals from the Privy Chamber. Critics argued this was Wolsey consolidating his own power.",category:"Political",stars:3,section:"The Rise of Wolsey and His Policies"},
{id:"hw020",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1526.5,year:"1526",event:"Wolsey organises the League of Cognac against Charles V",significance:"Wolsey helped form the League of Cognac — an alliance of northern Italian states against Charles V. England backed it diplomatically. This was part of Wolsey's strategy to prevent Charles from becoming too dominant in Europe.",category:"Political",stars:3,section:"Wolsey's Foreign Policy"},
{id:"hw021",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1527,year:"1527",event:"Treaty of Westminster — England threatens Charles V, allies with France",significance:"Wolsey signed the Treaty of Westminster, threatening Charles V with war if he did not improve relations with his neighbours. England moved back towards France. This was directly connected to Henry's desire for a divorce — Catherine of Aragon was Charles's aunt.",category:"Political",stars:4,section:"Wolsey's Foreign Policy"},
{id:"hw022",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1528,year:"April 1528",event:"France and England declare war on Charles V — no troops sent",significance:"England and France formally declared war on Charles V, but Henry sent no troops. England was widely seen as weak and uncommitted. The declaration was largely a diplomatic gesture to pressure Charles rather than a genuine military campaign.",category:"Military",stars:3,section:"Wolsey's Foreign Policy"},
{id:"hw023",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1528.5,year:"April 1528",event:"Campeggio and Wolsey appointed to rule on Henry's divorce",significance:"Pope Clement VII — held under Charles V's influence — appointed Cardinals Campeggio and Wolsey to hear the divorce case on his behalf in England. This gave the appearance of progress while allowing the Pope to delay indefinitely.",category:"Religious",stars:5,section:"Wolsey, Catherine, the Succession and Annulment"},
{id:"hw024",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1528.8,year:"October 1528",event:"Campeggio arrives in England — deliberately late",significance:"Campeggio arrived months late, hampered by ill health and age, and with secret papal instructions to delay. He brought with him a decretal commission (a document that could declare the marriage invalid) but refused to show it — buying the Pope more time.",category:"Religious",stars:4,section:"Wolsey, Catherine, the Succession and Annulment"},
{id:"hw025",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1529,year:"June 1529",event:"Divorce hearing at Blackfriars Court",significance:"The legatine court opened at Blackfriars in London. Catherine of Aragon made a dramatic personal appeal to Henry before walking out and refusing to return. The hearing was the most public airing of the divorce crisis and deepened Henry's humiliation.",category:"Religious",stars:5,section:"Wolsey, Catherine, the Succession and Annulment"},
{id:"hw026",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1529.3,year:"July 1529",event:"Campeggio suspends the divorce case",significance:"Campeggio suddenly suspended proceedings, citing the papal court's summer recess. This was the final blow for Wolsey — he had been unable to deliver the divorce. Henry's fury ended Wolsey's political career.",category:"Religious",stars:5,section:"Wolsey, Catherine, the Succession and Annulment"},
{id:"hw027",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1529.5,year:"August 1529",event:"Treaty of Cambrais — Francis I makes peace with Charles V",significance:"Without consulting England, France signed peace with Charles V. Wolsey's entire foreign policy — built on playing France and Charles against each other — collapsed overnight. England was diplomatically isolated.",category:"Political",stars:4,section:"Wolsey's Foreign Policy"},
{id:"hw028",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1529.7,year:"1529",event:"Wolsey falls from power — Thomas More becomes Lord Chancellor",significance:"Wolsey was stripped of the Lord Chancellorship and charged with praemunire (exercising papal authority in England). Thomas More replaced him. Cromwell spoke in Wolsey's defence in parliament. Wolsey was the first of Henry's ministers to be destroyed.",category:"Political",stars:5,section:"Wolsey, Catherine, the Succession and Annulment"},
{id:"hw029",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1529.8,year:"1529",event:"Cromwell becomes MP for Taunton — speaks in Wolsey's defence",significance:"Cromwell was elected MP for Taunton and made a notable speech defending Wolsey in parliament. Rather than falling with his patron, Cromwell used the crisis to bring himself to Henry's attention — one of the most skilful political manoeuvres of the reign.",category:"Political",stars:4,section:"Wolsey, Catherine, the Succession and Annulment"},
{id:"hw030",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1530,year:"November 1530",event:"Wolsey dies travelling south to London",significance:"Wolsey had been summoned to London on charges of praemunire and high treason. He died at Leicester Abbey on the journey south, reportedly saying 'Had I but served my God as diligently as I have served my king, He would not have given me over in my grey hairs.' He was spared a likely execution.",category:"Political",stars:5,section:"Wolsey, Catherine, the Succession and Annulment"},

// ── HENRY VIII & CROMWELL ────────────────────────────────────────────────
{id:"hc001",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1531,year:"1531",event:"Cromwell appointed to the royal council",significance:"After successfully navigating Wolsey's fall, Cromwell secured a place on Henry's royal council. He had demonstrated his administrative brilliance and political survival instinct. Within two years he would be Henry's chief minister.",category:"Political",stars:4,section:"Cromwell's Rise to Power"},
{id:"hc002",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1532,year:"1532",event:"Cromwell appointed Master of the King's Jewels",significance:"A significant court office that gave Cromwell direct access to Henry and control over royal finances. Combined with his seat on the council, Cromwell was now firmly established as a key royal servant.",category:"Political",stars:3,section:"Cromwell's Rise to Power"},
{id:"hc003",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1532.3,year:"1532",event:"Thomas More resigns as Lord Chancellor",significance:"More resigned, claiming ill health — but in reality he was a devout Catholic who could not support Henry's divorce or the break with Rome. His resignation signalled the direction Henry was taking and removed the most principled obstacle to Cromwell's advancement.",category:"Political",stars:4,section:"Cromwell's Rise to Power"},
{id:"hc004",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1533,year:"1533",event:"Cromwell made Henry's chief minister",significance:"Cromwell became Henry's principal secretary and chief minister. He now had full control of government administration. Over the next seven years he would oversee the English Reformation, the Dissolution of the Monasteries and the most radical transformation of the English state since the Norman Conquest.",category:"Political",stars:5,section:"Cromwell's Rise to Power"},
{id:"hc005",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1535,year:"1535",event:"Cromwell surveys church wealth and inspects monastery morality",significance:"Cromwell sent commissioners across England to assess the wealth of the church and inspect the moral conduct of monasteries. The reports — which exaggerated corruption and vice — provided the justification Henry and Cromwell needed to dissolve the monasteries.",category:"Religious",stars:5,section:"The Dissolution of the Monasteries"},
{id:"hc006",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536,year:"March 1536",event:"First Act for the Dissolution of the Monasteries",significance:"Parliament passed the first act dissolving smaller monasteries (those with income under £200 per year). 376 monasteries were closed. Their lands and wealth were transferred to the Crown via Cromwell's newly created Court of Augmentations.",category:"Religious",stars:5,section:"The Dissolution of the Monasteries"},
{id:"hc007",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.1,year:"1536",event:"Court of Augmentations established",significance:"Cromwell set up the Court of Augmentations to manage the enormous influx of wealth from the dissolved monasteries. It handled the sale of lands, collection of revenues and redistribution of assets — an example of Cromwell's genius for administrative innovation.",category:"Political",stars:4,section:"The Dissolution of the Monasteries"},
{id:"hc008",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.2,year:"1536",event:"Cromwell appointed Lord Privy Seal and given title Baron Cromwell",significance:"Cromwell was elevated to the peerage as Baron Cromwell and appointed Lord Privy Seal — one of the great offices of state. This was the peak of his official power, giving him formal precedence over almost all other councillors.",category:"Political",stars:4,section:"Cromwell's Rise to Power"},
{id:"hc009",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.25,year:"April 1536",event:"Henry orders Cromwell to investigate Anne Boleyn for adultery",significance:"Henry VIII instructed Cromwell to find evidence against Anne Boleyn. Anne had failed to produce a male heir and Henry had already begun pursuing Jane Seymour. Cromwell directed the investigation that would lead to Anne's arrest and execution.",category:"Political",stars:5,section:"Cromwell and the King's Marriages"},
{id:"hc010",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.3,year:"April–May 1536",event:"Mark Smeaton confesses adultery — Anne Boleyn arrested",significance:"Court musician Mark Smeaton admitted adultery with Anne Boleyn under interrogation on 30 April. Four further men were arrested, including Anne's own brother George. Anne was arrested on 2 May and sent to the Tower of London.",category:"Political",stars:5,section:"Cromwell and the King's Marriages"},
{id:"hc011",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.4,year:"May 1536",event:"Anne Boleyn tried before the Duke of Norfolk, sentenced to death",significance:"Anne was tried before a panel including her own uncle, the Duke of Norfolk. She and her brother were found guilty of adultery and incest. Anne pleaded not guilty throughout. She was sentenced to death.",category:"Political",stars:5,section:"Cromwell and the King's Marriages"},
{id:"hc012",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.45,year:"17 May 1536",event:"Cranmer annuls Henry's marriage to Anne — Elizabeth made illegitimate",significance:"Two days before her execution, Archbishop Cranmer annulled Henry's marriage to Anne Boleyn. Elizabeth was declared illegitimate, just as Mary had been. Henry now had no legitimate heir.",category:"Religious",stars:4,section:"Cromwell and the King's Marriages"},
{id:"hc013",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.5,year:"19 May 1536",event:"Execution of Anne Boleyn — crowd of 1,000 watched",significance:"Anne Boleyn was executed on Tower Green before a crowd of around 1,000 people. She was the first English queen to be publicly executed. Henry married Jane Seymour just eleven days later.",category:"Political",stars:5,section:"Cromwell and the King's Marriages"},
{id:"hc014",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.55,year:"30 May 1536",event:"Henry marries Jane Seymour",significance:"Henry married Jane Seymour, a lady-in-waiting, just eleven days after Anne Boleyn's execution. Jane was considered meek and obedient — the opposite of Anne. She would be the only one of Henry's wives to give him a male heir.",category:"Political",stars:4,section:"Cromwell and the King's Marriages"},
{id:"hc015",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.6,year:"July 1536",event:"Henry Fitzroy dies — Henry has no male heir",significance:"Henry Fitzroy, Henry's illegitimate son by Elizabeth Blount, died aged 17. Henry now had no male heir at all — Mary and Elizabeth were both declared illegitimate. The succession crisis was acute and increased pressure on Jane Seymour.",category:"Political",stars:4,section:"Cromwell and the King's Marriages"},
{id:"hc016",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.62,year:"August 1536",event:"First set of royal injunctions issued to the clergy",significance:"Cromwell issued the first royal injunctions to the clergy in Henry's name, requiring all clergy to deliver the same message — endorsing royal supremacy and denouncing the Pope. This was the beginning of systematic state control over religious teaching.",category:"Religious",stars:4,section:"Cromwell and the King's Marriages"},
{id:"hc017",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.65,year:"1536",event:"Act abolishing franchises and liberties — Council of the North strengthened",significance:"The act abolished independent legal jurisdictions (franchises and liberties) that had operated outside royal control. The Council of the North — first set up in 1472 — was strengthened to enforce royal authority in the north following the Pilgrimage of Grace.",category:"Political",stars:3,section:"Cromwell's Rise to Power"},
{id:"hc018",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.7,year:"October 1536",event:"Pilgrimage of Grace — largest rebellion of Henry's reign",significance:"The Pilgrimage of Grace began in Lincolnshire on 2 October when Nicholas Melton led 3,000 commoners in revolt. By 16 October, Robert Aske had led 10,000 into York. At its peak over 30,000 marched — protesting the dissolution of monasteries, religious changes and heavy taxation.",category:"Social",stars:5,section:"The Pilgrimage of Grace"},
{id:"hc019",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.75,year:"October 1536",event:"Pontefract Articles delivered to the King",significance:"On 27 October, Aske and the Duke of Norfolk met at Doncaster bridge. Two rebel leaders — Ellerker and Bowes — were allowed to deliver the Pontefract Articles directly to Henry, listing the rebels' grievances including the dissolution, new taxes and heresy.",category:"Political",stars:4,section:"The Pilgrimage of Grace"},
{id:"hc020",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.8,year:"December 1536",event:"Doncaster pardon — Henry promises parliament to discuss grievances",significance:"On 6 December, 40 pilgrims met Norfolk at Doncaster and secured a royal pardon and a promise that parliament would discuss their grievances. The rebels dispersed — a mistake, as Henry had no intention of keeping his promises.",category:"Political",stars:4,section:"The Pilgrimage of Grace"},
{id:"hc021",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1537,year:"January 1537",event:"New uprisings in Carlisle and Hull — Henry executes 178 pilgrims",significance:"When two minor uprisings broke out in Carlisle and Hull in January 1537 (partly because Henry had not delivered on his promises), Henry used them as an excuse to break the pardon. Around 178 pilgrims were executed, including Robert Aske, who was hanged in chains at York.",category:"Political",stars:5,section:"The Pilgrimage of Grace"},
{id:"hc022",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1537.8,year:"12 October 1537",event:"Jane Seymour gives birth to Edward VI",significance:"Jane Seymour finally gave Henry the male heir he had craved for nearly 30 years. Edward was born at Hampton Court. Jane died twelve days later from puerperal fever. Henry wore black for three months — he was reportedly devastated.",category:"Political",stars:5,section:"Cromwell and the King's Marriages"},
{id:"hc023",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1538,year:"June 1538",event:"Charles V and Francis I sign 10-year truce at Nice",significance:"Without England's involvement, Charles V and Francis I agreed a truce. This raised fears in England of a Catholic crusade against the newly Protestant Henry. Cromwell began urgently seeking a Protestant foreign alliance.",category:"Political",stars:4,section:"The Rise of Wolsey and His Policies"},
{id:"hc024",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1539,year:"January 1539",event:"Toledo Pact — Charles V and Francis I agree not to attack England alone",significance:"Charles and Francis signed the Pact of Toledo, agreeing neither would make a separate treaty with England. This placed England under serious diplomatic threat and made Cromwell's search for a Protestant alliance urgent. It was this pressure that led to the Anne of Cleves match.",category:"Political",stars:4,section:"The Rise of Wolsey and His Policies"},
{id:"hc025",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1540,year:"6 January 1540",event:"Henry marries Anne of Cleves",significance:"Cromwell had arranged Henry's marriage to Anne of Cleves as a diplomatic alliance with Protestant German princes. Henry was reportedly repulsed by Anne on first meeting, calling her a 'Flanders mare'. The marriage was never consummated.",category:"Political",stars:5,section:"The Fall of Cromwell"},
{id:"hc026",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1540.1,year:"February 1540",event:"Cromwell orders closure of Thetford Priory",significance:"Cromwell ordered the closure of Thetford Priory in Norfolk — the ancestral burial place of the Duke of Norfolk's family. This personal affront deepened the Duke's hatred of Cromwell and contributed to the political coalition that would bring Cromwell down.",category:"Religious",stars:3,section:"The Fall of Cromwell"},
{id:"hc027",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1540.2,year:"April 1540",event:"Cromwell made Great Chamberlain and Earl of Essex",significance:"In April 1540, Henry elevated Cromwell to Earl of Essex and Great Chamberlain. This appeared to be a sign of favour — but within weeks Cromwell was arrested. Some historians see this as Henry lulling Cromwell into a false sense of security.",category:"Political",stars:4,section:"The Fall of Cromwell"},
{id:"hc028",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1540.4,year:"10 June 1540",event:"Cromwell arrested for heresy and treason at the Privy Council",significance:"Cromwell was arrested at a Privy Council meeting on 10 June 1540. His enemies — led by the Duke of Norfolk and the conservative faction — had turned Henry against him. He was accused of heresy, treason and acting beyond his authority.",category:"Political",stars:5,section:"The Fall of Cromwell"},
{id:"hc029",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1540.45,year:"29 June 1540",event:"Parliament passes Act of Attainder condemning Cromwell to death",significance:"Unlike Wolsey, Cromwell was condemned by an Act of Attainder — meaning he was never tried in court. Parliament simply voted for his death. He wrote desperate letters to Henry from the Tower begging for mercy. None came.",category:"Political",stars:4,section:"The Fall of Cromwell"},
{id:"hc030",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1540.5,year:"9 July 1540",event:"Anne of Cleves marriage annulled",significance:"Henry's marriage to Anne of Cleves was annulled on grounds that it had never been consummated and that Anne had a prior contract of marriage. Anne accepted the annulment gracefully and received a generous settlement. She outlived Henry.",category:"Political",stars:4,section:"The Fall of Cromwell"},
{id:"hc031",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1540.6,year:"28 July 1540",event:"Cromwell executed — Henry marries Catherine Howard",significance:"Thomas Cromwell was executed on Tower Hill on 28 July 1540. On the same day, Henry married the young Catherine Howard, niece of Cromwell's enemy the Duke of Norfolk. Cromwell was the second chief minister Henry destroyed — after Wolsey.",category:"Political",stars:5,section:"The Fall of Cromwell"},
{id:"hc032",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1547,year:"January 1547",event:"Death of Henry VIII — succeeded by Edward VI",significance:"Henry VIII died at Whitehall Palace aged 55, having transformed England: broken with Rome, dissolved the monasteries, established royal supremacy over the church and executed two chief ministers. He was succeeded by his nine-year-old son Edward VI.",category:"Political",stars:4,section:"The Fall of Cromwell"},

// ── THE REFORMATION & ITS IMPACT ────────────────────────────────────────
{id:"rf001",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1521,year:"1521",event:"Henry writes 'Defence of the Seven Sacraments' — earns title 'Fidei Defensor'",significance:"Henry wrote a theological tract attacking Martin Luther and defending the Pope. The Pope awarded him the title 'Fidei Defensor' (Defender of the Faith). Deeply ironic — within twelve years Henry had broken with Rome. The title FD still appears on British coins today.",category:"Religious",stars:4,section:"Henry VIII, Renaissance Prince"},
{id:"rf002",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1525,year:"1525",event:"Elizabeth Barton claims a vision of the Virgin Mary heals her",significance:"Elizabeth Barton, a servant from Kent, claimed the Virgin Mary appeared to her and healed her of illness. She became known as the 'Holy Maid of Kent' and began making prophecies. She was initially tolerated — until she began speaking against Henry's divorce.",category:"Religious",stars:3,section:"Opposition to, and Impact of, the Reformation"},
{id:"rf003",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1527,year:"1527",event:"Henry VIII falls for Anne Boleyn — begins seeking divorce from Catherine",significance:"Henry fell in love with Anne Boleyn, a lady at court, and began seeking an annulment from Catherine of Aragon, arguing the original papal dispensation for the marriage was invalid. Catherine's nephew Charles V controlled the Pope, making the annulment impossible through normal channels.",category:"Religious",stars:5,section:"The Break with Rome"},
{id:"rf004",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1527.5,year:"1527",event:"The Pope is briefly imprisoned by Charles V's forces",significance:"Charles V's troops sacked Rome and briefly imprisoned Pope Clement VII in the Castel Sant'Angelo. This made it politically impossible for the Pope to annul Henry's marriage to Catherine — she was Charles's aunt and Charles now held the Pope as a virtual prisoner.",category:"Religious",stars:4,section:"The Break with Rome"},
{id:"rf005",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1529.4,year:"June 1529",event:"Battle of Landriano — Charles defeats the French in northern Italy",significance:"Charles V's forces defeated the French at Landriano, confirming his dominance in Italy. The Pope was now firmly under Charles's influence, making any papal annulment of Henry's marriage to Catherine of Aragon impossible.",category:"Military",stars:3,section:"The Break with Rome"},
{id:"rf006",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1532,year:"1532",event:"Act of Annates — payments from clergy to Rome banned",significance:"The Act of Annates banned newly appointed clergy from paying the first year of their income to Rome. This was one of Cromwell's key pieces of legislation breaking the financial link between the English church and the papacy.",category:"Religious",stars:4,section:"The Break with Rome"},
{id:"rf007",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1532.5,year:"1532",event:"Cranmer appointed Archbishop of Canterbury",significance:"Thomas Cranmer was appointed Archbishop of Canterbury. A committed reformer and loyal to Henry, Cranmer would be the key instrument in granting the royal annulment and reshaping the English church's theology over the next two decades.",category:"Religious",stars:5,section:"The Break with Rome"},
{id:"rf008",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1533,year:"25 January 1533",event:"Henry's secret marriage to Anne Boleyn",significance:"Thomas Cranmer performed the secret marriage between Henry and the pregnant Anne Boleyn at Whitehall. The marriage was kept secret because Henry's marriage to Catherine of Aragon had not yet been officially annulled.",category:"Religious",stars:5,section:"The Break with Rome"},
{id:"rf009",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1533.2,year:"March 1533",event:"Act in Restraint of Appeals — England declared an empire",significance:"Cromwell's most important piece of legislation. The act declared England an 'empire' — meaning it was subject to no foreign jurisdiction, including the Pope's. Henry was now head of the church in England by law. All appeals to Rome were banned.",category:"Religious",stars:5,section:"The Break with Rome"},
{id:"rf010",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1533.3,year:"23 March 1533",event:"Original marriage to Catherine of Aragon declared invalid — Mary made illegitimate",significance:"Cranmer formally declared Henry's marriage to Catherine invalid, on grounds the original papal dispensation was incorrect and they had therefore never been truly married. Princess Mary was declared illegitimate and removed from the succession.",category:"Religious",stars:5,section:"The Break with Rome"},
{id:"rf011",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1533.5,year:"July 1533",event:"Elizabeth Barton arrested and taken to the Tower",significance:"Elizabeth Barton, the 'Holy Maid of Kent', had publicly prophesied that Henry would lose his throne if he divorced Catherine. She was arrested, taken to the Tower of London and interrogated. Her network of supporters included some senior churchmen.",category:"Religious",stars:3,section:"Opposition to, and Impact of, the Reformation"},
{id:"rf012",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1533.6,year:"September 1533",event:"Anne Boleyn gives birth to a daughter — Elizabeth",significance:"Henry had been convinced he would have a son. Anne gave birth to a girl, named Elizabeth. Henry's disappointment was acute. Elizabeth was declared legitimate and placed in the succession ahead of Mary — but Henry's desire for a male heir remained unsatisfied.",category:"Political",stars:5,section:"The Break with Rome"},
{id:"rf013",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1533.7,year:"23 November 1533",event:"Elizabeth Barton publicly humiliated at St Paul's and forced to confess",significance:"Elizabeth Barton was brought to St Paul's Cross in London and publicly forced to confess that her visions were fraudulent. This discredited her and the broader Catholic opposition to Henry's divorce. She was executed at Tyburn the following April.",category:"Religious",stars:3,section:"Opposition to, and Impact of, the Reformation"},
{id:"rf014",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1533.8,year:"1533",event:"Priest John Frith burned at the stake for denying transubstantiation",significance:"John Frith, a Protestant reformer, was burned at Smithfield for denying transubstantiation — the Catholic doctrine that the bread and wine literally become Christ's body and blood at mass. His execution showed Henry still considered Protestant heresy a capital offence.",category:"Religious",stars:3,section:"The Break with Rome"},
{id:"rf015",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1534,year:"1534",event:"Act of Supremacy — Henry declared Supreme Head of the Church of England",significance:"Parliament formally confirmed Henry as Supreme Head of the Church of England. This was the legal foundation of the English Reformation. Those who refused to acknowledge it could be executed for treason under the new Treason Act.",category:"Religious",stars:5,section:"The Break with Rome"},
{id:"rf016",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1534.1,year:"1534",event:"Act of Succession — Anne Boleyn named lawful wife, Mary declared illegitimate",significance:"The Act of Succession formally established Anne Boleyn as Henry's lawful wife and declared Princess Mary illegitimate. All subjects were required to swear an oath accepting this. Refusal was treason.",category:"Political",stars:4,section:"The Break with Rome"},
{id:"rf017",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1534.2,year:"1534",event:"Treason Act — denying royal supremacy is punishable by death",significance:"The Treason Act made it a capital offence to deny Henry's royal supremacy by spoken or written word. Crucially, no evidence beyond the accusation was needed. This was used to execute Thomas More and Bishop Fisher and silenced almost all public opposition.",category:"Legal",stars:5,section:"The Break with Rome"},
{id:"rf018",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1534.3,year:"1534",event:"Anne Boleyn suffers a miscarriage",significance:"Anne Boleyn miscarried. Henry was bitterly disappointed — he had broken with Rome, executed his former ministers and faced international condemnation, all in pursuit of a male heir. Anne's failure to deliver a son began to erode Henry's affection for her.",category:"Political",stars:3,section:"Cromwell and the King's Marriages"},
{id:"rf019",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1534.4,year:"April 1534",event:"Thomas More sent to the Tower for refusing the Oath of Succession",significance:"Sir Thomas More refused to swear the Oath of Succession, which implied accepting Henry's supremacy over the church. He was committed to the Tower of London. He remained silent about his reasons — a legal strategy that nearly saved him.",category:"Religious",stars:5,section:"Opposition to, and Impact of, the Reformation"},
{id:"rf020",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1534.5,year:"21 April 1534",event:"Elizabeth Barton executed — Londoners required to take Oath of Succession",significance:"Elizabeth Barton and her associate Edward Bocking were executed at Tyburn. Londoners were then required to swear the Oath of Succession, acknowledging Henry's marriage to Anne and the break with Rome. Refusal was treason.",category:"Religious",stars:4,section:"Opposition to, and Impact of, the Reformation"},
{id:"rf021",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1535,year:"1535",event:"Pope declares John Fisher to be made a Cardinal",significance:"Pope Paul III appointed the imprisoned Bishop John Fisher as a Cardinal — a direct provocation to Henry. Henry reportedly said that Fisher would have no head to wear the cardinal's hat. Fisher was executed shortly after.",category:"Religious",stars:3,section:"Opposition to, and Impact of, the Reformation"},
