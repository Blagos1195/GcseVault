{id:"rf022",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1535.3,year:"June 1535",event:"Bishop John Fisher executed for treason",significance:"John Fisher, Bishop of Rochester and the only English bishop to oppose Henry's supremacy, was executed on Tower Hill. He was 66 and had been in the Tower for over a year. His execution caused outrage across Catholic Europe.",category:"Religious",stars:5,section:"Opposition to, and Impact of, the Reformation"},
{id:"rf023",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1535.5,year:"6 July 1535",event:"Thomas More executed under the Treason Act",significance:"Sir Thomas More was beheaded on Tower Hill. He had refused to acknowledge Henry's supremacy over the church. His final words were that he died 'the king's good servant, but God's first.' He was canonised by the Catholic Church in 1935.",category:"Religious",stars:5,section:"Opposition to, and Impact of, the Reformation"},
{id:"rf024",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536,year:"January 1536",event:"Catherine of Aragon dies",significance:"Catherine of Aragon died at Kimbolton Castle on 7 January 1536, aged 50. She had refused to accept the annulment until her death, always signing her letters 'Catherine the Queen'. Henry and Anne reportedly wore yellow — either for mourning or celebration.",category:"Political",stars:4,section:"The Break with Rome"},
{id:"rf025",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.05,year:"29 January 1536",event:"Anne Boleyn miscarries a son shortly after Henry's jousting accident",significance:"Henry suffered a serious jousting accident and was unconscious for two hours. Anne Boleyn miscarried a boy shortly after. Some historians link the two events. Henry began to believe God was punishing him again — as he had believed with Catherine.",category:"Political",stars:4,section:"Cromwell and the King's Marriages"},
{id:"rf026",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.63,year:"July 1536",event:"Act of Ten Articles — only three sacraments declared valid",significance:"The Act of Ten Articles, the first statement of doctrine for the new Church of England, declared only three sacraments valid (baptism, penance, eucharist) rather than the Catholic seven. A significant move in a Protestant direction, driven by Cromwell.",category:"Religious",stars:4,section:"The Break with Rome"},
{id:"rf027",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1536.66,year:"1536",event:"Act of Union — Wales officially becomes part of England",significance:"The Act of Union formally incorporated Wales into England. Wales now shared the English legal system and was represented in parliament. The Welsh gentry gained equal rights with English. A significant piece of Cromwellian state-building.",category:"Political",stars:3,section:"Cromwell's Rise to Power"},
{id:"rf028",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1537.3,year:"July 1537",event:"Bishops' Book published — other sacraments valid but less important",significance:"The Bishops' Book (Institution of a Christian Man) attempted to clarify doctrine. It accepted the other four sacraments as valid but gave them a lesser status than the three in the Ten Articles. It also decreased the theological emphasis on purgatory and indulgences.",category:"Religious",stars:3,section:"The Break with Rome"},
{id:"rf029",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1538.5,year:"September 1538",event:"Second royal injunctions — English Bible ordered, pilgrimages discouraged",significance:"Cromwell's second set of royal injunctions ordered every church to have an English translation of the Bible. Pilgrimages were discouraged, and statues and relics were to be removed. This was a major step towards Protestant practice in English churches.",category:"Religious",stars:5,section:"The Break with Rome"},
{id:"rf030",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1538.7,year:"1538",event:"John Lambert burned repeatedly in flames for denying transubstantiation",significance:"John Lambert was burned at Smithfield in a deliberately prolonged execution — Henry reportedly watched. Lambert had denied transubstantiation. His execution signalled Henry moving back towards Catholic doctrine even as he rejected the Pope's authority.",category:"Religious",stars:3,section:"The Break with Rome"},
{id:"rf031",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1538.8,year:"1538",event:"Henry invites monks and abbots to voluntarily surrender larger monasteries",significance:"Having dissolved the smaller monasteries in 1536, Cromwell began pressuring the heads of larger monasteries to voluntarily surrender their houses to the Crown. Many abbots who refused were accused of treason and executed.",category:"Religious",stars:4,section:"The Dissolution of the Monasteries"},
{id:"rf032",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1539,year:"1539",event:"Six Articles — Henry reasserts Catholic doctrine",significance:"The Act of Six Articles reasserted transubstantiation, clerical celibacy and other Catholic practices. It was a significant conservative reaction against Protestant reform. Cromwell opposed it — which contributed to his fall. Critics called it the 'whip with six strings'.",category:"Religious",stars:5,section:"The Break with Rome"},
{id:"rf033",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1539.5,year:"1539",event:"Second Act for the Dissolution of Monasteries",significance:"The second Dissolution Act closed the remaining larger monasteries — those with incomes above £200. By 1540 all 900 monasteries in England had been dissolved. Their lands were sold off, creating a new class of landowners with a vested interest in keeping the Reformation.",category:"Religious",stars:5,section:"The Dissolution of the Monasteries"},
{id:"rf034",topic:"Henry VIII",period:"Henry VIII",era:"1509–1547",yearNum:1540.05,year:"1540",event:"Court of First Fruits and Tenths established",significance:"Cromwell set up the Court of First Fruits and Tenths to collect taxes previously paid by English clergy to Rome. This was the final piece of the financial break with Rome — all money that had gone to the papacy now went to the Crown.",category:"Religious",stars:3,section:"The Dissolution of the Monasteries"},
// ── PLAINS INDIANS ───────────────────────────────────────────────────────
{id:"aw_pi001",topic:"American West",period:"American West",era:"1830–1895",yearNum:1830,year:"28 May 1830",event:"Indian Removal Act — 46,000 Native Americans forced west of the Mississippi",significance:"The act forced Plains Indians east of the Mississippi to relocate west of it, affecting around 46,000 people. It established the principle that the US government could simply move Native Americans wherever it chose, setting the pattern for all future Indian policy.",category:"Political",stars:5,section:"Plains Indians"},
{id:"aw_pi002",topic:"American West",period:"American West",era:"1830–1895",yearNum:1834,year:"30 June 1834",event:"Indian Trade and Intercourse Act — permanent Indian frontier established",significance:"A permanent Indian frontier was established. White settlers were prohibited from settling on Indian land, sales of guns and alcohol to Plains Indians were banned, and the army was tasked with protecting the frontier using forts connected by roads. The act was regularly ignored by settlers.",category:"Political",stars:4,section:"Plains Indians"},
{id:"aw_pi003",topic:"American West",period:"American West",era:"1830–1895",yearNum:1851.7,year:"17 September 1851",event:"Fort Laramie Treaty — US promises protection and annuity to Plains Indians",significance:"The US agreed to protect Plains Indians from white settlers and pay tribes an annuity of $50,000 per year. In return Plains Indians had to end inter-tribal fighting, guarantee safe travel for migrants, allow railway surveyors onto their land, and allow government forts and roads. It was the first major treaty attempt to manage relations on the Plains.",category:"Political",stars:5,section:"Plains Indians"},
{id:"aw_pi004",topic:"American West",period:"American West",era:"1830–1895",yearNum:1851.1,year:"29 February 1851",event:"Indian Appropriation Act — funds moving Indians into Indian Territory (Oklahoma)",significance:"The act funded the relocation of Native Americans into Indian Territory in modern-day Oklahoma. Some reservations were granted hunting lands. The government's aim was to transform Plains Indians into farmers living like white Americans — a direct attack on their nomadic way of life.",category:"Political",stars:4,section:"Plains Indians"},
{id:"aw_pi005",topic:"American West",period:"American West",era:"1830–1895",yearNum:1861.2,year:"1861",event:"Treaty of Fort Wise — Arapaho and Cheyenne agree to move to eastern Colorado reservation",significance:"The Arapaho and Cheyenne tribes, including Chief Black Kettle, agreed to move to a reservation in eastern Colorado. The land was poor and unable to support their traditional way of life. The treaty was bitterly resented and would contribute directly to the Sand Creek Massacre three years later.",category:"Political",stars:4,section:"Plains Indians"},
{id:"aw_pi006",topic:"American West",period:"American West",era:"1830–1895",yearNum:1862.1,year:"1862",event:"Little Crow's War — Sioux uprising in Minnesota",significance:"Little Crow led a Sioux uprising in Minnesota after the US government failed to deliver promised food and annuity payments. Around 500 settlers were killed before the uprising was crushed. 38 Sioux were hanged in the largest mass execution in US history. The war hardened white attitudes towards Plains Indians across the country.",category:"Military",stars:4,section:"Plains Indians"},
{id:"aw_pi007",topic:"American West",period:"American West",era:"1830–1895",yearNum:1864,year:"November 1864",event:"Sand Creek Massacre — Colonel Chivington kills 200 Cheyenne",significance:"Colonel Chivington led 700 soldiers against Black Kettle's peaceful Cheyenne village at Sand Creek, Colorado, killing over 200 people — mostly women and children. Black Kettle had been promised protection. The massacre caused outrage but Chivington faced no punishment. It triggered further Plains Indian resistance and intensified the cycle of violence.",category:"Military",stars:5,section:"Plains Indians"},
{id:"aw_pi008",topic:"American West",period:"American West",era:"1830–1895",yearNum:1865,year:"1865",event:"Post-Sand Creek treaty — Cheyenne and Arapaho moved south of Arkansas River",significance:"A new treaty moved the Cheyenne and Arapaho to a large reservation south of the Arkansas River, and the government agreed to pay compensation to Sand Creek survivors. The treaty was another step in systematically confining Plains Indians to ever-smaller areas.",category:"Political",stars:3,section:"Plains Indians"},
{id:"aw_pi009",topic:"American West",period:"American West",era:"1830–1895",yearNum:1866.3,year:"1866",event:"Fetterman Trap — 80 US soldiers ambushed and killed by Sioux",significance:"Captain Fetterman, who had boasted he could ride through the entire Sioux nation with 80 men, was lured into an ambush by Crazy Horse and killed along with all 80 of his soldiers. It was the worst US Army defeat on the Plains to that point and shocked the US government into negotiating.",category:"Military",stars:4,section:"Plains Indians"},
{id:"aw_pi010",topic:"American West",period:"American West",era:"1830–1895",yearNum:1866.4,year:"1866",event:"Start of Red Cloud's War — Sioux resist Bozeman Trail through their lands",significance:"Red Cloud led the Sioux in a sustained campaign against the Bozeman Trail, which ran through Sioux hunting grounds in violation of the Fort Laramie Treaty. The Fetterman Trap was the most dramatic incident. It was the only Indian war the US government ever lost.",category:"Military",stars:4,section:"Plains Indians"},
{id:"aw_pi011",topic:"American West",period:"American West",era:"1830–1895",yearNum:1868,year:"1868",event:"End of Red Cloud's War and new Fort Laramie Treaty",significance:"The US was forced to sue for peace. The new Fort Laramie Treaty gave the Sioux the Black Hills of Dakota as a permanent reservation and the US agreed to abandon the Bozeman Trail forts. It was a major victory for the Plains Indians — but the treaty would be broken within six years when gold was discovered in the Black Hills.",category:"Political",stars:5,section:"Plains Indians"},
{id:"aw_pi012",topic:"American West",period:"American West",era:"1830–1895",yearNum:1868.1,year:"1868",event:"Winter Campaign — Custer attacks Black Kettle's village; Black Kettle killed",significance:"General Sheridan ordered a winter campaign against Plains Indians who had left their reservations. Custer attacked Black Kettle's Cheyenne village on the Washita River, killing Black Kettle — who had survived Sand Creek — and over 100 others. The tactic of attacking villages in winter became standard US Army practice.",category:"Military",stars:4,section:"Plains Indians"},
{id:"aw_pi013",topic:"American West",period:"American West",era:"1830–1895",yearNum:1868.2,year:"1868",event:"President Grant's Peace Policy — better management of reservations to reduce tensions",significance:"Grant's Peace Policy aimed to calm tensions by improving the management of the reservation system. Christian missionaries were appointed as Indian agents to replace corrupt officials. In practice it changed little — the fundamental policy of confinement and forced assimilation continued.",category:"Political",stars:3,section:"Plains Indians"},
{id:"aw_pi014",topic:"American West",period:"American West",era:"1830–1895",yearNum:1870.1,year:"1870",event:"Pawnee tribe moved onto reservation — rights to lands across railway routes extinguished",significance:"The Pawnee tribe agreed to move onto a reservation, extinguishing their rights to lands along key railway routes. This pattern — tribes pressured or tricked into giving up land needed for railways or settlement — was repeated across the Plains throughout the 1860s and 1870s.",category:"Political",stars:3,section:"Plains Indians"},
{id:"aw_pi015",topic:"American West",period:"American West",era:"1830–1895",yearNum:1871,year:"1871",event:"Indian Appropriations Act — Plains Indian nations no longer recognised as independent",significance:"The act declared that Plains Indian nations were no longer recognised as 'an independent nation, tribe or power with whom the United States may contract by treaty.' This was a devastating legal change — it meant the government could now simply pass laws to take Indian land without needing to negotiate treaties.",category:"Political",stars:5,section:"Plains Indians"},
{id:"aw_pi016",topic:"American West",period:"American West",era:"1830–1895",yearNum:1874,year:"1874",event:"Custer leads expedition into the Black Hills — discovers gold, breaching Fort Laramie Treaty",significance:"Custer led a military expedition into the Black Hills of Dakota — land guaranteed to the Sioux by the 1868 Fort Laramie Treaty. His reports of gold sparked a gold rush. When the Sioux refused to sell the land, the US government effectively abandoned the treaty and moved to take the Black Hills by force.",category:"Political",stars:5,section:"Plains Indians"},
{id:"aw_pi017",topic:"American West",period:"American West",era:"1830–1895",yearNum:1875.9,year:"December 1875",event:"Government orders Sioux to return to reservations or face destruction",significance:"The US government issued an ultimatum ordering all Sioux bands to return to their reservations by January 1876 or be treated as hostile. Many bands were too far away or refused to comply. The order provided the pretext for the Great Sioux War and the military campaign that led to Little Bighorn.",category:"Political",stars:4,section:"Plains Indians"},
{id:"aw_pi018",topic:"American West",period:"American West",era:"1830–1895",yearNum:1876,year:"June 1876",event:"Battle of Little Bighorn — Custer leads 200 men against 2,000 warriors; all killed",significance:"Custer defied orders to wait for reinforcements and attacked a massive Sioux and Cheyenne encampment on the Little Bighorn River. He and all 200 of his men were killed. It was the greatest Plains Indian military victory but turned public opinion decisively towards the extermination of Indian resistance. Previous treaties were now ignored.",category:"Military",stars:5,section:"Plains Indians"},
{id:"aw_pi019",topic:"American West",period:"American West",era:"1830–1895",yearNum:1877,year:"1877",event:"Crazy Horse surrenders in Nebraska — killed at Fort Robinson in August",significance:"After a relentless winter campaign following Little Bighorn, Crazy Horse surrendered at Fort Robinson, Nebraska in May 1877. He was killed in August during a scuffle whilst being detained — stabbed by a soldier's bayonet. His death effectively ended organised Sioux military resistance.",category:"Military",stars:4,section:"Plains Indians"},
{id:"aw_pi020",topic:"American West",period:"American West",era:"1830–1895",yearNum:1879,year:"1879",event:"Carlisle Indian School founded — forced assimilation of Indian children",significance:"The Carlisle Indian Industrial School in Pennsylvania was founded on the principle of 'kill the Indian, save the man.' Children were taken from their families, forbidden to speak their language or practice their culture, given European names and clothes, and taught to live as white Americans. It became the model for Indian boarding schools across the country.",category:"Social",stars:4,section:"Plains Indians"},
{id:"aw_pi021",topic:"American West",period:"American West",era:"1830–1895",yearNum:1881.1,year:"1881",event:"End of the Great Sioux War",significance:"The Great Sioux War formally ended with the last Sioux bands confined to reservations. The war had lasted five years following Little Bighorn. The Sioux lost the Black Hills permanently and were confined to increasingly small reservations in South Dakota.",category:"Military",stars:3,section:"Plains Indians"},
{id:"aw_pi022",topic:"American West",period:"American West",era:"1830–1895",yearNum:1883,year:"1883",event:"Special courts take over chiefs' power to judge and punish Plains Indians",significance:"The US government established Courts of Indian Offences, replacing traditional tribal justice with government-controlled courts. Chiefs lost their legal authority over their own people. Traditional practices including dances, ceremonies and polygamy were made illegal.",category:"Political",stars:3,section:"Plains Indians"},
{id:"aw_pi023",topic:"American West",period:"American West",era:"1830–1895",yearNum:1885,year:"1885",event:"Special courts replaced by US federal law — Plains Indians lose all self-governance",significance:"Federal law was extended over Indian reservations, replacing the Courts of Indian Offences. Plains Indians were now fully subject to US law and had no power to govern themselves at all. Combined with the Dawes Act two years later, this completed the destruction of tribal political structures.",category:"Political",stars:4,section:"Plains Indians"},
{id:"aw_pi024",topic:"American West",period:"American West",era:"1830–1895",yearNum:1885.5,year:"1885",event:"All Plains Indians resettled onto reservations",significance:"By 1885 the US government had successfully confined all Plains Indian tribes onto reservations. The nomadic way of life that had defined Plains Indian culture for centuries — following the buffalo, moving with the seasons — was formally over.",category:"Political",stars:4,section:"Plains Indians"},
{id:"aw_pi025",topic:"American West",period:"American West",era:"1830–1895",yearNum:1887,year:"1887",event:"Dawes Act — tribal lands divided into family plots; surplus land sold off",significance:"The Dawes Act divided communal reservation land into individual plots: 160 acres per family, 80 acres for a single man, 40 acres for orphans under 18. All remaining land was sold off to white settlers. Plains Indians lost around half their remaining land by 1890. The act was designed to destroy tribal communal culture and force individual farming.",category:"Political",stars:5,section:"Plains Indians"},
{id:"aw_pi026",topic:"American West",period:"American West",era:"1830–1895",yearNum:1889.5,year:"1889",event:"Great Sioux Reservation split into 6 smaller reservations",significance:"The Great Sioux Reservation was broken up into six smaller separate reservations, further reducing Sioux land and dividing communities. The government took 9 million acres of surplus land. Combined with the Dawes Act, this represented the final dismemberment of Sioux territorial rights.",category:"Political",stars:4,section:"Plains Indians"},
{id:"aw_pi027",topic:"American West",period:"American West",era:"1830–1895",yearNum:1890.1,year:"1890",event:"Sitting Bull killed during attempted arrest — suspected Ghost Dance leader",significance:"As the Ghost Dance spiritual movement spread across reservations — promising that the dead would return and white settlers disappear — the US government panicked. Sitting Bull was killed by Indian police during an attempt to arrest him at the Standing Rock reservation. His death removed the most famous and symbolic figure of Indian resistance.",category:"Military",stars:4,section:"Plains Indians"},
{id:"aw_pi028",topic:"American West",period:"American West",era:"1830–1895",yearNum:1890.2,year:"December 1890",event:"Wounded Knee Massacre — 250 killed, half women and children",significance:"Sitting Bull's followers fled south to join Chief Bigfoot's band. The 7th Cavalry surrounded them at Wounded Knee Creek, South Dakota. When a Sioux warrior resisted being disarmed, shooting broke out. The cavalry killed around 250 people, half of them women and children. It was widely seen as revenge for Little Bighorn and public opinion was broadly positive. It marked the end of armed Indian resistance.",category:"Military",stars:5,section:"Plains Indians"},
{id:"aw_pi029",topic:"American West",period:"American West",era:"1830–1895",yearNum:1890.3,year:"1890",event:"US Government closes the frontier — no land inside the US belongs to any other people",significance:"The US government officially declared the frontier closed, meaning no land within the United States belonged to any foreign nation or independent people. This was the legal and symbolic end of Plains Indian sovereignty. The census bureau declared there was no longer a continuous frontier line.",category:"Political",stars:4,section:"Plains Indians"},

// ── MIGRATION AND EARLY SETTLEMENT ──────────────────────────────────────
{id:"aw_ms001",topic:"American West",period:"American West",era:"1830–1895",yearNum:1820,year:"1820s–1830s",event:"Joseph Smith founds the Mormon Church in New York",significance:"Joseph Smith claimed to have received golden plates from the angel Moroni and founded the Church of Jesus Christ of Latter-day Saints. The church's practice of polygamy and its tight-knit communal structure made Mormons deeply unpopular with their neighbours, triggering a pattern of persecution and migration that would eventually take them to Utah.",category:"Religious",stars:4,section:"Migration and Early Settlement"},
{id:"aw_ms002",topic:"American West",period:"American West",era:"1830–1895",yearNum:1838,year:"1838",event:"Missouri Governor issues Extermination Order — Mormons driven out of Missouri",significance:"Governor Lilburn Boggs issued an order declaring Mormons must be exterminated or driven from Missouri. Around 10,000 Mormons were forced to flee. The Extermination Order was not officially rescinded until 1976. It demonstrated that Mormons could not find safety in existing US states.",category:"Religious",stars:4,section:"Migration and Early Settlement"},
{id:"aw_ms003",topic:"American West",period:"American West",era:"1830–1895",yearNum:1839,year:"1839",event:"Mormons settle in Nauvoo, Illinois — build thriving community of 15,000",significance:"After fleeing Missouri, the Mormons built the city of Nauvoo on the banks of the Mississippi River in Illinois. Within five years it had a population of 15,000 — rivalling Chicago. The Mormons established their own militia and legal system, which alarmed non-Mormon neighbours.",category:"Religious",stars:3,section:"Migration and Early Settlement"},
{id:"aw_ms004",topic:"American West",period:"American West",era:"1830–1895",yearNum:1844,year:"1844",event:"Joseph Smith killed by a mob at Carthage jail",significance:"Joseph Smith was arrested after ordering the destruction of a newspaper that had published allegations about polygamy. A mob stormed Carthage jail and shot him dead. His death created a crisis of leadership and convinced many Mormons that they could never live safely among non-Mormons in the United States.",category:"Religious",stars:5,section:"Migration and Early Settlement"},
{id:"aw_ms005",topic:"American West",period:"American West",era:"1830–1895",yearNum:1846,year:"1846",event:"Mormons driven out of Nauvoo by hostile neighbours",significance:"Following Joseph Smith's death, rising violence from anti-Mormon mobs forced the entire Nauvoo community to abandon the city they had built. Around 10,000 Mormons crossed the frozen Mississippi River in winter. Brigham Young now led the church and began planning a migration far beyond the reach of the US government.",category:"Religious",stars:4,section:"Migration and Early Settlement"},
{id:"aw_ms006",topic:"American West",period:"American West",era:"1830–1895",yearNum:1847,year:"1847",event:"Brigham Young leads 16,000 Mormons to Salt Lake Valley, Utah — 'This is the right place'",significance:"Brigham Young led the Mormon exodus to the Salt Lake Valley in what was then Mexican territory — outside the jurisdiction of the US government. When Young saw the valley he declared 'This is the right place.' The Mormons built an extraordinary irrigation system that transformed the desert. Their success showed that the Great Plains and arid West could be settled with organised effort.",category:"Religious",stars:5,section:"Migration and Early Settlement"},
{id:"aw_ms007",topic:"American West",period:"American West",era:"1830–1895",yearNum:1848.1,year:"1848",event:"USA gains Utah Territory in Mexican-American War — Mormons now under US law",significance:"When the US won the Mexican-American War in February 1848, Utah became US territory. The Mormons, who had moved there specifically to escape US jurisdiction, found themselves under US law again. This ended any hope of full Mormon self-governance and set up decades of conflict between the Mormon community and the federal government.",category:"Religious",stars:3,section:"Migration and Early Settlement"},
{id:"aw_ms008",topic:"American West",period:"American West",era:"1830–1895",yearNum:1836,year:"1836",event:"Oregon Trail established",significance:"The Oregon Trail was a 2,000-mile route from Missouri to Oregon, used by wagon trains heading west. It became the main artery of westward migration. Over 400,000 people used it between 1836 and 1869 when the transcontinental railroad made it obsolete. Around 20,000 people died on the trail.",category:"Social",stars:4,section:"Migration and Early Settlement"},
{id:"aw_ms009",topic:"American West",period:"American West",era:"1830–1895",yearNum:1837,year:"1837",event:"Economic crisis in eastern USA drives migration west",significance:"A severe financial panic in 1837 caused bank failures and mass unemployment across the eastern and southern states. Thousands of families ruined by the crisis looked west for a fresh start. The crisis directly stimulated the first waves of organised migration along the Oregon Trail.",category:"Economic",stars:3,section:"Migration and Early Settlement"},
{id:"aw_ms010",topic:"American West",period:"American West",era:"1830–1895",yearNum:1841,year:"1841",event:"US government funds $30,000 expedition to map the Oregon Trail",significance:"The government funded John Frémont's expedition to map the Oregon Trail and publish detailed reports for migrants. The reports described conditions, water sources and landmarks along the route. They were widely distributed and significantly increased the confidence of would-be migrants, contributing to the Great Emigration of 1843.",category:"Political",stars:3,section:"Migration and Early Settlement"},
{id:"aw_ms011",topic:"American West",period:"American West",era:"1830–1895",yearNum:1843,year:"1843",event:"'Great Emigration' on the Oregon Trail — Marcus Whitman leads large numbers west",significance:"In 1843 around 1,000 people — the largest wagon train to that point — made the journey west along the Oregon Trail, led by Marcus Whitman. The success of the Great Emigration proved that large numbers of settlers with wagons, livestock and families could complete the journey, inspiring thousands more to follow.",category:"Social",stars:4,section:"Migration and Early Settlement"},
{id:"aw_ms012",topic:"American West",period:"American West",era:"1830–1895",yearNum:1845,year:"1845",event:"Texas officially becomes part of the USA",significance:"Texas was annexed by the United States, having been an independent republic since winning independence from Mexico in 1836. Annexation triggered the Mexican-American War. For the cattle industry, it meant the vast Texas longhorn herds were now part of the US economy.",category:"Political",stars:3,section:"Migration and Early Settlement"},
{id:"aw_ms013",topic:"American West",period:"American West",era:"1830–1895",yearNum:1846.1,year:"1846",event:"USA gains control of Oregon Territory from Britain",significance:"The Oregon Treaty with Britain set the US-Canada border at the 49th parallel, giving the USA the Oregon Territory. This resolved a long-running dispute and secured the western destination of the Oregon Trail firmly within the United States.",category:"Political",stars:3,section:"Migration and Early Settlement"},
{id:"aw_ms014",topic:"American West",period:"American West",era:"1830–1895",yearNum:1846.2,year:"1846",event:"Donner Party — wagon train stranded in Sierra Nevada; survivors resort to cannibalism",significance:"The Donner Party was a group of 87 migrants who took an untested shortcut and became trapped by early snowfall in the Sierra Nevada mountains. Of 87 people, 48 survived — some by eating the flesh of those who had died. The disaster was widely reported and highlighted the deadly dangers of westward migration.",category:"Social",stars:4,section:"Migration and Early Settlement"},
{id:"aw_ms015",topic:"American West",period:"American West",era:"1830–1895",yearNum:1848.2,year:"2 February 1848",event:"American victory in Mexican-American War — USA gains California and vast new territories",significance:"The Treaty of Guadalupe Hidalgo ended the war. The USA gained California, New Mexico, Arizona, Nevada, Utah and Colorado — over 500,000 square miles of new territory. Combined with the Oregon Territory, the USA now stretched from coast to coast.",category:"Political",stars:5,section:"Migration and Early Settlement"},
{id:"aw_ms016",topic:"American West",period:"American West",era:"1830–1895",yearNum:1848.3,year:"1848",event:"Gold discovered in California",significance:"Gold was discovered at Sutter's Mill on the American River in January 1848. The discovery was initially kept quiet but news spread rapidly. It triggered the largest mass migration in American history and transformed California from a sparsely populated territory to a state within two years.",category:"Economic",stars:5,section:"Migration and Early Settlement"},
{id:"aw_ms017",topic:"American West",period:"American West",era:"1830–1895",yearNum:1849,year:"1849",event:"California Gold Rush — 100,000 travel west; San Francisco explodes from 1,000 to 25,000",significance:"Around 100,000 people — the '49ers' — flooded into California seeking gold. San Francisco's population exploded from 1,000 to 25,000 in a single year. The gold rush brought people of every nationality and background and created a chaotic, lawless society that highlighted the need for proper law enforcement in the West.",category:"Economic",stars:5,section:"Migration and Early Settlement"},
{id:"aw_ms018",topic:"American West",period:"American West",era:"1830–1895",yearNum:1852,year:"1852",event:"Famine in China brings 20,000 Chinese migrants to California",significance:"A severe famine in China drove 20,000 Chinese migrants to California, many hoping to make their fortune in the gold fields. Chinese workers later became essential labour for the transcontinental railroad. They faced significant racial discrimination and violence from white settlers.",category:"Social",stars:3,section:"Migration and Early Settlement"},
{id:"aw_ms019",topic:"American West",period:"American West",era:"1830–1895",yearNum:1854,year:"1854",event:"Government creates Nebraska and Kansas territories — Great Plains opened to white settlement",significance:"The Kansas-Nebraska Act created two new territories, opening the Great Plains to white settlement for the first time. However, white Americans had no knowledge of how to farm the harsh Great Plains environment — the challenges of climate, soil and distance would define the next three decades.",category:"Political",stars:4,section:"Migration and Early Settlement"},
{id:"aw_ms020",topic:"American West",period:"American West",era:"1830–1895",yearNum:1859,year:"1859",event:"Gold mines opened in Colorado and Nebraska",significance:"New gold strikes in Colorado and Nebraska triggered another wave of migration west. The slogan 'Pike's Peak or Bust' drew tens of thousands of prospectors. Many failed — but many stayed, swelling the population of the Plains territories.",category:"Economic",stars:3,section:"Migration and Early Settlement"},
{id:"aw_ms021",topic:"American West",period:"American West",era:"1830–1895",yearNum:1879,year:"1879",event:"Exoduster Movement — 40,000 African Americans migrate to Kansas from southern states",significance:"Following the end of Reconstruction and the rise of racial violence in the South, around 40,000 African Americans migrated to Kansas in search of freedom and land. Led by figures like Benjamin 'Pap' Singleton, the Exodusters faced significant hardship on the Plains but established several all-Black communities.",category:"Social",stars:4,section:"Migration and Early Settlement"},
{id:"aw_ms022",topic:"American West",period:"American West",era:"1830–1895",yearNum:1889,year:"1889",event:"First Oklahoma Land Rush — 50,000 homesteaders claim 160-acre plots in Indian Territory",significance:"The government opened up former Indian Territory in Oklahoma to homesteaders. At noon on 22 April 1889, 50,000 settlers raced to claim 160-acre plots surveyed by government officials. The entire territory was claimed within hours. It was the most dramatic illustration of how Indian land was transferred to white settlers.",category:"Social",stars:4,section:"Migration and Early Settlement"},
{id:"aw_ms023",topic:"American West",period:"American West",era:"1830–1895",yearNum:1893,year:"1893",event:"Oklahoma Land Rush — 8 million acres opened for settlement",significance:"The largest Oklahoma land rush opened 8 million acres — the Cherokee Outlet — to homesteaders. Around 100,000 settlers took part. The rushes systematically converted the last remaining Indian Territory into white-settled land.",category:"Social",stars:3,section:"Migration and Early Settlement"},
{id:"aw_ms024",topic:"American West",period:"American West",era:"1830–1895",yearNum:1895,year:"1895",event:"Last Oklahoma Land Rush — 88,000 acres, marking the end of free land in the West",significance:"The final Oklahoma land rush opened only 88,000 acres — a fraction of earlier rushes. Combined with the government's declaration that the frontier was closed in 1890, it marked the symbolic end of the era of free western land and mass migration.",category:"Social",stars:3,section:"Migration and Early Settlement"},

// ── CONFLICT AND TENSION ─────────────────────────────────────────────────
{id:"aw_ct001",topic:"American West",period:"American West",era:"1830–1895",yearNum:1851.5,year:"1851",event:"San Francisco Vigilance Committees — 89 criminals brought to justice by vigilantes",significance:"Rival gangs took control of different parts of San Francisco during the gold rush. Citizens formed vigilance committees to bring criminals to justice themselves. In 1851 alone, 89 criminals were dealt with — 15 handed to law enforcement and the rest hanged. Vigilantism was the most common form of law enforcement in the early West.",category:"Social",stars:4,section:"Conflict and Tension"},
{id:"aw_ct002",topic:"American West",period:"American West",era:"1830–1895",yearNum:1850,year:"1850",event:"Pinkerton Agency formed by Allan Pinkerton",significance:"Allan Pinkerton founded the Pinkerton National Detective Agency in Chicago. It became the most famous private law enforcement agency in the West, hired by railroad and mining companies to protect their interests. The Pinkertons hunted notorious outlaws including Jesse James and Butch Cassidy.",category:"Social",stars:3,section:"Conflict and Tension"},
{id:"aw_ct003",topic:"American West",period:"American West",era:"1830–1895",yearNum:1861.1,year:"1861",event:"Start of the American Civil War — 7 southern states secede",significance:"Seven southern states seceded from the USA to form the Confederacy, later joined by four more. The Civil War lasted four years and killed 600,000 Americans. It had major consequences for the West: it drew the army away from the Plains, emboldened Plains Indians, and created the conditions for the post-war cattle boom.",category:"Political",stars:5,section:"Conflict and Tension"},
{id:"aw_ct004",topic:"American West",period:"American West",era:"1830–1895",yearNum:1865.1,year:"1865",event:"End of the American Civil War — 600,000 dead; slavery abolished",significance:"The Civil War ended with Union victory. Around 600,000 Americans had died and 400,000 were wounded. The Emancipation Proclamation abolished slavery. Thousands of demobilised soldiers — both Union and Confederate — headed west, dramatically increasing the population of the Plains and bringing with them a culture of violence.",category:"Political",stars:5,section:"Conflict and Tension"},
{id:"aw_ct005",topic:"American West",period:"American West",era:"1830–1895",yearNum:1866.1,year:"1866",event:"Reno Gang carries out first train robbery — escapes with $16,000",significance:"The Reno Gang carried out the first peacetime train robbery in US history, breaking into an express safe and escaping with $16,000. Train robbery became one of the defining crimes of the West. The Reno Brothers were eventually caught and lynched by vigilantes in 1868.",category:"Social",stars:3,section:"Conflict and Tension"},
{id:"aw_ct006",topic:"American West",period:"American West",era:"1830–1895",yearNum:1870.2,year:"1870",event:"Abilene hires Thomas Smith as marshal — shot dead in November 1870",significance:"After cowboys tore down a jail in Abilene, the town hired Thomas Smith as marshal. Smith was unusual in preferring to use his fists rather than guns to keep order. He was shot and killed in November 1870 whilst trying to arrest a suspected murderer — demonstrating the extreme danger faced by frontier lawmen.",category:"Social",stars:3,section:"Conflict and Tension"},
{id:"aw_ct007",topic:"American West",period:"American West",era:"1830–1895",yearNum:1871.1,year:"1871",event:"Wild Bill Hickok hired in Abilene — commanded fear but did little; eventually fired",significance:"Following Thomas Smith's death, Abilene hired James Butler 'Wild Bill' Hickok as marshal. Hickok's fearsome reputation kept some order, but he was reluctant to actually police the cowboys. He accidentally shot and killed a deputy and was eventually dismissed. His tenure illustrated the difficulty of imposing law on cattle towns.",category:"Social",stars:3,section:"Conflict and Tension"},
{id:"aw_ct008",topic:"American West",period:"American West",era:"1830–1895",yearNum:1878,year:"1878",event:"Lincoln County War — cattlemen and merchants fight for control of New Mexico",significance:"The Lincoln County War was a violent conflict between rival business and cattle interests in New Mexico Territory. It involved future outlaws including Billy the Kid. The war highlighted how weak federal law enforcement was in remote territories and how economic rivalry could escalate into open warfare.",category:"Social",stars:4,section:"Conflict and Tension"},
{id:"aw_ct009",topic:"American West",period:"American West",era:"1830–1895",yearNum:1881,year:"October 1881",event:"Gunfight at the O.K. Corral — Earps kill three of the Clanton-McLaury gang",significance:"The 30-second gunfight in Tombstone, Arizona between Wyatt Earp, his brothers and Doc Holliday against the Clanton-McLaury gang became the most famous incident in frontier law enforcement. It reflected the conflict between lawmen trying to enforce order and cowboys resistant to any control.",category:"Social",stars:4,section:"Conflict and Tension"},
{id:"aw_ct010",topic:"American West",period:"American West",era:"1830–1895",yearNum:1882,year:"1882",event:"Morgan Earp shot and killed",significance:"Morgan Earp was shot dead whilst playing billiards in Tombstone, in revenge for the O.K. Corral. Wyatt Earp launched a vendetta ride, killing several of the suspected attackers. The cycle of violence showed that even after the O.K. Corral, lawlessness remained deeply embedded in frontier communities.",category:"Social",stars:3,section:"Conflict and Tension"},
{id:"aw_ct011",topic:"American West",period:"American West",era:"1830–1895",yearNum:1892,year:"1892",event:"Johnson County War — large cattle barons hire gunmen against small ranchers",significance:"Large cattle barons in Johnson County, Wyoming hired 50 gunmen to kill suspected cattle rustlers — actually small ranchers and homesteaders competing for land and water. The intervention of the US Army prevented a massacre. The war exposed the power of big cattle interests to operate above the law.",category:"Social",stars:4,section:"Conflict and Tension"},

// ── THE DEVELOPMENT OF SETTLEMENT ───────────────────────────────────────
{id:"aw_ds001",topic:"American West",period:"American West",era:"1830–1895",yearNum:1854.1,year:"1854",event:"Self-governing windmill invented — Halladay Windmill pumps groundwater",significance:"The self-governing Halladay Windmill automatically adjusted to wind speed and could pump water from deep underground without human supervision. On the treeless, waterless Great Plains this was transformative — it allowed homesteaders to access water where none was visible on the surface.",category:"Economic",stars:4,section:"The Development of Settlement"},
{id:"aw_ds002",topic:"American West",period:"American West",era:"1830–1895",yearNum:1862.2,year:"1862",event:"Homestead Act — 160-acre homesteads for $10 filing fee; own outright after 5 years",significance:"The Homestead Act offered 160 acres of government land to anyone over 21 who paid a $10 filing fee and lived on the land for five years, built a house and planted five acres of crops. After five years they could own it outright for a further $30. Over 270 million acres were eventually claimed, though many homesteaders failed due to the harsh conditions.",category:"Political",stars:5,section:"The Development of Settlement"},
{id:"aw_ds003",topic:"American West",period:"American West",era:"1830–1895",yearNum:1862.3,year:"1862",event:"Pacific Railroad Act — government loans $16,000 per mile to build transcontinental railroad",significance:"The government loaned $16,000 per mile of track laid (rising to $48,000 in mountainous regions) and granted huge land grants to railway companies to sell. The Union Pacific started in Omaha building westwards; the Central Pacific started in Sacramento building eastwards. It was the largest infrastructure project in American history.",category:"Economic",stars:5,section:"The Development of Settlement"},
{id:"aw_ds004",topic:"American West",period:"American West",era:"1830–1895",yearNum:1869,year:"10 May 1869",event:"Transcontinental Railroad completed at Promontory Summit, Utah",significance:"The golden spike was driven at Promontory Summit, Utah, completing the first transcontinental railroad. The journey from coast to coast was reduced from months to one week. The railroad made mass settlement of the Plains possible, brought goods and people west and cattle east, and accelerated the displacement of Plains Indians.",category:"Economic",stars:5,section:"The Development of Settlement"},
{id:"aw_ds005",topic:"American West",period:"American West",era:"1830–1895",yearNum:1870.3,year:"1870",event:"Steel blades added to windmills — can withstand strong prairie winds",significance:"The addition of steel blades made windmills far more durable on the windswept Great Plains. Combined with improvements in pump design, this made reliable water supply possible across the Plains and was essential for the growth of homesteading.",category:"Economic",stars:3,section:"The Development of Settlement"},
{id:"aw_ds006",topic:"American West",period:"American West",era:"1830–1895",yearNum:1873,year:"1873",event:"Turkey Red wheat introduced by Russian Mennonites — thrives on the Great Plains",significance:"A travel agency convinced Russian Mennonite immigrants to settle in Kansas, bringing Turkey Red wheat — a hardy winter variety that grew well in the harsh Plains climate. It transformed Plains farming, providing a reliable crop that could survive drought and cold. By the 1880s Kansas was a major wheat producer.",category:"Economic",stars:4,section:"The Development of Settlement"},
{id:"aw_ds007",topic:"American West",period:"American West",era:"1830–1895",yearNum:1873.1,year:"1873",event:"Timber Culture Act — extra 160 acres if trees planted on a quarter of the claim",significance:"A homesteader could claim an extra 160 acres if they planted trees on at least a quarter of it. Trees were vital as windbreaks and provided fuel and building materials. The act was mainly successful in Minnesota where rainfall was sufficient. By 1878 an extra 16 million acres had been claimed — adding 50% to land claimed under the Homestead Act.",category:"Political",stars:3,section:"The Development of Settlement"},
{id:"aw_ds008",topic:"American West",period:"American West",era:"1830–1895",yearNum:1874.1,year:"1874",event:"Wind-powered water pump invented — further improves Plains water supply",significance:"The dedicated wind-powered water pump improved on earlier windmill designs, making water extraction from underground aquifers more efficient and reliable. It was another key piece of technology that made permanent homesteading on the dry Great Plains viable.",category:"Economic",stars:3,section:"The Development of Settlement"},
{id:"aw_ds009",topic:"American West",period:"American West",era:"1830–1895",yearNum:1875.1,year:"1875",event:"Sulky Plough — rides on steel blades; 50,000 sold in 6 years",significance:"The Sulky Plough was a ride-on steel plough designed to break up the tough weeds and prairie grass of the Great Plains. 50,000 were sold in the first six years. However, six times more walking ploughs were sold in the same period — the Sulky was expensive, early models were unstable and tipped easily, and farmers understood walking ploughs better.",category:"Economic",stars:3,section:"The Development of Settlement"},
{id:"aw_ds010",topic:"American West",period:"American West",era:"1830–1895",yearNum:1883.1,year:"1883",event:"Northern Pacific Railroad completed",significance:"The Northern Pacific Railroad connected the Great Lakes to the Pacific Northwest. It opened up the northern Plains to settlement and cattle ranching and made the Dakotas, Montana and Washington Territory accessible. It also accelerated the destruction of the northern buffalo herd.",category:"Economic",stars:3,section:"The Development of Settlement"},
{id:"aw_ds011",topic:"American West",period:"American West",era:"1830–1895",yearNum:1885.6,year:"1885",event:"President Cleveland orders white settlers out of Indian Territory",significance:"President Cleveland issued an order requiring white settlers who had illegally moved into Indian Territory to leave. It was largely ignored and impossible to enforce. The order illustrated the gap between government policy and the reality on the ground — settlers continued to encroach regardless.",category:"Political",stars:3,section:"The Development of Settlement"},
{id:"aw_ds012",topic:"American West",period:"American West",era:"1830–1895",yearNum:1886.5,year:"1886–1887",event:"The Great Die-Up — severe winter ends the open range",significance:"The catastrophic winter of 1886-87 killed between 50% and 90% of cattle across the northern Plains. Temperatures dropped to -55°C. The open range system — where cattle roamed freely — was destroyed overnight. Ranchers were forced to fence their land, provide winter feed and build shelter. It transformed the cattle industry permanently.",category:"Economic",stars:5,section:"The Development of Settlement"},
{id:"aw_ds013",topic:"American West",period:"American West",era:"1830–1895",yearNum:1887.1,year:"1887",event:"Desert Land Act — settlers in arid regions can claim 640 acres if irrigated",significance:"The Desert Land Act allowed settlers in arid western states including Wyoming to claim 640 acres of land if they agreed to irrigate it from water sources. In practice, large ranchers used it to claim water sources and then fence off surrounding land with barbed wire, blocking other farmers' access to water.",category:"Political",stars:3,section:"The Development of Settlement"},
{id:"aw_ds014",topic:"American West",period:"American West",era:"1830–1895",yearNum:1890.4,year:"1890",event:"Yosemite National Park established — first national park to protect wilderness",significance:"Yosemite in California became the first national park, established to protect wilderness areas from development. It marked a shift in attitude towards the West — from a place to be exploited and settled to a place with natural value worth preserving. It also signalled that the era of unlimited westward expansion was ending.",category:"Social",stars:3,section:"The Development of Settlement"},

// ── RANCHING AND THE CATTLE INDUSTRY ─────────────────────────────────────
{id:"aw_rc001",topic:"American West",period:"American West",era:"1830–1895",yearNum:1836.1,year:"1836",event:"Start of cattle drives from Texas to Missouri on the Shawnee Trail",significance:"Texas longhorn cattle began to be driven north to Missouri markets along the Shawnee Trail. This was the beginning of the cattle drive industry that would define the West for the next 45 years. Texas longhorns were tough, disease-resistant and could survive long drives — ideal for the purpose.",category:"Economic",stars:3,section:"Ranching and the Cattle Industry"},
{id:"aw_rc002",topic:"American West",period:"American West",era:"1830–1895",yearNum:1855,year:"1855",event:"Missouri quarantine law blocks Texas cattle — fears over Texas Fever",significance:"Missouri introduced a quarantine law blocking Texas cattle from entering the state, following outbreaks of Texas Fever (a tick-borne disease that killed domestic cattle while leaving longhorns unaffected). This closed the main northern market and forced cattlemen to find alternative routes and destinations.",category:"Economic",stars:3,section:"Ranching and the Cattle Industry"},
{id:"aw_rc003",topic:"American West",period:"American West",era:"1830–1895",yearNum:1859.1,year:"1859",event:"Kansas introduces quarantine law against Texas Fever cattle",significance:"Kansas followed Missouri in banning Texas cattle, further restricting the routes available to Texas cattlemen. The combination of quarantine laws and the Civil War (which cut off southern markets) created the conditions for the post-war long drive boom when new northern markets were desperately needed.",category:"Economic",stars:3,section:"Ranching and the Cattle Industry"},
{id:"aw_rc004",topic:"American West",period:"American West",era:"1830–1895",yearNum:1861.3,year:"1861",event:"Longhorn cattle numbers boom as Civil War cuts off markets",significance:"The Civil War cut off Texas cattlemen from their markets. With no buyers, cattle were left to roam free and breed unchecked. By 1865 there were an estimated 5 million longhorns in Texas — worth $4 each in Texas but up to $40 in northern cities — creating enormous potential profit for anyone who could get them there.",category:"Economic",stars:4,section:"Ranching and the Cattle Industry"},
{id:"aw_rc005",topic:"American West",period:"American West",era:"1830–1895",yearNum:1861.4,year:"1861",event:"John Iliff buys cattle herd for $500 and fattens them on Colorado Plains",significance:"John Iliff bought a small herd for $500 and pioneered open range ranching on the Colorado Plains, fattening cattle on the nutritious buffalo grass. He would eventually own 16,000 acres of open range. Iliff demonstrated that the Great Plains — far from being a barren wasteland — could support enormous cattle ranches.",category:"Economic",stars:3,section:"Ranching and the Cattle Industry"},
{id:"aw_rc006",topic:"American West",period:"American West",era:"1830–1895",yearNum:1866.5,year:"1866",event:"Kansas farmers block cattle drive to Sedalia, Missouri",significance:"Armed Kansas farmers physically blocked a Texas cattle drive heading to Sedalia, Missouri, fearing Texas Fever would infect their livestock. The incident highlighted the growing conflict between the cattle industry and farming communities and pushed cattlemen to find dedicated cattle trail routes away from settled farmland.",category:"Economic",stars:3,section:"Ranching and the Cattle Industry"},
{id:"aw_rc007",topic:"American West",period:"American West",era:"1830–1895",yearNum:1866.6,year:"1866",event:"Goodnight-Loving Trail — 2,000 cattle driven through Comanche territory; sold for 4x Texas price",significance:"Charles Goodnight and Oliver Loving drove 2,000 cattle through hostile Comanche territory to Fort Sumner, New Mexico, with 18 cowboys. They sold 800 cattle to feed the starving Navajo population for $12,000 — four times the Texas price. The trail was extended to Cheyenne, Wyoming in 1868 and became one of the great cattle routes.",category:"Economic",stars:4,section:"Ranching and the Cattle Industry"},
{id:"aw_rc008",topic:"American West",period:"American West",era:"1830–1895",yearNum:1867,year:"1867",event:"Kansas relaxes quarantine law — Texan cattle allowed west of settled farmland",significance:"Kansas relaxed its quarantine law to allow Texan cattle through the state as long as they kept to the west of where farmers had already settled. This created a clear corridor for the cattle drives and was crucial to Joseph McCoy's plan to build a dedicated cattle shipping town at Abilene.",category:"Economic",stars:3,section:"Ranching and the Cattle Industry"},
{id:"aw_rc009",topic:"American West",period:"American West",era:"1830–1895",yearNum:1867.1,year:"1867",event:"Abilene becomes first cow town — population grows from 500 to 7,000",significance:"Joseph McCoy established Abilene in Kansas as the first dedicated cattle town — a place where Texas cattle drives could meet the railroad. He built stockyards, hotels and a saloon. Abilene's population exploded from 500 to 7,000 as cowboys, traders and merchants flooded in. It was the model for all subsequent cow towns.",category:"Economic",stars:5,section:"Ranching and the Cattle Industry"},
{id:"aw_rc010",topic:"American West",period:"American West",era:"1830–1895",yearNum:1868.3,year:"1868",event:"Goodnight-Loving Trail extended to Cheyenne, Wyoming",significance:"The extension of the Goodnight-Loving Trail northward to Cheyenne opened up Wyoming and Montana as markets for Texas cattle. It connected Texas ranches to the Northern Pacific Railroad and the booming northern markets, making the long drive economically viable on an even larger scale.",category:"Economic",stars:3,section:"Ranching and the Cattle Industry"},
{id:"aw_rc011",topic:"American West",period:"American West",era:"1830–1895",yearNum:1870.4,year:"1870",event:"Open ranching begins on Great Plains — Iliff's ranch grows to 16,000 acres",significance:"John Iliff's ranch expanded to 16,000 acres of open range, pioneering the open range model where cattle grazed freely on unfenced government land. Other ranchers followed and by the mid-1870s vast open range operations covered millions of acres of the Great Plains.",category:"Economic",stars:3,section:"Ranching and the Cattle Industry"},
{id:"aw_rc012",topic:"American West",period:"American West",era:"1830–1895",yearNum:1872,year:"1867–1872",event:"3 million cattle driven on the Chisholm Trail",significance:"Between 1867 and 1872, around 3 million cattle were driven along the Chisholm Trail from Texas to Abilene, Kansas. The Chisholm Trail was the most important cattle route of the era — a 1,000-mile journey taking two to three months. At its peak, around 500,000 cattle per year made the journey.",category:"Economic",stars:4,section:"Ranching and the Cattle Industry"},
{id:"aw_rc013",topic:"American West",period:"American West",era:"1830–1895",yearNum:1874.2,year:"1874",event:"Barbed wire begins mass production — cheaper and more effective than timber fencing",significance:"Joseph Glidden's barbed wire began mass production in 1874. It was far cheaper than timber (which was scarce on the treeless Plains) and more effective at containing livestock than smooth wire. Farmers used it to fence off crops and protect them from cattle. Its widespread use ended the open range and caused bitter conflict between ranchers and homesteaders.",category:"Economic",stars:5,section:"Ranching and the Cattle Industry"},
{id:"aw_rc014",topic:"American West",period:"American West",era:"1830–1895",yearNum:1875.2,year:"1875",event:"Refrigerated rail cars introduced — beef can be exported to distant markets",significance:"The invention of refrigerated rail cars meant that beef could be transported long distances without spoiling. This transformed the cattle industry — cattle no longer needed to be driven alive to markets but could be slaughtered in Chicago and shipped nationally. It accelerated the growth of the meatpacking industry and reduced the need for long cattle drives.",category:"Economic",stars:4,section:"Ranching and the Cattle Industry"},
{id:"aw_rc015",topic:"American West",period:"American West",era:"1830–1895",yearNum:1880,year:"1880",event:"Barbed wire cost 10x cheaper than 1874 — widely adopted across the Plains",significance:"By 1880 the cost of barbed wire had fallen to one tenth of its 1874 price due to mass production. It was now affordable for even small homesteaders. Its widespread adoption transformed the Plains landscape from open range to fenced farmland and accelerated the end of the open range cattle system.",category:"Economic",stars:3,section:"Ranching and the Cattle Industry"},
{id:"aw_rc016",topic:"American West",period:"American West",era:"1830–1895",yearNum:1881.2,year:"1881",event:"Last long cattle drive to Dodge City",significance:"The last major long cattle drive to Dodge City marked the effective end of the great trail drive era. Barbed wire fencing, the expansion of the railroad network (which could now reach Texas directly), and the spread of farming made the traditional long drive increasingly impractical and expensive.",category:"Economic",stars:3,section:"Ranching and the Cattle Industry"},
{id:"aw_rc017",topic:"American West",period:"American West",era:"1830–1895",yearNum:1883.2,year:"1883",event:"Buffalo hunters find the northern herd eliminated",significance:"By 1883 the great northern buffalo herd had been completely destroyed by commercial hunters. An estimated 30 million buffalo had roamed the Plains in 1800; by 1883 fewer than 1,000 remained. The destruction of the buffalo was devastating for Plains Indians whose entire way of life depended on it, and was partly a deliberate government policy to starve them into submission.",category:"Economic",stars:5,section:"Ranching and the Cattle Industry"},

function sm2(srs,grade){
  let{ef=2.5,interval=1,reps=0,due=null}=srs||{};
  if(grade<3){reps=0;interval=1;}
  else{
    reps++;
    if(reps===1)interval=1;
    else if(reps===2)interval=6;
    else interval=Math.round(interval*ef);
    ef=Math.max(1.3,ef+(0.1-(3-grade)*(0.08+(3-grade)*0.02)));
  }
  const d=new Date();d.setDate(d.getDate()+interval);
  return{ef,interval,reps,due:d.toISOString().slice(0,10)};
}
function isDue(srs){if(!srs||!srs.due)return true;return srs.due<=new Date().toISOString().slice(0,10);}
function dueCount(){return allQ().filter(q=>isDue(qSRS(q.id))).length;}

function allQ(){

  const all=[...DB,...S.custom,...S.pending];
  for(const q of all){
    if(seen.has(q.id))continue;seen.add(q.id);
    if(S.hidden.has(q.id))continue;
    out.push(q);
  }
  return out;
}
function allQincHidden(){
  const seen=new Set();const out=[];
  for(const q of[...DB,...S.custom,...S.pending]){
    if(seen.has(q.id))continue;seen.add(q.id);out.push(q);
  }
  return out;
}

// USERNAME & LEADERBOARD
// Stable userKey (random UUID) stored in localStorage — never changes.
// Username is just a display name inside the KV value, freely editable.
// ════════════════════════════════════════════════
function getUsername(){
  return localStorage.getItem('dv_username') || localStorage.getItem('qv_username') || null;
}
function setUsername(u){
  localStorage.setItem('dv_username',u);
  localStorage.setItem('qv_username',u); // keep in sync with QuoteVault
}
function getUserKey(){
  // Stable KV key shared across both vaults — never changes even if username changes
  let k=localStorage.getItem('lb_userKey');
  if(!k){
    k=localStorage.getItem('qv_userKey'); // try other vault's copy
  }
  return k||null;
}
function setUserKey(k){
  localStorage.setItem('lb_userKey',k);
  localStorage.setItem('qv_userKey',k); // keep in sync
}

async function lbUpdate(){
  const u=getUsername();
  if(!u)return;
  const myPending=S.pending.filter(p=>p._submittedByMe);
  const payload={
    username:u,site:'dv',mastered:S.mastered.size,xp:S.xp,
    mastered_ids:[...S.mastered].map(String),
    pending_ids:myPending.map(p=>String(p.id)),
    pending_data:myPending,
    theme:(S.settings&&S.settings.theme)||'default',
    streak:S.streak,max_streak:S.maxStreak
  };
  const k=getUserKey();
  if(k)payload.userKey=k;
  try{
    const r=await fetch(WORKER_URL+'/lb/register',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const d=await r.json();
    // Cache the stable userKey returned by the worker
    if(d.userKey&&d.userKey!==k)setUserKey(d.userKey);
  }catch(e){/* non-fatal */}
}

// Called any time mastery is granted — prompts for username if not set, then posts
// ── Sync FROM worker on load (multi-device support) ──
async function syncFromWorker(){
  const k=getUserKey();
  if(!k)return;
  try{
    const r=await fetch(WORKER_URL+'/lb/get?userKey='+encodeURIComponent(k));
    if(!r.ok)return;
    const d=await r.json();
    if(!d.found||!d.user)return;
    const u=d.user;
    // Sync username
    if(u.username&&!getUsername()){setUsername(u.username);}
    // Sync XP — take the higher of local vs remote (XP never decreases)
    const remoteXP=u.dv_xp||0;
    if(remoteXP>S.xp){
      S.xp=remoteXP;
      toast(`☁️ XP synced from cloud (${remoteXP} XP)`,2500);
    }
    // Sync streak — also restore lastXpDate so addXP doesn't reset a synced streak
    const remoteStreak=u.streak||0;const remoteMaxStreak=u.max_streak||0;
    if(remoteStreak>S.streak){
      S.streak=remoteStreak;
      if(!S.lastXpDate){
        S.lastXpDate=new Date().toISOString().slice(0,10);
        localStorage.setItem('dv_lastxpdate',S.lastXpDate);
      }
    }
    if(remoteMaxStreak>S.maxStreak){S.maxStreak=remoteMaxStreak;}
    // Sync theme
    if(u.theme){
      const localTheme=(S.settings&&S.settings.theme)||'default';
      if(u.theme&&u.theme!==localTheme){
        applyTheme(u.theme);
        if(S.settings)S.settings.theme=u.theme;
      }
    }
    // Merge mastered IDs
    const remoteMastered=Array.isArray(u.dv_mastered_ids)?u.dv_mastered_ids:[];
    if(remoteMastered.length>S.mastered.size){
      let added=0;
      remoteMastered.forEach(id=>{
        const numId=+id;
        const key=Number.isFinite(numId)&&String(numId)===String(id)?numId:id;
        if(!S.mastered.has(key)&&!S.mastered.has(String(key))){
          S.mastered.add(key);S.masteryPts[key]=100;added++;
        }
      });
      if(added>0){save();toast(`☁️ Synced ${added} mastered date${added===1?'':'s'} from cloud`,3000);}
    }
    // Sync pending submissions from other devices
    const remotePending=Array.isArray(u.dv_pending_data)?u.dv_pending_data:[];
    if(remotePending.length>0){
      const localPendingIds=new Set(S.pending.map(p=>String(p.id)));
      let syncedPending=0;
      remotePending.forEach(item=>{
        if(!localPendingIds.has(String(item.id))){
          S.pending.push({...item,_submittedByMe:true,_status:'pending'});
          syncedPending++;
        }
      });
      if(syncedPending>0){save();toast(`☁️ Synced ${syncedPending} pending submission${syncedPending===1?'':'s'}`,3000);}
    }
    // Check for rejections
    const rejectedIds=Array.isArray(u.dv_rejected_ids)?u.dv_rejected_ids:[];
    if(rejectedIds.length>0){
      const acknowledgedIds=new Set(JSON.parse(localStorage.getItem('dv_rej_ack')||'[]').map(String));
      const myRejected=S.pending.filter(p=>p._submittedByMe&&rejectedIds.includes(String(p.id))&&!acknowledgedIds.has(String(p.id)));
      if(myRejected.length>0){
        promptRejectedFacts(myRejected,rejectedIds);
        return;
      }
    }
    save();render();
  }catch(e){/* non-fatal */}
}

function promptRejectedFacts(rejected,allRejectedIds){
  const names=rejected.map(q=>`"${(q.event||q.year||'fact').slice(0,40)}"`).join(', ');
  const msg=rejected.length===1
    ?`Your submitted fact ${names} was reviewed and not approved. Would you like to remove it from your library?`
    :`${rejected.length} of your submitted facts were not approved: ${names}. Would you like to remove them from your library?`;
  openModal(`<div>
    <div style="font-family:'Playfair Display',serif;font-size:1rem;color:var(--coral);margin-bottom:8px">📋 Submission Update</div>
    <div style="font-size:.78rem;color:var(--text2);margin-bottom:14px;line-height:1.6">${msg}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn br" onclick="dismissRejectedFacts(true)">🗑 Remove from my library</button>
      <button class="btn" onclick="dismissRejectedFacts(false)">Keep for now</button>
    </div>
  </div>`);
  window._pendingRejectedIds=allRejectedIds;
  window._pendingRejected=rejected;
}

function dismissRejectedFacts(remove){
  const rejectedIds=window._pendingRejectedIds||[];
  if(remove){
    const rejSet=new Set(rejectedIds.map(String));
    S.pending=S.pending.filter(p=>!rejSet.has(String(p.id)));
    save();
    const k=getUserKey();
    if(k){
      // Clear pending AND rejected IDs on server so they don't reappear
      fetch(WORKER_URL+'/lb/register',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({userKey:k,username:getUsername(),site:'dv',mastered:S.mastered.size,xp:S.xp,
          mastered_ids:[...S.mastered].map(String),pending_ids:[],pending_data:[]})
      }).catch(()=>{});
    }
    // Clear the local acknowledgement store too
    const existing=JSON.parse(localStorage.getItem('dv_rej_ack')||'[]');
    const cleaned=existing.filter(id=>!rejectedIds.map(String).includes(String(id)));
    localStorage.setItem('dv_rej_ack',JSON.stringify(cleaned));
  }else{
    // "Keep for now" — remember these IDs so we don't prompt again next load
    const existing=JSON.parse(localStorage.getItem('dv_rej_ack')||'[]');
    const merged=[...new Set([...existing.map(String),...rejectedIds.map(String)])];
    localStorage.setItem('dv_rej_ack',JSON.stringify(merged));
    // Mark the pending entries locally so they show as rejected in the UI
    S.pending=S.pending.map(p=>rejectedIds.map(String).includes(String(p.id))?{...p,_rejected:true}:p);
    save();
  }
  window._pendingRejectedIds=null;window._pendingRejected=null;
  closeModal();save();render();
}

async function lbConfirmUsername(){

  const oldName=getUsername();
  const isSameUser=oldName&&oldName.toLowerCase()===v.toLowerCase();
  const myKey=getUserKey();
  // Check if the new username is taken by a DIFFERENT user
  // (skip check if it's just a case change of our own name)
  if(!isSameUser){
    try{
      const r=await fetch(WORKER_URL+'/lb/get?username='+encodeURIComponent(v));

  setUsername(v);
  closeModal();
  toast('👤 Username '+(oldName&&!isSameUser?'changed to: ':'set: ')+v);
  if(window._lbCb){window._lbCb();window._lbCb=null;}
  // Push to worker — sends our stable userKey so it updates the same KV entry, not create a new one
  lbUpdate();
}

function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function pct(n,d){return d?Math.round(n/d*100):0;}
function addXP(n){
  S.xp+=n;
  if(n>0){
    const today=new Date().toISOString().slice(0,10);
    if(S.lastXpDate!==today){
      const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
      if(S.lastXpDate===yesterday){
        S.streak++;
      } else if(S.lastXpDate===''){
        S.streak=1; // first ever XP
      } else {
        S.streak=1; // missed a day — reset
      }
      S.lastXpDate=today;
      if(S.streak>S.maxStreak)S.maxStreak=S.streak;
      streakSyncToServer();
    }
  }
  save();
}
function streakSyncToServer(){
  const u=getUsername();const k=getUserKey();
  if(!u||!k)return;
  fetch(WORKER_URL+'/lb/streak',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({userKey:k,streak:S.streak,max_streak:S.maxStreak})}).catch(()=>{});
}

// MASTERY POINTS ENGINE
// ════════════════════════════════════════════════
// Each item has a hidden score 0–100. Reaching 100 → mastered. Dropping to 0 → unlearned.
function getMPts(id){return S.masteryPts[id]||0;}
function addMPts(id, delta){
  const cur=getMPts(id);
  const next=Math.max(0,Math.min(100,cur+delta));
  S.masteryPts[id]=next;
  const wasMastered=S.mastered.has(id);
  const wasLearning=S.learning.has(id);
  if(next>=100&&!wasMastered){
    S.mastered.add(id);S.learning.delete(id);
    addXP(0);// save happens in onMastery/save chain
    onMastery();
    toast('⭐ Mastered! +10 XP');addXP(10);
  } else if(next>=30&&!wasLearning&&!wasMastered){
    S.learning.add(id);
  } else if(next<30&&wasLearning&&!wasMastered){
    S.learning.delete(id);
  } else if(next<50&&wasMastered){
    S.mastered.delete(id);S.learning.add(id);
    toast('📉 Mastery lost — keep practising');
  }
  save();
}
// Mastery% for display — uses masteryPts if set, else falls back to SRS
function mastPct(id){
  if(S.mastered.has(id))return 100;
  const pts=getMPts(id);
  if(pts>0)return Math.min(99,pts);
  // fallback to SRS reps
  const srs=qSRS(id);
  return S.learning.has(id)?Math.min(29,Math.round(((srs.reps||0)/4)*25)):Math.min(10,(srs.reps||0)*3);
}
function mastColor(pct){
  return pct>=100?'var(--teal)':pct>=60?'var(--gold)':pct>=30?'var(--amber)':'var(--purple2)';
}
function topics(){return['All',...new Set(allQ().map(q=>q.topic))];}
function periods(topic){const qs=topic==='All'?allQ():allQ().filter(q=>q.topic===topic);return['All',...new Set(qs.map(q=>q.period))];}
function backBtn(){return S.hist.length?`<button class="bback" onclick="goBack()">← Back</button>`:''}
function normQ(s){return s.toLowerCase().replace(/[^a-z0-9 ',.-]/g,'').replace(/\s+/g,' ').trim();}
function lev(a,b){
  if(!a.length)return b.length;if(!b.length)return a.length;
  const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];
  for(let j=0;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    m[i][j]=a[i-1]===b[j-1]?m[i-1][j-1]:1+Math.min(m[i-1][j],m[i][j-1],m[i-1][j-1]);
  return m[a.length][b.length];
}
function wordSim(wa,wb){
  // Each word in wa: exact match or close (levenshtein ≤2) to any word in wb
  let matched=0;
  wa.forEach(w=>{
    if(wb.has(w)){matched++;return;}
    for(const bw of wb){if(w.length>3&&bw.length>3&&lev(w,bw)<=2){matched++;return;}}
  });
  return wa.length&&wb.size?(2*matched)/(wa.length+wb.size):0;
}
function sim(a,b){
  const na=normQ(a),nb=normQ(b);
  if(na===nb)return 1;
  // direct levenshtein for short strings
  if(na.length<=30&&nb.length<=30){
    const d=lev(na,nb);const mx=Math.max(na.length,nb.length);
    const levScore=1-d/mx;
    if(levScore>0.8)return levScore;
  }
  const wa=na.split(' ').filter(w=>w.length>2);
  const wb=new Set(nb.split(' ').filter(w=>w.length>2));
  if(!wa.length||!wb.size)return 0;
  return wordSim(wa,wb);
}
function bestMatch(inp,pool){
  let best=0,q=null;
  pool.forEach(p=>{const s=sim(inp,p.event+' '+p.year);if(s>best){best=s;q=p;}});
  return{score:best,quote:q};
}

function toggleHidden(id){
  if(S.hidden.has(id))S.hidden.delete(id);
  else{S.hidden.add(id);S.mastered.delete(id);S.learning.delete(id);}
  save();render();
}
function removeMastery(id){
  S.mastered.delete(id);S.learning.delete(id);S.masteryPts[id]=0;save();render();toast('🗑 Mastery reset for this date');
}
function rateSRS(id,grade){
  // grade: 1=Blackout, 2=Hard, 3=Good, 4=Easy, 5=Perfect
  const srsGrade=grade<=1?0:grade<=2?1:grade<=3?2:grade<=4?3:3; // map to SM2 0-3
  const srs=sm2(qSRS(id),srsGrade);setQSRS(id,srs);
  // Mastery points: Blackout=-30, Hard=-15, Good=+8, Easy=+12, Perfect=+16
  const mDelta=[0,-30,-15,8,12,16][grade]||0;
  addMPts(id,mDelta);
  // XP
  const xpMap=[0,2,3,8,12,15][grade]||0;
  if(xpMap>0)addXP(xpMap);
  // Next card
  const srsTopic=S.srs.topic||'All';
  let remaining=allQ().filter(q=>q.id!==id&&isDue(qSRS(q.id)));
  if(srsTopic!=='All')remaining=remaining.filter(q=>q.topic===srsTopic);
  S.srs_q=remaining.length>0?shuf(remaining)[0]:null;
  S.srs_show=false;
  save();render();
}

function fcRandom(){
  const pool=(S.fc.topic==='All'?allQ():allQ().filter(q=>q.topic===S.fc.topic));
  S.fc.idx=Math.floor(Math.random()*pool.length);
  S.fc.flipped=false;render();
}
function rateFC(id,grade){
  // grade: 0=Blackout,1=Hard,2=Good,3=Easy,4=Mastered
  const mDeltas=[-30,-15,8,12,16];
  const mDelta=mDeltas[grade]??0;
  addMPts(id,mDelta);
  const srsGrade=grade===0?0:grade===1?1:grade===2?2:3;
  const srs=sm2(qSRS(id),srsGrade);setQSRS(id,srs);
  const xpMap=[0,2,8,12,20];addXP(xpMap[grade]||0);
  S.fc.idx++;S.fc.flipped=false;
  save();toast(grade>=4?'⭐ Mastered! +20 XP':`+${xpMap[grade]||0} XP`);render();
}

// QUIZ — with difficulty ramping

function rQuiz(){
  if(!S.quiz.active)return rQuizSetup();
  if(S.quiz.idx>=S.quiz.qs.length)return rQuizEnd();
  return rQuizQ();
}
function rQuizSetup(){
  return`<div>
  ${backBtn()}
  <div class="pt">Quiz</div>
  <div class="ps">Questions get harder as you go — early rounds test recognition, later rounds test precise dates and significance</div>
  <div class="card" style="max-width:400px">

    <div class="fg"><label>Quiz type</label><select id="qt">
      <option value="adaptive">🎯 Adaptive (gets harder — recommended)</option>

      <option value="event_to_date">Event given → what year/date?</option>
