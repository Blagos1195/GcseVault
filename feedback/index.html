  --amber:#f5a623;--green:#3ecf8e;--red:#ff4d4d;
  --accent:#9b7ee0;--muted:#9a98b5;

body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  padding:20px;
  border-bottom:1px solid var(--border);
}

h1{
  margin:0;
  font-size:1.5rem;
}

nav{
  display:flex;
  gap:12px;
  margin-top:10px;
  flex-wrap:wrap;
}

nav a{
  color:var(--accent);
  text-decoration:none;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
}

label{
  display:block;
  margin-top:16px;
  margin-bottom:6px;
  font-weight:600;
}

input,
select,
textarea{
  width:100%;
  box-sizing:border-box;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--bg3);
  color:var(--text);
}

textarea{
  min-height:180px;
  resize:vertical;
}

button{
  margin-top:20px;
  border:none;
  padding:12px 18px;
  border-radius:8px;
  cursor:pointer;
  background:var(--accent);
  color:white;
  font-weight:600;
}

button:hover{
  opacity:.9;
}

.status{
  margin-top:15px;
}

.small{
  color:var(--muted);
  font-size:.9rem;
}

.success{
  color:#52d273;
}

.error{
  color:#ff6b6b;
}
</style>

<body>

<header>
  <h1>GCSE Vault Feedback</h1>

  <nav>
    <a href="/GcseVault/dates/">DateVault</a>
    <a href="/GcseVault/quotes/">QuoteVault</a>
    <a href="/GcseVault/feedback/">Feedback & Bugs</a>
  </nav>
</header>

<div class="container">

  <div class="card">

    <p class="small">
      Submit feature requests, bug reports, or general feedback.
    </p>

    <form id="feedbackForm">

      <label for="type">Type</label>

      <select id="type" required>
        <option value="Feature Request">Feature Request</option>
        <option value="Bug Report">Bug Report</option>
        <option value="General Feedback">General Feedback</option>
      </select>

      <label for="title">Title</label>

      <input
        id="title"
        maxlength="150"
        required
      >

      <label for="description">Description</label>

      <textarea
        id="description"
        maxlength="5000"
        required
      ></textarea>

      <label for="device">
        Device (optional)
      </label>

      <input
        id="device"
        placeholder="PC, Laptop, Mobile, Tablet..."
      >

      <label for="version">
        App Version (optional)
      </label>

      <input
        id="version"
        placeholder="1.0.0"
      >

      <button type="submit">
        Submit Feedback
      </button>

    </form>

    <div
      id="status"
      class="status"
    ></div>

  </div>

</div>

// COLOUR THEMES (read-only — applies & syncs, no builder)
// ════════════════════════════════════════════════
function _getReadOnlyAllThemes(){
  try{
    const dvCustom=JSON.parse(localStorage.getItem('dv_custom_themes')||'{}');
    const qvCustom=JSON.parse(localStorage.getItem('qv_custom_themes')||'{}');
    return{...THEMES,...dvCustom,...qvCustom};
  }catch{return THEMES;}
}

function applyTheme(key){
  const all=_getReadOnlyAllThemes();
  const t=all[key]||THEMES['default'];
  const root=document.documentElement.style;
  Object.entries(t).forEach(([k,v])=>{if(k.startsWith('--'))root.setProperty(k,v);});
}

function initTheme(){
  const k=localStorage.getItem('vt_theme')||'default';
  applyTheme(k);
}

// Stay in sync when theme changes in another tab/vault
window.addEventListener('storage',e=>{
  if(e.key==='vt_theme'&&e.newValue)applyTheme(e.newValue);
});
/* ===========================
   Feedback Submission
=========================== */

const WORKER_URL =
  "https://quotevault-api.noah-l-barker.workers.dev";

const form =
  document.getElementById(
    "feedbackForm"
  );

const statusBox =
  document.getElementById(
    "status"
  );

form.addEventListener(
  "submit",
  async (e)=>{

    e.preventDefault();

    statusBox.textContent =
      "Submitting...";

    try{

      const payload = {

        type:
          document.getElementById("type").value,

        title:
          document.getElementById("title").value.trim(),

        description:
          document.getElementById("description").value.trim(),

        device:
          document.getElementById("device").value.trim(),

        browser:
          navigator.userAgent,

        appVersion:
          document.getElementById("version").value.trim(),

        sourceApplication:
          "Feedback"

      };

      const response =
        await fetch(
          WORKER_URL +
          "/feedback/submit",
          {
            method:"POST",
            headers:{
              "Content-Type":
              "application/json"
            },
            body:
              JSON.stringify(payload)
          }
        );

      const data =
        await response.json();

      if(!response.ok){
        throw new Error(
          data.error ||
          "Submission failed"
        );
      }

      statusBox.innerHTML =
        `<span class="success">
          Feedback submitted successfully.
        </span>`;

      form.reset();

    }
    catch(err){

      statusBox.innerHTML =
        `<span class="error">
          ${err.message}
        </span>`;
    }

  }
);
initTheme();
